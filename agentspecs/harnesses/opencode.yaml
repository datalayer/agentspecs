# OpenCode speaks ACP itself: `opencode acp` (opencode.ai/docs/acp); the
# npm package is opencode-ai.

id: opencode
version: 0.0.1
name: OpenCode
description: Anomaly's open coding agent, which speaks ACP itself with opencode acp; any model provider it is configured with.
docs: https://opencode.ai/docs/acp/

acp:
  command: npx
  args: ["-y", "opencode-ai@1.19.0", "acp"]
  protocol_version: 1
  load_session: false
  mcp: lend
  modes: []

requires:
  secrets: [ANTHROPIC_API_KEY]
  binaries: [node, git]

terms:
  served_to_third_parties: permitted
  licence: MIT

skills:
  format: skill-md
  dir: .opencode/skills

honours:
  model: true
  subagents: false

instructions_file: AGENTS.md

tags: [harness]
