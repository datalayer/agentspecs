# Codex over ACP, through the Agent Client Protocol project's adapter (the
# former @zed-industries/codex-acp, archived on 22 July 2026; it ships a
# compatible @openai/codex with it).

id: codex
version: 0.0.1
name: Codex
description: OpenAI's coding agent, driven over ACP through the Agent Client Protocol project's adapter, which ships the Codex binary it drives. On Datalayer its model calls go through Datalayer's ai-inference, answered from AWS Bedrock on the platform's models and paid in credits, with no key of the account's.
docs: https://github.com/agentclientprotocol/codex-acp

acp:
  command: npx
  args: ["-y", "@agentclientprotocol/codex-acp@2.2.2"]
  protocol_version: 1
  load_session: true
  mcp: lend
  modes: [read-only, workspace-write, agent, agent-full-access]
  native_session: none
  env:
    NO_BROWSER: "1"

requires:
  # Local only: run with `loop --harness`, the CLI or a laptop demo, it takes this
  # key from the environment. On a Datalayer runtime no key is given: it is given a
  # configuration directory (CODEX_HOME) naming ai-inference's Responses route,
  # answered from AWS Bedrock, with no token in it. No call reaches OpenAI.
  secrets: [OPENAI_API_KEY]
  binaries: [node, git]

terms:
  served_to_third_parties: api_key_only
  licence: Apache-2.0 (adapter); OpenAI Terms of Use (the agent)

skills:
  format: skill-md
  dir: .agents/skills

honours:
  model: true
  subagents: false

# What a session may rely on of it (MH-20): read by swap, clone and resume,
# never guessed per harness in code. `images` is the claim `initialize`'s
# promptCapabilities must confirm; `native_session` is the drill's to answer.
capabilities:
  resume: load
  fork_history: replay
  interrupt: true
  steering: false
  images: true
  compaction: own
  modes: [read-only, workspace-write, agent, agent-full-access]

instructions_file: AGENTS.md

tags: [harness]
