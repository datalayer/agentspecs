# Claude Code over ACP, through the Agent Client Protocol project's adapter
# (the former @zed-industries/claude-agent-acp: its repository moved to
# github.com/agentclientprotocol/claude-agent-acp, and the npm package with
# it; the Zed-scoped package stopped at 0.23.1 in March 2026).

id: claude-code
version: 0.0.1
name: Claude Code
description: Anthropic's coding agent, driven over ACP through the Agent Client Protocol project's adapter on the Claude Agent SDK.
docs: https://github.com/agentclientprotocol/claude-agent-acp

acp:
  command: npx
  args: ["-y", "@agentclientprotocol/claude-agent-acp@0.91.0"]
  protocol_version: 1
  load_session: true
  mcp: lend
  modes: [default, plan, acceptEdits, bypassPermissions]
  native_session: none

requires:
  secrets: [ANTHROPIC_API_KEY]
  binaries: [node, git]

terms:
  served_to_third_parties: api_key_only
  licence: Apache-2.0 (adapter); Anthropic Commercial Terms of Service (the agent)

skills:
  format: skill-md
  dir: .claude/skills

honours:
  model: true
  subagents: false

# What a session may rely on of it (MH-20): read by swap, clone and resume,
# never guessed per harness in code. `images` is the claim `initialize`'s
# promptCapabilities must confirm; `native_session` is the drill's to answer.
capabilities:
  resume: load
  fork_history: replay
  interrupt: true
  steering: false
  images: true
  compaction: own
  modes: [default, plan, acceptEdits, bypassPermissions]

instructions_file: CLAUDE.md

tags: [harness]
