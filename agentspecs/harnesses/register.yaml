# The register of harnesses (SH-04), checked on 2026-10-15.
#
# Every harness of the catalogue, with its adapter and the version pinned,
# its licence and where that was read, the agent's terms and where they were
# read, the credential it takes, and whether serving it to third parties is
# permitted. The catalogue's loader reads it: a harness without an entry, or
# whose spec disagrees with its entry, does not load (tests/test_harnesses.py).
#
# Reviewed by counsel: not yet.

reviewed_by_counsel: false
checked_on: "2026-10-15"

entries:
  - harness: claude-code
    adapter: "@agentclientprotocol/claude-agent-acp"
    version: 0.91.0
    licence: Apache-2.0 (adapter); Anthropic Commercial Terms of Service (the agent)
    licence_source: https://www.npmjs.com/package/@agentclientprotocol/claude-agent-acp
    terms_source: https://code.claude.com/docs/en/legal-and-compliance
    credential: Locally, an Anthropic API key (ANTHROPIC_API_KEY), the person's own; on Datalayer none, its calls answered from AWS Bedrock through ai-inference in credits
    served_to_third_parties: api_key_only
    binaries: Node 22 (engines.node >=22 on npm), git
    note: >-
      Anthropic's legal page (read 2026-10-15): running Claude Code in hosted sandboxes or agent
      infrastructure requires the Commercial Terms; each end user authenticates with their own
      API key or subscription; developers may not route requests through Free, Pro or Max plan
      credentials on behalf of their users, nor collect or intermediate Claude.ai credentials.
      So only API keys are taken; a subscription login is refused. The npm package moved from
      @zed-industries (0.23.1, March 2026) to @agentclientprotocol. On a Datalayer runtime the end
      user holds no key and Anthropic is not reached: the model calls are AWS Bedrock's, on
      Datalayer's account, metered in credits. The user decided on 30 October 2026 to offer it to
      customers on Datalayer that way. Counsel has not reviewed this entry's api_key_only reading
      against that use.
  - harness: codex
    adapter: "@agentclientprotocol/codex-acp"
    version: 2.2.2
    licence: Apache-2.0 (adapter); OpenAI Terms of Use (the agent)
    licence_source: https://www.npmjs.com/package/@agentclientprotocol/codex-acp
    terms_source: https://learn.chatgpt.com/docs/auth
    credential: Locally, an OpenAI API key (OPENAI_API_KEY or CODEX_API_KEY), the person's own; on Datalayer none, its calls answered from AWS Bedrock through ai-inference in credits
    served_to_third_parties: api_key_only
    binaries: Node 22 (as the Agent Client Protocol project's adapters; unstated on npm), git
    note: >-
      Codex's authentication page (read 2026-10-15) recommends API keys for automation and
      device-code login for headless machines; a ChatGPT login needs a browser and is hidden with
      NO_BROWSER=1 in the adapter. Only API keys are taken; a ChatGPT login is refused. The
      Zed-scoped package was archived on 22 July 2026 and names this one. On a Datalayer runtime the
      end user holds no key and OpenAI is not reached: the model calls are AWS Bedrock's, on
      Datalayer's account, metered in credits. The user decided on 30 October 2026 to offer it that
      way. Counsel has not reviewed this entry's api_key_only reading against that use, nor whether
      running Codex on another vendor's model fits OpenAI's terms.
  - harness: gemini-cli
    adapter: "@google/gemini-cli"
    version: 0.64.0
    licence: Apache-2.0 (the agent); Gemini API or Gemini Code Assist terms (the model)
    licence_source: https://www.npmjs.com/package/@google/gemini-cli
    terms_source: https://developers.google.com/gemini-code-assist/resources/privacy-notice-gemini-code-assist-individuals
    credential: A Gemini API key (GEMINI_API_KEY), the person's own; or a Google login on a Code Assist Standard or Enterprise subscription
    served_to_third_parties: api_key_only
    tier_restrictions: Gemini Code Assist Standard or Enterprise for a Google login (the individuals tier stopped being served on 18 June 2026); a Gemini API key otherwise
    binaries: Node 20 or later (engines.node >=20 on npm), git
    note: >-
      Google's notice (read 2026-10-15): "Starting June 18, 2026, Gemini Code Assist IDE
      extensions stopped serving requests for the Gemini Code Assist for individuals"; Standard
      and Enterprise follow a separate schedule. The ACP flag is --experimental-acp in the CLI
      reference (docs/cli/cli-reference.md).
  - harness: goose
    adapter: goose
    version: 1.54.0
    licence: Apache-2.0
    licence_source: https://github.com/aaif-goose/goose
    terms_source: https://github.com/aaif-goose/goose/blob/main/LICENSE
    credential: The provider's key goose is configured with (GOOSE_PROVIDER); ANTHROPIC_API_KEY declared
    served_to_third_parties: permitted
    binaries: The goose CLI (release v1.54.0 of 8 October 2026), git
    note: >-
      Open source under Apache-2.0, no vendor terms of its own; the model provider's terms apply
      to the key. Launched as goose acp (documentation/docs/gdk/acp/index.md).
  - harness: opencode
