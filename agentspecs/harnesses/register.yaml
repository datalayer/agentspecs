  # own page, its command cross-checked against the ACP registry
  # (cdn.agentclientprotocol.com/registry/v1/latest/registry.json), the project's own
  # documentation winning where they differ. Listed, not drilled yet: none is offered,
  # and naming one is refused in that sentence until SH-55's method drills it and a spec
  # moves it to the catalogue. `refused` cites the clause; `unknown` says what was not read.

