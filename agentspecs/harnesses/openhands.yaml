# OpenHands speaks ACP itself: `openhands acp` (its CLI). Its model and key
# are LLM_MODEL and LLM_API_KEY, honoured with --override-with-envs.

id: openhands
version: 0.0.1
name: OpenHands
description: The OpenHands CLI, which speaks ACP itself with openhands acp; any model provider it is configured with.
docs: https://docs.openhands.dev/openhands/usage/run-openhands/acp

acp:
  command: uvx
  args: ["--from", "openhands==1.16.0", "openhands", "acp", "--override-with-envs"]
  protocol_version: 1
  load_session: true
  mcp: lend
  modes: [always-ask, always-approve, llm-approve]

requires:
  secrets: [LLM_API_KEY]
  binaries: [uvx, git]

terms:
  served_to_third_parties: permitted
  licence: MIT

skills:
  format: skill-md
  dir: .agents/skills

honours:
  model: true
  subagents: false

instructions_file: AGENTS.md

tags: [harness]
