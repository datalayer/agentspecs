# pi (@earendil-works/pi-coding-agent) speaks no ACP itself: it is driven
# through pi-acp, an adapter that speaks ACP JSON-RPC over stdio to the
# client and spawns the published `pi` executable (`pi --mode rpc`) from the
# PATH, bridging the two — chosen over @automatalabs/pi-acp, which embeds an
# older pi (0.87.1) in process rather than launching 1.4.0 as published. Both
# packages install into the Shield's prefix; the runtime image carries them.

id: pi
version: 0.0.1
name: pi
description: Earendil's pi coding agent, driven over ACP through the pi-acp adapter, which spawns the published pi executable; any model provider pi is configured with. On Datalayer its model calls go through Datalayer's ai-inference, answered from AWS Bedrock on the platform's models and paid in credits, with no key of the account's.
docs: https://github.com/svkozak/pi-acp

acp:
  command: npx
  args: ["-y", "pi-acp@0.0.34"]
  protocol_version: 1
  load_session: true
  mcp: lend
  modes: []
  native_session: none

requires:
  # Local only: run with `loop --harness`, the CLI or a laptop demo, it takes this
  # key from the environment. On a Datalayer runtime no key is given: pi is given a
  # configuration directory (PI_CODING_AGENT_DIR) naming ai-inference's
  # Anthropic-shaped route, with no token in it.
  secrets: [ANTHROPIC_API_KEY]
  binaries: [node, git]

terms:
  served_to_third_parties: permitted
  licence: MIT (adapter); MIT (the agent, @earendil-works/pi-coding-agent 1.4.0)

skills:
  format: skill-md
  dir: .pi/skills

honours:
  model: true
  subagents: false

# What a session may rely on of it (MH-20): read by swap, clone and resume,
# never guessed per harness in code. `images` is the claim `initialize`'s
# promptCapabilities must confirm; `native_session` is the drill's to answer.
capabilities:
  resume: load
  fork_history: replay
  interrupt: true
  steering: false
  images: false
  compaction: own
  modes: []

instructions_file: AGENTS.md

tags: [harness]
