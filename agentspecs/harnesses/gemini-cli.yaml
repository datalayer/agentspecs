# Gemini CLI speaks ACP itself: `gemini --experimental-acp` (its CLI
# reference). Gemini Code Assist for individuals stopped being served on
# 18 June 2026: a Google login needs a Standard or Enterprise subscription;
# an API key is the other credential.

id: gemini-cli
version: 0.0.1
name: Gemini CLI
description: Google's coding agent, which speaks ACP itself when started with --experimental-acp.
docs: https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md

acp:
  command: npx
  args: ["-y", "@google/gemini-cli@0.64.0", "--experimental-acp"]
  protocol_version: 1
  load_session: false
  mcp: lend
  modes: [default, auto_edit, yolo, plan]
  native_session: none

requires:
  secrets: [GEMINI_API_KEY]
  binaries: [node, git]

terms:
  served_to_third_parties: api_key_only
  licence: Apache-2.0 (the agent); Gemini API or Gemini Code Assist terms (the model)
  tier_restrictions: Gemini Code Assist Standard or Enterprise for a Google login (the individuals tier stopped being served on 18 June 2026); a Gemini API key otherwise

skills:
  format: skill-md
  dir: .gemini/skills

honours:
  model: true
  subagents: false

# What a session may rely on of it (MH-20): read by swap, clone and resume,
# never guessed per harness in code. `images` is the claim `initialize`'s
# promptCapabilities must confirm; `native_session` is the drill's to answer.
capabilities:
  resume: none
  fork_history: replay
  interrupt: true
  steering: false
  images: true
  compaction: own
  modes: [default, auto_edit, yolo, plan]

instructions_file: GEMINI.md

tags: [harness]
