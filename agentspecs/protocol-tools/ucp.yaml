# UCP 2026-08-25 shopping, as Datalayer's gateway serves it (its `ucp` toolset,
# AGENT_PROTOCOLS PI-10) over agent-runtimes' `UcpClient` (PR-31), which names
# its operations without the prefix. A merchant connection is `ucp:<domain>`.
id: ucp
name: Universal Commerce Protocol
description: Shopping at a merchant over UCP.
connection: ucp

actions:
  checked: "2026-10-13"
  note: >-
    Completing a checkout pays: the exact purchase is always asked of the
    person first, and made at most once (decided 2026-10-13: test merchants
    only, no real payment).
  tools:
    ucp_search: read
    ucp_get_checkout: read
    ucp_create_checkout: write
    ucp_update_checkout: write
    ucp_cancel_checkout: write
    ucp_complete: buy
