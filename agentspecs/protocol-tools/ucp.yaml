# UCP 2026-08-25 shopping operations, as agent-runtimes' `UcpClient` makes them
# (AGENT_PROTOCOLS PR-31). A merchant connection is `ucp:<domain>`.
id: ucp
name: Universal Commerce Protocol
description: Shopping at a merchant over UCP.
connection: ucp

actions:
  checked: "2026-10-12"
  note: >-
    Proposing a completion only reads the checkout and records the exact
    revision the person approves; completing it pays.
  tools:
    search: read
    propose_completion: read
    get_checkout: read
    create_checkout: write
    update_checkout: write
    cancel_checkout: write
    complete: buy
