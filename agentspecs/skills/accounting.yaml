id: accounting
version: 0.0.1
name: Accounting Skill
description: Accounting over CSV books — ledgers reconciled, the variance between two periods, open invoices aged and an audit-ready close summary

module: datalayer_skills.skills.accounting

dependencies:
  - pandas>=2.0.0

# Offered on the platform (the user, 7 November 2026): the runtime image installs datalayer-skills[skills].
enabled: true

install:
  type: python
  command: "pip install \"datalayer-skills[skills]\""
  note: "datalayer-skills with every skill's dependencies; the runtime image installs it the same way."

tags:
  - accounting
  - finance
  - reconciliation
  - close

icon: "@primer/octicons-react:book"
emoji: "🧮"

# The UI plugins it brings to the chat that uses it (agentspecs 0.0.196):
# injected after the agent's own while it is in use.
ui:
  - plugin: bank-reconciliation
    renderer: a2ui
  - plugin: trial-balance
  - plugin: vat-summary
