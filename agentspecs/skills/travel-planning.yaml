# One of the Voyager's skills (the user, 15 November 2026), implemented in
# datalayer-skills (0.5.0) as `travel-planning`: its SKILL.md holds the instructions.

id: travel-planning
version: 0.0.1
name: Travel Planning Skill
description: Plan a trip end to end — dates, destinations, travellers, preferences and budget first, then three trip options, each with its transport, stay, daily schedule, travel times, a map link, a budget with its total and the booking links

module: datalayer_skills.skills.travel_planning

dependencies:
  - datalayer-skills>=0.5.0

# Offered on the platform: the runtime image installs datalayer-skills (0.5.0 and later).
enabled: true

install:
  type: python
  command: "pip install \"datalayer-skills>=0.5.0\""
  note: "Instructions alone: no dependencies of its own."

tags:
  - travel
  - planning
  - itinerary
  - budget

icon: "@primer/octicons-react:milestone"
emoji: "🧭"

# The UI plugins it brings to the chat that uses it (agentspecs 0.0.196):
# injected after the agent's own while it is in use.
ui:
  - plugin: trip-itinerary
  - plugin: trip-budget
  - plugin: trip-summary
