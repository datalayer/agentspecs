# The agent's events on Datalayer: its script asks the agent runtime it runs beside
# (/api/v1/owner/events on the pod's loopback, agent-runtimes 1.8.7, datalayer-skills
# 0.7.10), which asks the AI Agents events API with the identity it holds. No key is in the
# sandbox and no person sets a variable, so envvars lists none: whether the skill is ready
# is the runtime's to say.

id: events
version: 0.0.1
name: Events Skill
description: The agent's events on Datalayer — created, read, listed and updated

module: datalayer_skills.skills.events

dependencies:
  - datalayer-skills>=0.7.10

# Offered on the platform (the user, 7 November 2026): the runtime image installs datalayer-skills[skills].
enabled: true

install:
  type: python
  command: "pip install \"datalayer-skills>=0.7.10\""
  note: "Standard library only in a runtime, which records the events as the account it runs for (agent-runtimes 1.8.7). By hand outside a runtime: DATALAYER_API_KEY."

tags:
  - events
  - orchestration
  - automation

icon: "@primer/octicons-react:calendar"
emoji: 📅