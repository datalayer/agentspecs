# One of the four memory skills of datalayer-skills (0.2.0): its script asks the agent
# runtime beside it, on the pod's loopback, which keeps the memory under the runtime
# owner's account and the agent. Standard library only: no key, no egress.

id: datalayer-memory-search
version: 0.0.1
name: Recall Skill
description: Search what the agent remembers of the person about a topic, the closest memories first

module: datalayer_skills.skills.memory_search

dependencies:
  - datalayer-skills>=0.2.0

# Offered on the platform: the runtime image installs datalayer-skills.
enabled: true

install:
  type: python
  command: "pip install \"datalayer-skills>=0.2.0\""
  note: "Standard library only; the agent runtime keeps the memory (mem0), for the person the runtime runs for and this agent."

tags:
  - memory
  - datalayer
  - recall
  - search

icon: "@primer/octicons-react:search"
emoji: "🔎"
