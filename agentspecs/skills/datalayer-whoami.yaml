# The identity skill of datalayer-skills: its script asks the agent runtime it runs beside
# who it runs for (GET /api/v1/owner on the pod's loopback, agent-runtimes 1.8.7,
# datalayer-skills 0.7.10), and the runtime answers with the identity it holds. No key is
# in the sandbox and no person sets a variable, so envvars lists none: whether the skill is
# ready is the runtime's to say (it holds an identity, or it runs for nobody).

id: datalayer-whoami
# The version the agents name it by (datalayer-whoami:1.0.0), the skill's own.
version: 1.0.0
name: Who Am I Skill
description: The Datalayer account the agent runs for — its handle, name, email, roles and avatar

module: datalayer_skills.skills.whoami

dependencies:
  - datalayer-skills>=0.7.10

# Offered on the platform: the runtime image installs datalayer-skills.
enabled: true

install:
  type: python
  command: "pip install \"datalayer-skills>=0.7.10\""
  note: "Standard library only in a runtime, which says who it runs for (agent-runtimes 1.8.7). By hand outside a runtime: DATALAYER_API_KEY and DATALAYER_RUN_URL, with datalayer-core."

tags:
  - datalayer
  - identity
  - iam

icon: "@primer/octicons-react:id-badge"
emoji: "🪪"
