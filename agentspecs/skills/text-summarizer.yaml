id: text-summarizer
version: 0.0.1
name: Text Summarizer Skill
description: Summarize text content using extractive and abstractive techniques. Use when the user asks for summaries, key points, or condensed versions of documents.

# Variant 2: package + method reference
# Attributes (license, compatibility, allowed-tools, metadata) are read
# from the SKILL.md packaged inside the Python package at runtime.
package: agent_skills.skills.text_summarizer
method: summarize_text

dependencies:
  - agent-skills>=0.0.1

# Offered on the platform (the user, 7 November 2026): the runtime image installs agent-skills[skills].
enabled: true

install:
  type: python
  command: "pip install agent-skills"
  note: "No dependencies of its own."

tags:
  - nlp
  - summarization
  - text-processing

icon: "@primer/octicons-react:note"
emoji: 📝
