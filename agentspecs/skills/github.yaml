id: github
version: 0.0.1
name: GitHub Skill
description: GitHub repository management and code operations

module: agent_skills.skills.github

envvars:
  - GITHUB_TOKEN:0.0.1

dependencies:
  - PyGithub>=2.1.0

# Offered on the platform (the user, 7 November 2026): the runtime image installs agent-skills[skills].
enabled: true

install:
  type: python
  command: "pip install \"agent-skills[skills]\""
  note: "agent-skills with every skill's dependencies; the runtime image installs it the same way."

tags:
  - github
  - git
  - code

icon: "@datalayer/icons-react:github-mark"
emoji: 🐙
