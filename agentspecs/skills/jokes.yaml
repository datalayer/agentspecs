id: jokes
version: 0.0.1
name: Jokes Skill
description: One joke on request, by topic or at random, from a small bundled list.

# Module-based like the others since agent-skills 1.2.1 (7 November 2026): the path form
# needed a skills folder the pod does not configure, so the skill never loaded there.
module: agent_skills.skills.jokes

# Offered on the platform (the user, 7 November 2026): the runtime image installs agent-skills[skills].
enabled: true

install:
  type: python
  command: "pip install agent-skills"
  note: "No dependencies of its own."

tags:
  - fun
  - humor
  - demo

icon: "@primer/octicons-react:smiley"
emoji: 😄
