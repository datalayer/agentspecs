id: crawl
version: 0.0.1
name: Web Crawl Skill
description: Web pages fetched, JavaScript-rendered ones included, their text, links and tables extracted, and a site crawled within its robots rules

module: datalayer_skills.skills.crawl

# No variable: its scripts fetch the pages themselves (requests, Playwright)
# and read no key. Web search is the tavily MCP server's, with its own key.
envvars: []

dependencies:
  - requests>=2.31.0
  - beautifulsoup4>=4.12.0

# Not offered on the platform yet: the integrations page lists it as not available.
enabled: true

install:
  type: python
  command: "pip install \"datalayer-skills[skills]\""
  note: "datalayer-skills with every skill's dependencies; the runtime image installs it the same way."

tags:
  - web
  - crawl
  - scraping

icon: "@primer/octicons-react:globe"
emoji: 🌐
