# Reactor tools: a Reactor plugin's commands and its backend, as tools.
#
# A Reactor plugin has two halves an agent can drive. Its *commands* run in
# the browser — `reactor.executeCommand('decks.nextSlide')` is what the
# keystroke does — and are exposed as frontend tools, executed where the
# plugin is mounted. Its *backend* is the Python half's HTTP API, and is
# exposed as embedded tools the harness calls from the server (pydantic-ai,
# vercel-ai) or, in a browser loop, from the page.
#
# An agent takes the whole bundle with `reactor_tools: [decks:0.0.1]`.

id: decks
version: 0.0.1
name: Decks
description: >-
  Presentations described as data: list, open and steer decks in the page,
  and read or write the decks the server keeps.
tags:
  - reactor
  - decks
  - presentations
enabled: true

# The plugin whose commands these are, so a host can check it is mounted.
plugin: "@datalayer/decks"

# Commands, executed in the browser through the reactor. `command` is the
# reactor command id; `name` is what the model calls. Parameters, when a
# command takes an argument, are JSON Schema and are passed whole.
frontend:
  - name: decks_list
    command: decks.list
    description: Close the open deck and show the list of decks.
  - name: decks_open
    command: decks.open
    description: >-
      Open a deck by its id — `collection/slug`, or `slug` for a deck without
      a collection — optionally at a slide.
    parameters:
      type: object
      properties:
        id:
          type: string
          description: The deck id, as listed by decks_list_decks.
        slide:
          type: integer
          description: 1-based slide to open at. The first when omitted.
      required: [id]
  - name: decks_go_to_slide
    command: decks.goToSlide
    description: Move the open deck to a slide.
    parameters:
      type: object
      properties:
        slide:
          type: integer
          description: 1-based slide number.
      required: [slide]
  - name: decks_next_slide
    command: decks.nextSlide
    description: Advance the open deck by one slide.
  - name: decks_previous_slide
    command: decks.previousSlide
    description: Go back one slide in the open deck.
  - name: decks_present
    command: decks.present
    description: Put the open deck in fullscreen, or leave fullscreen.
  - name: decks_print
    command: decks.print
    description: Open the print view of the open deck in a new tab, for Save as PDF.

# The Python half: `datalayer_decks` serves these on the reactor backend.
# Properties named in the path are substituted; the rest go as query
# parameters for GET and DELETE and as the JSON body otherwise.
backend:
  base_url: http://127.0.0.1:8797
  base_url_envvar: DATALAYER_DECKS_URL
  tools:
    - name: decks_list_decks
      method: GET
      path: /decks
      description: Every deck the server holds, with its id, collection, slug and spec.
    - name: decks_get_deck
      method: GET
      path: /decks/{id}
      description: One deck's full spec by id.
      parameters:
        type: object
        properties:
          id:
            type: string
            description: The deck id, `collection/slug` or `slug`.
        required: [id]
    - name: decks_create_deck
      method: POST
      path: /decks
      description: >-
        Create a deck from a spec. The spec is `{deck: {title, subtitle?,
        template?}, slides: [...]}`; each slide has a `type` (title, section,
        bullets, two-columns, code, statement, metrics, chart, timeline,
        comparison, image) and the fields that type needs.
      parameters:
        type: object
        properties:
          collection:
            type: string
            description: Optional family the deck belongs to.
          slug:
            type: string
            description: URL-safe name; becomes the address.
          spec:
            type: object
            description: The deck specification.
        required: [slug, spec]
    - name: decks_update_deck
      method: PUT
      path: /decks/{id}
      description: Replace a deck. The whole record is sent again; keep the slug to keep the address.
      parameters:
        type: object
        properties:
          id:
            type: string
            description: The deck to replace, `collection/slug` or `slug`.
          collection:
            type: string
          slug:
            type: string
          spec:
            type: object
            description: The whole new specification.
        required: [id, slug, spec]
    - name: decks_delete_deck
      method: DELETE
      path: /decks/{id}
      description: Delete a deck. Irreversible; ask first.
      approval: manual
      parameters:
        type: object
        properties:
          id:
            type: string
        required: [id]

icon: project
emoji: "📊"
