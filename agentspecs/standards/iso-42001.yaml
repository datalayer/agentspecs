# Standard: ISO/IEC 42001:2023, read through AIUC-1's crosswalk at
# https://standard.aiuc-1.com/crosswalks/iso-42001 on 2026-10-15. Each clause names the
# AIUC-1 controls that cover it (covered_by) and how far (coverage).

id: iso-42001
version: '2023'
name: ISO/IEC 42001:2023
description: >-
  The international standard for an AI management system: clauses 4 to 10 of the management system and
  the Annex A controls. Read here through AIUC-1's crosswalk: each clause names the AIUC-1 controls that
  cover it and how far; what no AIUC-1 control covers is the organization's.
enabled: true
tags:
- standard
- iso-42001
- management-system
published_by: ISO/IEC
url: https://www.iso.org/standard/42001
released_on: '2023-12-18'
next_release_on: null
read_on: '2026-10-15'
read_from: https://standard.aiuc-1.com/crosswalks/iso-42001
certificate_valid_months: 36
evidence_kinds:
  documentation: Policies, contracts, plans and procedures a person wrote and signed.
  config: Code and settings that implement a control, as they run.
  logs: 'Audit trails and monitoring: what the system recorded as it ran.'
  evals: A third party's evaluation report, on the standard's cadence.
  report: A report the organization publishes or records.
  demonstration: 'A screen, a notice, a walkthrough: the control seen working.'
frameworks:
  aiuc-1: AIUC-1
maps_to: aiuc-1
domains:
- id: '4'
  name: Context of the organization
- id: '5'
  name: Leadership
- id: '6'
  name: Planning
- id: '7'
  name: Support
- id: '8'
  name: Operation
- id: '9'
  name: Performance evaluation
- id: '10'
  name: Improvement
- id: A
  name: Annex A controls
controls:
- id: '4.1'
  title: Understanding the organization and its context
  domain: '4'
  application: mandatory
  retired: false
  cadence_months: 12
  summary: >-
    The organization shall determine external and internal issues relevant to the AI management system’s
    purpose and ability to achieve intended results.
  evidence:
  - id: 4.1.1
    kind: documentation
    title: >-
      Understanding the organization and its context: the management system's own record
    required: core
  covered_by:
  - C001
  - E010
  coverage: partial
  coverage_note: AIUC-1 is focused on defining acceptable use and assessing risk of the AI system
  crosswalks:
    aiuc-1:
    - C001
