# Frontend tool set: drawings on an Excalidraw canvas in the page (the user,
# 19 November 2026: the Functional Analyst's Excalidraw tools).
#
# The tools are @datalayer/reactor-excalidraw's eleven, run in the page on
# the conversation's drawings: they reach nothing beyond the page. Their
# handlers come from agent-runtimes' `page-excalidraw` UI plugin, never from
# the spec. A drawing is addressed by its blockId, a shape by the element id
# read from the scene; an arrow between shapes is bound to both. The person
# may draw on the canvas too, and a read answers what is there. An agent that
# names this set names the `page-excalidraw` UI too.

id: page-excalidraw
version: 0.0.1
name: Excalidraw in the page
description: Draw diagrams on an Excalidraw canvas in the conversation — insert a drawing, read it, add, change, connect and delete its shapes, set its canvas, turn Mermaid into shapes — shown to the person as it is drawn, editable.
tags:
  - frontend
  - excalidraw
  - diagrams
  - page
enabled: true

toolset:
  - datalayer_excalidrawInsertNode
  - datalayer_excalidrawFromMermaid
  - datalayer_excalidrawListDrawings
  - datalayer_excalidrawReadScene
  - datalayer_excalidrawAddElements
  - datalayer_excalidrawUpdateElements
  - datalayer_excalidrawConnectElements
  - datalayer_excalidrawDeleteElements
  - datalayer_excalidrawSetAppState
  - datalayer_excalidrawResize
  - datalayer_excalidrawClearScene

icon: "@primer/octicons-react:paintbrush"
emoji: "🖌️"
