id: jupyter-notebook-edit
version: 0.0.1
name: Jupyter Notebook (edit)
description: Read and edit a notebook, and run cells — but never delete from it.
tags:
  - frontend
  - notebook
  - edit
enabled: true

# A named subset of the notebook toolset. An agent takes what it needs and
# nothing more — least privilege, said in the spec rather than hoped for.
toolset:
  - readCell
  - readAllCells
  - insertCell
  - updateCell
  - runCell
  - executeCode

icon: notebook
emoji: "📓"
