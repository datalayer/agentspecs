# The decks plugin's tools, as a frontend toolset an agent can name.
#
# Every one of these is a command of `@datalayer/decks/plugin`, declared by
# the plugin in its `AgentTools` bundle (`agentTools.json`) and run on the
# page — or on the server, for the data half — through the reactor's command
# registry. Naming the set here is how an agentspec says which page it is
# meant to sit beside; the handlers still come from the plugin, never from
# the spec.

id: decks
version: 0.0.1
name: Decks
description: Read, write and drive presentations kept as data — a deck, its slides, and the one on screen.
tags:
  - frontend
  - decks
  - presentations
enabled: true

# Data: the decks and their slides. Screen: the deck the person is looking at.
toolset:
  - decks_list_decks
  - decks_get_deck
  - decks_create_deck
  - decks_update_deck
  - decks_update_slide
  - decks_insert_slide
  - decks_delete_slide
  - decks_list_slides
  - decks_get_slide
  - decks_add_slide
  - decks_delete_deck
  - decks_list
  - decks_open
  - decks_go_to_slide
  - decks_next_slide
  - decks_previous_slide
  - decks_present
  - decks_print

icon: project
emoji: "🃏"
