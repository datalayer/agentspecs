# Frontend tool set: Mermaid diagrams in the page (the user, 19 November
# 2026: the Functional Analyst's Mermaid tools).
#
# The tools are @datalayer/reactor-mermaid's six, run in the page on the
# conversation's diagrams with Mermaid itself: they reach nothing beyond the
# page. Their handlers come from agent-runtimes' `page-mermaid` UI plugin,
# never from the spec. A source is checked with Mermaid's parser before it is
# kept, and refused with the parser's line when it does not parse. An agent
# that names this set names the `page-mermaid` UI too.

id: page-mermaid
version: 0.0.1
name: Mermaid in the page
description: Write Mermaid diagrams in the conversation — create or replace a diagram's source, read it back, check a source with Mermaid's parser, render to SVG, list the diagram types — each drawn for the person as it is written.
tags:
  - frontend
  - mermaid
  - diagrams
  - page
enabled: true

toolset:
  - mermaidSetDiagram
  - mermaidReadDiagram
  - mermaidListDiagrams
  - mermaidValidate
  - mermaidRenderSvg
  - mermaidListDiagramTypes

icon: "@primer/octicons-react:workflow"
emoji: "🧜"
