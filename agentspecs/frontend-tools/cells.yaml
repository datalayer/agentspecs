# The Cells plugin's tools, as a frontend toolset an agent can name.
#
# Every one of these is a command of `@datalayer/cells/plugin`, declared by
# the plugin in its `AgentTools` bundle (`agentTools.ts`, the `cells` bundle)
# and run on the page through the reactor's command registry, on the grid the
# person sees. Naming the set here is how an agentspec says which page it is
# meant to sit beside; the handlers still come from the plugin, never from
# the spec.

id: cells
version: 0.0.1
name: Cells
description: Read and write the spreadsheet on the person's screen, and chart it — the grid drawn by Datalayer Cells.
tags:
  - frontend
  - cells
  - spreadsheets
enabled: true

# Data: the values of a range, read or written. Charts: insert one over a
# range, list them. Screen: select a range to show the person.
toolset:
  - cells_read_range
  - cells_write_range
  - cells_insert_chart
  - cells_list_charts
  - cells_select_range

icon: "@primer/octicons-react:table"
emoji: "🧮"
