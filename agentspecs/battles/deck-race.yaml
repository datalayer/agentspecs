# Battle: The deck race. Two Deck Makers in the browser, the same brief at
# the same instant, each building its deck in the page; the first to say its
# deck is complete wins (the user, 6 November 2026: battles using the decks
# visuals).

id: deck-race
version: 0.0.1
name: Create a deck
description: >-
  Two Deck Makers get the same brief at the same instant and build a deck
  each, drawn in the page as it grows. The first to finish wins.

variant: race
goal: >-
  Create a five-slide deck that pitches a weekly team newsletter: why it
  helps, what goes in it, who writes what, and a closing call to sign up.
clock_seconds: 180
arena: deck

contestants:
  - id: blue
    name: Blue
    app: deck-maker:0.0.1
    runs_in: browser
    color: blue
  - id: red
    name: Red
    app: deck-maker:0.0.1
    runs_in: browser
    color: red
    # Red plays with Alibaba Qwen-Max (the user, 7 November 2026): the application as it is, its model overridden.
    overrides:
      model: "alibaba:qwen-max"

# The evals that confirm each contestant's result once the referee has a verdict
# (the user, 7 November 2026): the winner is declared only when its evals pass.
evals:
  - eval: max-duration:0.0.1
    config:
      max_duration_ms: 180000
    says: It finished within the clock.
  - eval: llm-judge:0.0.1
    config:
      threshold: 0.7
      # The judge reads the deck in the arena, not only the last words (B5).
      rubric: >-
        The deck in the arena has a title and at least three slides on the
        brief: why the newsletter helps, what goes in it, who writes what,
        and a closing call to sign up.
    says: It built the deck the brief asked for.

referee:
  decides_by: first_done

rehearsal:
  expects:
    - each deck has a title and at least three slides
    - a verdict within the clock

tags:
  - example
  - race
  - decks
icon: project
emoji: "🃏"
