# Battle: Pong. Two Players at the Pong arena, drawn in the page; each reads
# the arena through `arena_read`, is told where the ball is by `arena_watch`,
# and moves its paddle through the arena's frontend tools. The arena keeps
# the score: first to eleven.

id: pong
version: 0.0.1
name: Pong
description: >-
  Two Players at the Pong arena, each with a paddle and the arena's tools.
  The arena keeps the score; the first to eleven wins.

variant: game
goal: >-
  You are playing Pong. Call `arena_watch` once: the arena then tells you
  where the ball is as it moves. Read the arena with `arena_read`, move your
  paddle with `arena_pong_move` to meet the ball, serve with
  `arena_pong_serve` when it is yours. First to eleven points wins.
clock_seconds: 180
arena: pong

contestants:
  - id: left
    name: Left
    app: player:0.0.1
    runs_in: browser
    color: blue
  - id: right
    name: Right
    app: player:0.0.1
    runs_in: browser
    color: red

referee:
  decides_by: score

rehearsal:
  expects:
    - both contestants move at least once
    - a score when the clock ends

tags:
  - example
  - game
  - arena
icon: play
emoji: "🏓"
