id: webhook
version: 0.0.1
name: Webhook
description: >-
  Push results to any HTTP endpoint as they are produced, so a run
  can hand its answer straight to whatever is waiting for it.
icon: globe
supports_template: true
supports_storage: false
mime_types:
  - application/json
  - text/plain
