id: components
version: 0.0.1
name: Components
description: >-
  Deliver results as components of the catalog drawn under the answer: the
  sources as cards that open, a comparison as a table, a series as a chart,
  a choice as buttons that answer the application. Over A2A, one A2UI surface
  per artifact (`application/json+a2ui`, A2UI's media type).
# Not offered on the platform yet: the integrations page lists it as not available.
enabled: false

icon: browser
supports_template: false
supports_storage: false
mime_types:
  - application/json+a2ui
