id: default
version: 0.0.1
name: The default policy
description: 'The platform''s default, the session document every Shield decides with under the organization''s
  and the application''s: read, search, edit and move inside the workspace are done; delete, run a command,
  reach outside the workspace, a command naming a credential, sudo, a package install from the network
  or git push are asked first with the command shown; a fetch goes through the allow-list, which is empty;
  send and buy are asked.'
enabled: true
tags:
- policy
- default
policy:
  scope: session
  version: 1
  rules:
  - name: read inside the workspace
    decision: allow
    classes:
    - read
    kinds: []
    where: inside
    paths: []
    commands: []
  - name: edit and move inside the workspace
    decision: allow
    classes:
    - write
    kinds: []
    where: inside
    paths: []
    commands: []
    reason: shown as diffs
  - name: delete
    decision: ask
    classes:
    - delete
    kinds: []
    where: any
    paths: []
    commands: []
  - name: a command naming a credential
    decision: ask
    classes:
    - execute
    kinds: []
    where: any
    paths: []
    commands:
    - (?i)(api[_-]?key|secret|token|password|passwd|credential|\.env\b|id_(rsa|ed25519)|\.ssh/|\.aws/|\.netrc|\.datalayer/|datalayerrc)
    reason: the command is shown
  - name: sudo
    decision: ask
    classes:
    - execute
    kinds: []
    where: any
    paths: []
    commands:
    - (?:^|[\s;&|(])(?:sudo|doas|su)\b
    reason: the command is shown
  - name: a package install from the network
    decision: ask
    classes:
    - execute
    kinds: []
    where: any
    paths: []
    commands:
    - \b(?:pip3?|pipx|uv|npm|pnpm|yarn|bun|apt(?:-get)?|brew|cargo|gem|conda|mamba|go)(?:\s+pip)?\s+(?:install|add|i|get)\b
    reason: the command is shown
  - name: git push
    decision: ask
    classes:
    - execute
    kinds: []
    where: any
    paths: []
    commands:
    - \bgit\b[^;&|]*\bpush\b
    reason: the command is shown
  - name: run a command
    decision: ask
    classes:
    - execute
    kinds: []
    where: any
    paths: []
    commands: []
  - name: outside the workspace
    decision: ask
    classes: []
    kinds: []
    where: outside
    paths: []
    commands: []
  - name: send or buy
    decision: ask
    classes:
    - send
    - buy
    kinds: []
    where: any
    paths: []
    commands: []
  limits:
    tool_calls:
      soft: 100
      hard: 200
    terminals_open:
      soft: 4
      hard: 8
    bytes_written:
      soft: 5242880
      hard: 20971520
  network:
    fetch: []
  mcp:
    allow: []
  harnesses:
    admit: []
    credentials: account
