# Agent Specification: Example Notifications
# Runtime agent used by the notifications example for local and cloud execution.

id: example-notifications
version: 0.0.1
name: Example Notifications Agent
description: >-
  Demonstrates multi-channel notifications including in-app, email, and Slack
  style destinations with preference management.

tags:
  - monitoring
  - email
  - operations

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server

memory: ephemeral

mcp_servers: []

# No skills: the model reached for the events skill on the first opener and
# the run failed on a skill nobody had enabled; channels are the subject here.
skills: []

tools: []

# The channels the agent notifies through; the example's panel turns email
# and Slack on and gives them their targets.
notifications:
  in-app:
    enabled: true
  email:
    enabled: false
  slack:
    enabled: false

frontend_tools: []

environment_name: ai-agents-env

icon: bell
emoji: "🔔"
color: "#F59E0B"

suggestions:
  # First: a notification the panel shows at once, and the channels' state.
  - text: >-
      Send me an in-app notification titled "Hello from the example" saying
      the notifications channel works, then tell me which channels are
      enabled.
    summary: "Send an in-app notification"
  - text: >-
      Send a warning-level notification through every enabled channel about
      disk space running low, and report how each channel took it.
    summary: "Warn on every channel"
  - text: List the notifications sent so far and which are still unread.
    summary: "Unread notifications"

welcome_message: >-
  Ready to demonstrate notifications. Configure your channels and send a test
  alert to validate delivery.

system_prompt: >-
  You are the Example Notifications Agent. You notify the person through the
  channels configured for you — in-app, email, Slack — with
  `send_notification`, and you can see what was sent and how each channel
  took it with `list_notifications`. Channels are configured by the person
  in the panel beside the chat, not by you: when a channel is off or has no
  target, say so and point to the panel. Report deliveries honestly from
  the tool's answer — the local server records email rather than sending
  it. Answer in the conversation, and only with the tools you actually
  have; never call a tool you were not given.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null
