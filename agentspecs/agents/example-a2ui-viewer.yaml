# Agent Specification: A2UI Viewer
# The agent behind the A2UI Viewer example. The Viewer's own scene — a recipe
# card, a booking form, a sales snapshot, a shipping status — is drawn from
# pasted A2UI messages and needs no agent; this one answers the chat beside
# it. Its suggestions ask for those same four surfaces in words — rendered
# live through the render_a2ui_surface tool, so a reader can compare what the
# scene shows with what an agent makes of the same request — and for a few
# things to run in the code sandbox, whose outputs land in the chat.

id: example-a2ui-viewer
version: 0.0.1
name: A2UI Viewer Agent
description: >-
  Answers beside the A2UI Viewer, whose scenes — a recipe card, a booking
  form, a sales snapshot and a shipping status — it renders on request as
  live A2UI surfaces, and runs code in the sandbox to show its outputs.

tags:
  - a2ui
  - viewer
  - loop

enabled: true
protocol: vercel-ai
model: "bedrock:us.anthropic.claude-sonnet-4-6"
# The loop turns in the page by default, like the Loop Shell's agent; on a
# server target the location decides the harness, whatever is said here.
harness: vercel-ai
sandbox_variant: browser
memory: ephemeral

mcp_servers: []
skills: []

# The same generative-UI tool the A2UI Agent has: a field spec in, a
# validated A2UI surface out, drawn inline by the 'a2ui-surface' renderer.
tools:
  - example-render-a2ui-surface:0.0.1
frontend_tools: []
frontend_render_tools:
  - tool: render_a2ui_surface
    renderer: a2ui-surface

environment_name: ai-agents-env
icon: browser
emoji: 🔍
color: "#6366F1"

# One suggestion per scene of the Viewer, in the scene's own words — then
# the sandbox: the same demonstrations the Loop Shell offers, because the
# Viewer runs on the same loop and shows kernel outputs the same way.
suggestions:
  - text: Show a recipe card for a Mediterranean quinoa bowl, with a photo, its rating and review count, prep and cook time, and how many it serves.
    summary: "Recipe Card"
    emoji: "🍲"
  - text: Build a table booking form with party size, date and time, dietary requirements and a Submit Reservation button.
    summary: "Booking Form"
    emoji: "📅"
  - text: Show a Q2 sales snapshot by category — Apparel, Electronics, Home Goods and Health & Beauty — as KPI tiles under one headline.
    summary: "Sales Snapshot"
    emoji: "📈"
  - text: Show a package status card with the tracking number, the steps from placed to shipped to out for delivery, and the ETA.
    summary: "Shipping Status"
    emoji: "📦"
  - text: Plot a chart in the code sandbox and show me the image.
    summary: "Plot a chart"
    emoji: "📈"
  - text: Build a small DataFrame in the code sandbox and show it as a table.
    summary: "DataFrame as a table"
    emoji: "🧮"
  - text: Run something in the code sandbox that fails, so I can see the traceback.
    summary: "Show a traceback"
    emoji: "🐛"
  - text: Show me an interactive slider from the code sandbox.
    summary: "Interactive slider"
    emoji: "🎛️"

welcome_message: >-
  This is the A2UI Viewer. Pick a scene above to see a surface drawn from
  A2UI messages, ask me to render one of them here, or run something in the
  code sandbox and see its output.

system_prompt: |
  You answer beside the A2UI Viewer, an example that renders A2UI surfaces
  from pasted protocol messages: a recipe card, a table booking form, a sales
  snapshot of KPI tiles, and a shipping status timeline.

  When asked for a surface — one of those, or anything like them:
  1. ALWAYS call the `render_a2ui_surface` tool to produce it. Never describe
     the surface in prose instead of rendering it.
  2. Choose a concise `title` and a one-sentence `intro`.
  3. Design a sensible ordered list of `fields`, picking the best `type` for
     each: `text` / `email` for short input, `longtext` for notes, `choice`
     or `multichoice` with `options` for pick-lists, `checkbox` for yes/no,
     `slider` with `min`/`max` for ranges and ratings, `date` / `datetime`
     for scheduling. A card that shows values rather than asking for them
     still renders as a surface: put each value in a field with its label.
  4. After the tool call, reply with ONE short sentence saying what you
     rendered. Do not repeat the fields in text — the surface is shown.

  When asked to run code, use `execute_code` in the sandbox and let the
  outputs speak: a figure, a table, a traceback, a widget. Do not look for
  helpers or skills in the sandbox; write the Python yourself.

system_prompt_codemode_addons: null
trigger: null
