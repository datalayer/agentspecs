# Agent Specification: A Simple Agent
# A minimal agent with no MCP servers or skills, and one tool that decides:
# typed questions asked of Jev through datalayer-ai-inference.

id: example-simple
version: 0.0.1
name: A Simple Agent
description: >
  A simple conversational agent with one tool, decide: it asks Jev typed
  questions (yes or no with a probability, a choice, a score) through
  datalayer-ai-inference. No MCP servers, no skills beyond events.

tags:
  - workflow
  - automation
  - analysis

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
# Other models it may be switched to, beside its own: those
# datalayer-ai-inference serves from the catalogue.
model_additionals:
  - "alibaba:qwen-max"
harness: pydantic-ai

sandbox_variant: jupyter-server

# Memory backend
memory: ephemeral

# No MCP servers
mcp_servers: []

# No skills
skills:
  - events:0.0.1

# Runtime tools
backend_tools:
  - runtime-echo:0.0.1
  - decide:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1
# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: agent
emoji: 🤖
color: "#6366F1"  # Indigo

# Chat suggestions to show users what this agent can do
suggestions:
  - text: Tell me a joke
    summary: "Tell a joke"
  - text: Explain quantum computing in simple terms
    summary: "Quantum computing, simply"
  - text: Help me brainstorm ideas for a weekend project
    summary: "Weekend project ideas"
  - text: Summarize the key points of a topic I describe
    summary: "Summarize a topic"
  - text: "Is this support ticket urgent? 'Payouts have failed for 3 days.'"
    summary: "Decide: is it urgent?"
  - text: "Which team should handle: 'I was charged twice'? Billing, Tech or Sales."
    summary: "Decide: which team?"
  - text: "Score how positive this review is from 1 to 5: 'Setup took an hour, but support answered fast and it works.'"
    summary: "Decide: score a review"

# Welcome message shown when agent starts
welcome_message: >
  Hi! I'm a simple assistant. I'm happy to chat, answer questions and help
  you think through ideas, and I can decide: ask me whether a ticket is
  urgent, which team should take it, or how positive a review is.

# System prompt for the agent
system_prompt: >
  You are a helpful, friendly AI assistant. You have no MCP servers. You
  have a decide tool: when asked whether something holds (yes or no), which
  of named options fits, or where something sits on a scale, call decide
  with the text as the state and one typed question (noul, choice or score),
  then answer with what it decided and its probability or confidence. For
  anything else, answer from your training knowledge, be concise, and let
  the user know if a question is outside your knowledge.

# No code mode prompt needed for a simple agent
system_prompt_codemode_addons: null

# Optional: Jupyter notebook to show on agent creation
welcome_notebook: null

# Optional: Lexical document to show on agent creation
welcome_document: null

# No trigger — this is an interactive chat agent
trigger: null
