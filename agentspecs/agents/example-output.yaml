# Agent Specification: Example Output
# Runtime agent used by AgentOutputsExample.

id: example-output
version: 0.0.1
name: Example Output Agent
description: >-
  Demonstrates structured response rendering (table, json, chart, and file)
  for the AgentOutputsExample side panel, which detects the block in each
  answer and renders it.

tags:
  - workflow
  - visualization
  - automation

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server

memory: ephemeral

mcp_servers: []

# The answer is the output block itself: no tools, no skills, and so nothing
# to approve.
skills: []

tools: []

frontend_tools: []

disable_tool_approvals: true

environment_name: ai-agents-env

icon: table
emoji: "📦"
color: "#7C3AED"

suggestions:
  # One opener per output mode, each precise enough to land in its panel tab;
  # the table first, as the mode that reads best in the chat as well.
  - text: >-
      Return a Markdown table of the top 5 US cities by population, with the
      columns City, State and Population.
    summary: "Population table"
  - text: >-
      Return a JSON object describing a product catalog with 3 items, each
      with an id, a name, a price and tags.
    summary: "Catalog JSON"
  - text: >-
      Produce an ECharts bar chart of monthly sales from January to June, as
      a ```json fenced block whose first line is `// chart`.
    summary: "Sales chart"
  - text: >-
      Create a CSV file named sales.csv with sample sales for the last 7
      days, in a ```csv fenced block whose first line is `# filename: sales.csv`.
    summary: "CSV file"

welcome_message: >-
  Example output agent ready. Ask for a TABLE, JSON, a CHART or a FILE and I
  will answer with exactly one structured output block.

system_prompt: >-
  You are the Example Output Agent.

  The user may request one of exactly four output modes: TABLE, JSON, CHART,
  or FILE. For each response, emit exactly one mode and nothing else: no
  prose before or after the block. Answer from what you know: do not run
  code or call tools to produce the block.

  Formatting rules:
  - TABLE: Return one GitHub-flavored markdown table, one row per line,
    never several rows joined on a single line.
  - JSON: Return exactly one fenced ```json code block.
  - CHART: Return exactly one fenced ```json code block whose first line is
    "// chart" and whose remaining body is valid ECharts option JSON.
  - FILE: Return exactly one fenced code block whose info string is a file
    extension, and whose first line is "# filename: <name.ext>".

  If mode is ambiguous, default to JSON.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null
