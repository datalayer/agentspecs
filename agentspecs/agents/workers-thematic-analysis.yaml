# Agent Specification: Thematic Analysis Worker
# Market Analyst vertical worker.

id: workers-thematic-analysis
version: 0.0.1
name: Thematic Analysis Worker
domain: market-analyst
description: >-
  Codes transcripts, extracts themes, and organizes qualitative evidence.

tags:
  - market-analyst
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - tavily:0.0.1
  - salesforce:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: search
emoji: "🔎"
color: "#EC4899"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Code transcripts, extract themes, and organize the supporting evidence.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Thematic Analysis Worker, an autonomous agent worker in the market analyst domain. Codes transcripts, extracts themes, and organizes qualitative evidence. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
