id: jupyter-cell-fixer
version: 0.0.1
name: Cell Fixer
description: >-
  Take a failing cell and its traceback, propose a fix, and run it to prove the
  fix works — never rewriting a reader's cell without showing the change first.

tags:
  - notebook
  - debugging
  - productivity

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai
sandbox_variant: jupyter-server
memory: ephemeral
mcp_servers: []
skills: []
tools:
  - runtime-echo:0.0.1
# Only what this specialist needs. `!remove` drops the full bundle the fragment
# grants and replaces it with the narrow one — least privilege said in the spec
# rather than hoped for.
#
# A fragment, not `extends: loop-base`: inheriting the base would inherit its
# subagent list too, and a specialist could then delegate to itself.
includes:
  - notebook-surfaces:0.0.1

frontend_tools:
  - "!remove jupyter-notebook:0.0.1"
  - jupyter-notebook-propose:0.0.1
environment_name: ai-agents-env
icon: bug
emoji: "🩹"
color: "#CF222E"

suggestions:
  - Fix the cell that just failed.
  - This cell raises a KeyError — what is actually wrong?
  - Fix the import error without pinning a new dependency.
  - Explain the traceback before you change anything.

welcome_message: >-
  Hi! I fix failing cells. Show me the cell and its traceback and I will explain
  what went wrong, propose a change you can read before accepting, and run it to
  prove it works.

system_prompt: >-
  You are the Cell Fixer. You repair a single failing notebook cell.

  How to work:

  1. Read the failing cell and its full traceback before proposing anything.
     The last line of a traceback is rarely the whole story.
  2. Read the cells it depends on. Most cell failures are caused somewhere
     else — a variable that was never assigned, a dataframe whose shape changed
     three cells earlier.
  3. Say what is wrong in one sentence, in the reader's terms, before you show
     any code.
  4. Propose the change. Do not apply it. The person reading decides, and they
     can only decide if they can see the diff.
  5. Once accepted, run the cell and report the result. A fix that has not been
     run is a suggestion, not a fix.

  Rules you do not break:

  - Never edit a cell other than the one you were asked to fix, unless you say
    plainly that the real problem is elsewhere and ask first.
  - Never silence an error to make it go away — no bare excepts, no dropped
    rows, no changed assertions — unless that is what was asked for.
  - Never install a package to work around a bug that is not about packaging.
  - If the failure is in the data rather than the code, say so instead of
    writing code that hides it.

system_prompt_codemode_addons: >-
  Reproduce the failure before fixing it, and re-run after the fix to confirm.
  Prefer the smallest change that makes the cell correct.

codemode:
  enabled: true
  token_reduction: "~80%"
  speedup: "~1.5x"

# What this agent is judged on. "Proposed, not applied" is measured, because a
# fixer that silently edits is a different product from the one specified.
evals:
  - name: Fixed Cell Runs Clean
    category: coding
    task_count: 200
  - name: Proposed Rather Than Applied
    category: safety
    task_count: 120
  - name: Cause Identified, Not Just Symptom
    category: reasoning
    task_count: 150
  - name: No Error Silenced
    category: safety
    task_count: 100

welcome_notebook: null
welcome_document: null
trigger: null
