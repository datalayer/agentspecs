id: worker-spreadsheet-analyst
version: 0.0.1
name: Spreadsheet Analyst
description: >-
  Upload a spreadsheet and get data cleaning, summary statistics, charts,
  anomalies, and a plain-English explanation of what matters. It also compares
  two versions of a workbook (row and formula differences, what changed and why
  it matters) and builds the pivot tables, groupings, filters and charts usually
  made by hand in Excel, ready to export.

tags:
  - analysis
  - excel
  - summarization
  - workflow
  - visualization

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent
sandbox_variant: jupyter-server
memory: ephemeral
mcp_servers: []
skills:
  - events:0.0.1
backend_tools:
  - runtime-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1
environment_name: ai-agents-env
icon: table
emoji: "📊"
color: green

suggestions:
  - text: >-
      Load /home/datalayer/datasets/datalayer-nfs/titanic/titanic.xlsx with pandas.read_excel, then produce a 3-cell notebook: schema+missing values, survival breakdown, and one chart with a concise summary.
    summary: "Titanic in three cells"
  # Carried over from worker-spreadsheet-analyst, merged into this spec.
  - text: >-
      Compare /home/datalayer/datasets/datalayer-nfs/titanic/titanic_baseline.csv and /home/datalayer/datasets/datalayer-nfs/titanic/titanic_candidate.csv, then summarize schema and value-level differences.
    summary: "Compare two CSVs"
  # Carried over from worker-spreadsheet-analyst, merged into this spec.
  - text: >-
      Load /home/datalayer/datasets/datalayer-nfs/titanic/titanic.xlsx with pandas.read_excel, then replace a manual pivot-table workflow in one notebook by producing: schema+missing values, survival breakdown, and one chart with a concise summary.
    summary: "Replace the pivot table"

welcome_message: >-
  Hi! I can help with analyze an excel spreadsheet. Share data, files, or context
  and I will run the workflow end-to-end, explain what matters, and suggest
  practical next steps.

system_prompt: >-
  You are a specialized assistant for this gallery workflow: Analyze an Excel Spreadsheet.
  Objective: Upload a spreadsheet and get data cleaning, summary statistics, charts, anomalies, and a plain-English explanation of what matters.
  Use the runtime tools and notebook execution environment when needed. Keep
  outputs concise, structured, and decision-oriented. Provide clear reasoning
  and recommended next actions.

system_prompt_codemode_addons: >-
  Compose focused execution steps, validate intermediate results, and summarize
  outcomes after each run. Prefer efficient, reproducible code paths.

codemode:
  enabled: true
  token_reduction: "~80%"
  speedup: "~1.5x"

welcome_notebook: null
welcome_document: null
trigger: null

policy:
  shield:
    # Any public address: the MCP servers and tools it runs call out (agent-shield's firewall).
    egress: ["*"]
