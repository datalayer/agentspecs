# Agent Specification: Example Memory
# Runtime agent used by the memory example for local and cloud execution.

id: example-memory
version: 0.0.1
name: Example Memory Agent
description: >-
  Demonstrates durable conversational memory with the Mem0 backend.
  Persists user preferences and supports memory inspection/search.

tags:
  - customer-support
  - workflow
  - routing

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter-server

memory: mem0

mcp_servers: []

skills:
  - events:0.0.1

tools:
  - runtime-echo:0.0.1

frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

environment_name: ai-agents-env

icon: database
emoji: "🧠"
color: "#0D9488"

suggestions:
  - Remember a user preference and confirm it was stored
  - Recall previously stored preferences from memory
  - Search memory for key facts from earlier turns

welcome_message: >-
  Ready to demonstrate durable memory. I persist stable facts and preferences
  (name, preferences, constraints), and can recall them across turns/restarts.
  I do not persist every transient sentence.

system_prompt: >-
  You are the Example Memory Agent. Capture durable user preferences and key
  facts, recall them accurately when asked, and summarize memory context
  clearly. Persist only durable, user-relevant information (identity,
  long-lived preferences, standing constraints, recurring goals). Do not
  persist one-off chatter, greetings, or ephemeral filler. When asked to
  remember something, confirm what was stored and suggest verifying it in the
  Memory Inspector.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null
