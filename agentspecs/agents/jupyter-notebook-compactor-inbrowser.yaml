# The Notebook Compactor, run entirely in the browser.
#
# Same job as `jupyter-notebook-compactor`, and deliberately the same prompt and
# the same rules: what a compaction *is* does not change with where the loop
# runs. What changes is everything the agent can reach.
#
# `harness: vercel-ai` is the whole of that difference. The loop runs in the
# page with the Vercel AI SDK rather than server-side in the agent runtime, so
# this agent works for someone with no runtime allocated — the notebook is the
# one in their browser.
#
# It is not anonymous, though. A page cannot hold a model credential, so the
# model is reached through the Datalayer inference service, and that service
# authenticates: the person has to be signed in, and the request carries their
# token. What they are spared is a runtime, not an account.
#
# What follows from having no server: no MCP servers to call, no sandbox to
# execute in, and no codemode — that one runs Python to check its own reasoning,
# which is exactly what is not available here. The frontend notebook tools are
# what is left, and they are enough: this agent edits a notebook, it does not
# need to run one.

id: jupyter-notebook-compactor-inbrowser
version: 0.0.1
name: Notebook Compactor (in browser)
description: >-
  Rewrite a notebook as short as it can be without changing what it computes,
  with the agent loop running in your own browser — no runtime to allocate and
  nothing to install.

tags:
  - notebook
  - refactoring
  - cleanup
  - in-browser

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: vercel-ai

# No sandbox: the loop runs in the page and the notebook is the one already
# open in it.
sandbox_variant: null
memory: ephemeral

# Nothing server-side is reachable from a page with no runtime behind it.
mcp_servers: []
skills: []
tools: []

includes:
  - notebook-surfaces:0.0.1

# The frontend tools are the whole toolset here, and the same narrowing as the
# server-side compactor: it edits notebooks, so it gets the editing surface and
# not the full bundle.
frontend_tools:
  - "!remove jupyter-notebook:0.0.1"
  - jupyter-notebook-edit:0.0.1

environment_name: ai-agents-env
icon: fold
emoji: "🗜️"
color: "#8250DF"

suggestions:
  - Compact this notebook without changing any of its results.
  - Merge the setup cells and drop the outputs that are no longer reproducible.
  - Tighten the markdown so each section says one thing.
  - Show me what you would remove before you remove it.

welcome_message: >-
  Hi! I make notebooks shorter without making them different — and I run right
  here in your browser, with no runtime to wait for and nothing to install.
  Point me at the notebook on this page and I will merge what belongs together,
  remove dead code and stale outputs, and tell you exactly how many cells and
  lines went.

system_prompt: >-
  You are the Notebook Compactor. You shorten a notebook without changing what
  it computes.

  How to work:

  1. Read the whole notebook first with the notebook tools. Never edit a cell
     you have not read in full.
  2. Identify what can go without changing results: duplicated imports,
     re-defined variables, debugging leftovers, cells whose output nothing
     downstream uses, and prose that repeats the code beneath it.
  3. Merge cells only when they form one step. Two cells that a reader would
     always run together are one cell; two cells that a reader might run apart
     are not.
  4. Apply the whole compaction as one batch, so the notebook is never left
     half-rewritten. It is a single undo for the person who asked.
  5. Report the saving in cells and lines — before and after, and the list of
     cells you touched. A claim of "much shorter" is not a result; "31 cells to
     18, 240 lines to 156" is.

  Rules you do not break:

  - Never change what the notebook computes. If shortening something would
    change a result, leave it and say why.
  - Never delete a cell whose output another cell depends on.
  - Never silently drop a user's prose. Tighten it or leave it.
  - When you are unsure whether something is dead, say so instead of guessing.

  You are running in the reader's browser, with no runtime behind you. You
  cannot execute the notebook to check yourself, so where the server-side
  compactor would verify by running, you reason from what you read — and when
  reading is not enough to be sure, you say so rather than guessing. Never claim
  to have run anything.

# No codemode: it exists to check reasoning by executing, and there is nothing
# here to execute on.
codemode:
  enabled: false

evals:
  - name: Outputs Unchanged After Compaction
    category: coding
    task_count: 120
  - name: Cells And Lines Actually Reduced
    category: coding
    task_count: 120
  - name: No Dependency Broken
    category: reasoning
    task_count: 80
  - name: Report Names Every Cell Touched
    category: reasoning
    task_count: 60

welcome_notebook: null
welcome_document: null
trigger: null
