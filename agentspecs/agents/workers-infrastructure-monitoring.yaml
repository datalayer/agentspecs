# Agent Specification: Infrastructure Monitoring Worker
# Earth Observation vertical worker.

id: workers-infrastructure-monitoring
version: 0.0.1
name: Infrastructure Monitoring Worker
vertical: earth-observation
description: >-
  Monitors infrastructure and physical assets from satellite imagery and detects anomalies over time.

tags:
  - earth-observation
  - agent-worker

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - earthdata:0.0.1
  - tavily:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: globe
emoji: "🛰️"
color: "#10B981"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Continuously monitor infrastructure from satellite imagery and surface anomalies with supporting evidence.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Infrastructure Monitoring Worker, an autonomous agent worker in the earth observation domain. Monitors infrastructure and physical assets from satellite imagery and detects anomalies over time. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
