# Agent Specification: Bank Reconciliation Worker
# Accounting vertical worker.

id: workers-bank-reconciliation
version: 0.0.1
name: Bank Reconciler
domain: accounting
description: >-
  Reconciles bank statements against the ledger, matches transactions, and investigates exceptions.

tags:
  - accounting
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter-server

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - odoo:0.0.1

# Skills available to this agent
skills:
  - accounting:0.0.1
  - pdf:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: sync
emoji: "🧾"
color: "#F59E0B"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Reconcile bank feeds against the ledger, auto-match transactions, and flag exceptions for review.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Bank Reconciliation Worker, an autonomous agent worker in the accounting domain. Reconciles bank statements against the ledger, matches transactions, and investigates exceptions. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
