id: worker-analysis-critic
version: 0.0.1
name: Analysis Critic
description: >-
  Use a planner, executor, and critic agent loop to iteratively improve analysis
  quality and reduce logical errors in outputs. It can give each role its own
  model — one plans, one writes the code, one critiques — and keeps the version
  the critic accepts.

tags:
  - analysis
  - data-quality
  - analytics
  - workflow
  - summarization
  - automation

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent
sandbox_variant: jupyter-server
memory: ephemeral
mcp_servers: []
skills:
  - events:0.0.1
backend_tools:
  - runtime-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1
environment_name: ai-agents-env
icon: sync
emoji: "📊"
color: green

suggestions:
  - text: >-
      Use /home/datalayer/datasets/datalayer-nfs/finance/transactions_q1.csv and run a critic loop: first produce a reconciliation analysis, then critique it for gaps and publish a corrected final report.
    summary: "Critic loop on transactions"
  # Carried over from worker-analysis-critic, merged into this spec.
  - text: >-
      Use /home/datalayer/datasets/datalayer-nfs/marketing/campaign_performance.csv and orchestrate a two-agent collaboration where one analyzes and one critiques.
    summary: "Analyst and critic"

welcome_message: >-
  Hi! I can help with agent critic loop for analysis. Share data, files, or context
  and I will run the workflow end-to-end, explain what matters, and suggest
  practical next steps.

system_prompt: >-
  You are a specialized assistant for this gallery workflow: Agent Critic Loop for Analysis.
  Objective: Use a planner, executor, and critic agent loop to iteratively improve analysis quality and reduce logical errors in outputs.
  Use the runtime tools and notebook execution environment when needed. Keep
  outputs concise, structured, and decision-oriented. Provide clear reasoning
  and recommended next actions.

system_prompt_codemode_addons: >-
  Compose focused execution steps, validate intermediate results, and summarize
  outcomes after each run. Prefer efficient, reproducible code paths.

codemode:
  enabled: true
  token_reduction: "~80%"
  speedup: "~1.5x"

welcome_notebook: null
welcome_document: null
trigger: null

policy:
  shield:
    # Any public address: the MCP servers and tools it runs call out (agent-shield's firewall).
    egress: ["*"]
