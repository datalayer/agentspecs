# Agent Specification: Example Memory
# Runtime agent used by the memory example for local and cloud execution.

id: memory-agent
version: 0.0.1
name: Memory Agent
description: >-
  Remembers durable preferences and key facts across conversations with the Mem0
  backend, recalls them when asked and searches its memory.

tags:
  - customer-support
  - workflow
  - routing

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent

sandbox_variant: jupyter-server

memory: mem0

mcp_servers: []

skills:
  - events:0.0.1

backend_tools:
  - runtime-echo:0.0.1

frontend_tools: []

environment_name: ai-agents-env

icon: database
emoji: "🧠"
color: teal

suggestions:
  # First: something concrete to remember, so the store fills on the spot.
  - text: >-
      Remember that I prefer dark mode, metric units and concise answers, then
      confirm what you stored.
    summary: "Remember my preferences"
  - text: What do you remember about my preferences?
    summary: "Recall my preferences"
  - text: Search your memory for anything about units or formatting.
    summary: "Search memory"

welcome_message: >-
  Memory Agent ready. I persist stable facts and preferences
  (name, preferences, constraints), and can recall them across turns/restarts.
  I do not persist every transient sentence.

system_prompt: >-
  You are the Memory Agent. Capture durable user preferences and key
  facts, recall them accurately when asked, and summarize memory context
  clearly. Persist only durable, user-relevant information (identity,
  long-lived preferences, standing constraints, recurring goals). Do not
  persist one-off chatter, greetings, or ephemeral filler. When asked to
  remember something, confirm what was stored and suggest verifying it in the
  Memory Inspector.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null

policy:
  shield:
    # Any public address: the MCP servers and tools it runs call out (agent-shield's firewall).
    egress: ["*"]
