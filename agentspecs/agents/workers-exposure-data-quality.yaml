# Agent Specification: Exposure Data Quality Worker
# Insurance vertical worker.

id: workers-exposure-data-quality
version: 0.0.1
name: Exposure Data Quality Worker
vertical: insurance
description: >-
  Cleanses exposure data, validates geocoding, and improves data quality for risk analysis.

tags:
  - insurance
  - agent-worker

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - earthdata:0.0.1
  - tavily:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - pdf:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: shield
emoji: "🛡️"
color: "#EF4444"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Cleanse and validate exposure data and geocoding, and report remaining data-quality gaps.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Exposure Data Quality Worker, an autonomous agent worker in the insurance domain. Cleanses exposure data, validates geocoding, and improves data quality for risk analysis. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
