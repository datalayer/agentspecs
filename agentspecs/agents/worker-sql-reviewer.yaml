id: worker-sql-reviewer
version: 0.0.1
name: SQL Reviewer
domain: data-engineering
description: >-
  Review SQL queries for correctness, performance, missing filters, risky joins,
  and opportunities to simplify the analysis. It also profiles slow queries,
  finds the bottlenecks and proposes rewrites and index strategies, with before
  and after timings.

tags:
  - data-engineering
  - agent-worker
  - analysis
  - sql
  - risk
  - workflow
  - performance

# What this worker can be delegated.
# Ids come from the closed vocabulary in agent_runtimes.types.
delegable:
  - id: data.analyse
  - id: document.extract

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent
sandbox_variant: jupyter-server
memory: ephemeral
mcp_servers: []
skills:
  - events:0.0.1
backend_tools:
  - runtime-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1
environment_name: ai-agents-env
icon: code
emoji: "📊"
color: green

suggestions:
  - text: >-
      Use /home/datalayer/datasets/datalayer-nfs/sql/query_workload.sql and perform a structured SQL review with lint findings, risk notes, and an improved query draft.
    summary: "Structured SQL review"
  # Carried over from worker-sql-reviewer, merged into this spec.
  - text: >-
      Use /home/datalayer/datasets/datalayer-nfs/sql/query_workload.sql to identify query bottlenecks and propose optimized SQL with rationale.
    summary: "Query bottlenecks"

welcome_message: >-
  Hi! I can help with agent reviews sql. Share data, files, or context
  and I will run the workflow end-to-end, explain what matters, and suggest
  practical next steps.

system_prompt: >-
  You are a specialized assistant for this gallery workflow: Agent Reviews SQL.
  Objective: Review SQL queries for correctness, performance, missing filters, risky joins, and opportunities to simplify the analysis.
  Use the runtime tools and notebook execution environment when needed. Keep
  outputs concise, structured, and decision-oriented. Provide clear reasoning
  and recommended next actions.

system_prompt_codemode_addons: >-
  Compose focused execution steps, validate intermediate results, and summarize
  outcomes after each run. Prefer efficient, reproducible code paths.

codemode:
  enabled: true
  token_reduction: "~80%"
  speedup: "~1.5x"

welcome_notebook: null
welcome_document: null
trigger: null

policy:
  shield:
    # Any public address: the MCP servers and tools it runs call out (agent-shield's firewall).
    egress: ["*"]
