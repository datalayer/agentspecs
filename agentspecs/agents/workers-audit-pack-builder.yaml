# Agent Specification: Audit-Pack Builder
# Accounting vertical worker.

id: workers-audit-pack-builder
version: 0.0.1
name: Audit-Pack Builder
domain: accounting
description: >-
  Assembles auditable evidence packs from invoices, approvals, and postings across Odoo.

tags:
  - accounting
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter-server

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - odoo:0.0.1

# Skills available to this agent
skills:
  - accounting:0.0.1
  - pdf:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: file
emoji: "🧾"
color: "#F59E0B"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Assemble a complete, traceable audit-evidence pack for a given period or transaction set.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Audit-Pack Builder, an autonomous agent worker in the accounting domain. Assembles auditable evidence packs from invoices, approvals, and postings across Odoo. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
