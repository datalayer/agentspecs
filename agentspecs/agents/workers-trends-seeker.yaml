# Agent Specification: Trends Seeker
# Personal Assistant vertical worker.

id: workers-trends-seeker
version: 0.0.1
name: Trends Seeker
domain: personal-assistant
description: >-
  Tracks emerging trends across sources and summarizes what is gaining momentum.

tags:
  - personal-assistant
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-opus-4-8"
harness: pydantic-ai

sandbox_variant: jupyter-server

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - tavily:0.0.1
  - google-workspace:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1
  - events:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: graph
emoji: "🤖"
color: "#A855F7"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Track emerging trends across sources and summarize what is worth attention and why.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Trends Seeker, an autonomous agent worker in the personal assistant domain. Tracks emerging trends across sources and summarizes what is gaining momentum. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
