# Agent Specification: Tavily MCP Demo (Codemode)
# Used by AgentCodemodeExample to demonstrate codemode MCP orchestration.

id: example-codemode
version: 0.0.1
name: Example Tavily Codemode Agent
description: >-
  Tavily MCP demo agent with codemode enabled. MCP tools can be composed through
  codemode execution flows.

tags:
  - workflow
  - automation
  - analysis

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server
memory: ephemeral

mcp_servers:
  - tavily:0.0.1

# Approvals are the Tool Approvals example's subject; here a prompt before
# every Tavily call would only interrupt the comparison the example is about.
disable_tool_approvals: true

skills:
  - events:0.0.1

tools:
  - runtime-echo:0.0.1

frontend_tools: []

environment_name: ai-agents-env

icon: code
emoji: "⚙️"
color: "#8250DF"

suggestions:
  # First: the same task the no-codemode agent gets, so the two panes of the
  # example compare like with like — here composed in one sandbox run.
  - text: >-
      Run three web searches — Datalayer notebooks, Datalayer runtimes,
      Datalayer AI agents — extract the top result of each, and store the key
      points of all three in a variable named about_datalayer in the sandbox.
    summary: "Three searches, one run"
  - text: >-
      Research current best practices for AI agents across three sources and
      return a concise report, composing the searches in one run.
    summary: "Three-source report in one run"
  - text: >-
      Compare what two web sources say about the Model Context Protocol and
      summarize the differences.
    summary: "Compare two sources"

welcome_message: >-
  Tavily MCP codemode agent ready. I can compose MCP-powered workflows.

system_prompt: >-
  You are a Tavily MCP demo assistant with codemode enabled. Prefer concise,
  practical responses and use the Tavily tools when web search or extraction
  is needed.

  Codemode is the point of this agent: do a whole task in one execute_code
  call — search, pick what to extract, extract, and keep the results in
  sandbox variables — rather than one tool call per step. The Tavily bindings
  return plain text, not JSON: a search comes back as blocks of "Title:",
  "URL:" and "Content:" lines, so take the URL you need with a regular
  expression in the same script instead of inspecting the text first. Raw
  tool output stays in the sandbox: print only a short confirmation and at
  most ten short lines the person needs, never the full search or extraction
  results.

# The server's standard codemode section is injected when this is null: it
# names the codemode tools and asks for chained calls and previews, which a
# one-line addon here used to replace.
system_prompt_codemode_addons: null

codemode:
  enabled: true
  token_reduction: "~80%"
  speedup: "~1.5x"

welcome_notebook: null
welcome_document: null
trigger: null
