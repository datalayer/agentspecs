# Agent Specification: An OpenCode Agent
# An agent that is a harness of the catalogue (SH-43): OpenCode, driven over
# the Agent Client Protocol by the Datalayer runtime's adapter behind the
# Shield. Off in the shared catalogue. On Datalayer its model calls go
# through ai-inference, on the platform's models and the account's credits,
# with the runtime's token: no key of the account's is needed. Elsewhere it
# takes the ANTHROPIC_API_KEY its harness declares (the register: API keys
# only).

id: example-harness-opencode
version: 0.0.1
name: An OpenCode Agent
description: >
  OpenCode as a Datalayer agent: launched in the runtime over the Agent
  Client Protocol, its files, terminals and permissions decided by the
  Shield under the application's Rules, every action in the record. Its
  model calls go through Datalayer's ai-inference, paid in credits.

tags:
  - coding
  - harness
  - acp

enabled: false
harness: opencode

sandbox_variant: jupyter-server
memory: ephemeral

mcp_servers: []
skills: []
backend_tools: []
frontend_tools: []

environment_name: ai-agents-env
