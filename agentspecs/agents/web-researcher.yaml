# Agent Specification: Demo MCP
# Default agent used by AgentMCPExample.

id: web-researcher
version: 0.0.1
name: Web Researcher
description: >-
  Searches the web with the Tavily MCP server, tool by tool, and answers with
  concise findings and their sources.

tags:
  - research
  - analysis
  - summarization
  - workflow
  - automation

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent

sandbox_variant: jupyter-server

memory: ephemeral

mcp_servers:
  - tavily:0.0.1

# What it starts without (the user, 26 November 2026): web search, the tavily
# server, a process that reads TAVILY_API_KEY. It is started whenever the key
# is there; without it, or on an engine whose sandbox holds no secret (Kagent),
# the agent starts without search and says so.
optional:
  mcp_servers:
    - tavily:0.0.1

# Approvals are the Tool Approvals example's subject; a prompt before every
# Tavily call would only get in the way of the tools panel this example shows.
disable_tool_approvals: true

skills:
  - events:0.0.1
  - jokes:0.0.1

backend_tools:
  - runtime-echo:0.0.1

frontend_tools: []

environment_name: ai-agents-env

# Tool by tool (example-no-codemode, merged here): the Tavily tools used directly,
# no codemode; web-researcher-codemode composes them in code.
codemode:
  enabled: false

icon: globe
emoji: "🌐"
color: sky

suggestions:
  - text: Search the web for recent news about AI agents
    summary: "AI agent news"
  - text: Find trending open-source Python projects on GitHub
    summary: "Trending Python projects"
  - text: Research best practices for building RAG applications
    summary: "RAG best practices"
  - text: Compare popular JavaScript frameworks in 2024
    summary: "JavaScript frameworks 2024"
  # Carried over from web-researcher, merged into this spec.
  - text: >-
      Run three web searches — Datalayer notebooks, Datalayer runtimes,
      Datalayer AI agents — extract the top result of each, and store the key
      points of all three in a variable named about_datalayer in the sandbox.
    summary: "Three searches, tool by tool"
  - text: >-
      Search for the latest updates about Datalayer and summarize the top
      three results.
    summary: "Latest Datalayer updates"
  - text: >-
      Extract the key points from https://datalayer.ai and list them.
    summary: "Key points of one page"

welcome_message: >-
  Web Researcher ready. Ask me to search, extract, crawl, and research via
  Tavily MCP tools.

system_prompt: >-
  You are the Web Researcher. Use Tavily MCP tools for web search and research
  requests, cite concise findings, and keep responses practical and clear.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null

policy:
  shield:
    # Any public address: the MCP servers and tools it runs call out (agent-shield's firewall).
    egress: ["*"]
