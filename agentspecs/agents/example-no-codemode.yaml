# Agent Specification: Tavily MCP Demo (No Codemode)
# Used by AgentCodemodeExample to demonstrate raw MCP tool usage.

id: example-no-codemode
version: 0.0.1
name: Example Tavily No Codemode Agent
description: >-
  Tavily MCP demo agent without codemode conversion. MCP tools are used directly
  without codemode orchestration.

tags:
  - workflow
  - automation
  - analysis

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server
memory: ephemeral

mcp_servers:
  - tavily:0.0.1

# Approvals are the Tool Approvals example's subject; here a prompt before
# every Tavily call would only interrupt the comparison the example is about.
disable_tool_approvals: true

skills:
  - events:0.0.1

tools:
  - runtime-echo:0.0.1

frontend_tools: []

environment_name: ai-agents-env

icon: globe
emoji: "🌐"
color: "#0969DA"

suggestions:
  # First: the same task the codemode agent gets, so the two panes of the
  # example compare like with like — here one MCP tool call after another.
  - text: >-
      Run three web searches — Datalayer notebooks, Datalayer runtimes,
      Datalayer AI agents — extract the top result of each, and store the key
      points of all three in a variable named about_datalayer in the sandbox.
    summary: "Three searches, tool by tool"
  - text: >-
      Search for the latest updates about Datalayer and summarize the top
      three results.
    summary: "Latest Datalayer updates"
  - text: >-
      Extract the key points from https://datalayer.ai and list them.
    summary: "Key points of one page"

welcome_message: >-
  Tavily MCP no-codemode agent ready. I use MCP tools directly.

system_prompt: >-
  You are a Tavily MCP demo assistant without codemode. Use available MCP tools
  directly for search and research requests, and provide concise summaries.

system_prompt_codemode_addons: null

# Explicitly disabled codemode behavior for this variant.
codemode:
  enabled: false

welcome_notebook: null
welcome_document: null
trigger: null
