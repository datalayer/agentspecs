# Agent Specification: Demo Subagents
# Runtime agent used by AgentSubagentsExample.

id: example-subagents
version: 0.0.1
name: Example Subagents Agent
description: >-
  Demonstrates multi-agent delegation with a parent orchestrator that can split
  work between a researcher and a writer subagent.

tags:
  - research
  - workflow
  - analysis

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server

memory: ephemeral

subagents:
  includeGeneralPurpose: true
  subagents:
    - name: researcher
      description: >-
        Gathers facts and source-backed notes on a topic. Use for research,
        fact-finding, and background gathering.
      instructions: >-
        You are a meticulous research specialist. Given a topic, gather the key
        facts and return concise, source-aware notes. Prefer verifiable claims
        and flag anything uncertain.
    - name: writer
      description: >-
        Turns research notes into clear, well-structured prose. Use for
        summaries, drafts, and final write-ups.
      instructions: >-
        You are a concise writing specialist. Given notes or findings, produce
        clear, well-structured prose. Keep it focused and free of filler.

mcp_servers: []

skills:
  - events:0.0.1

tools:
  - runtime-echo:0.0.1

frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

environment_name: ai-agents-env

icon: people
emoji: "👥"
color: "#2563EB"

suggestions:
  - text: Research a topic and provide source-backed notes
  - text: Write a concise summary from the research findings
  - text: Split work between researcher and writer, then merge output

welcome_message: >-
  Subagents example agent ready. Ask me to delegate research and writing tasks
  across specialist subagents.

system_prompt: >-
  You are the Demo Subagents Orchestrator. Decompose user requests into
  specialist tasks, delegate effectively, and synthesize a coherent final
  response.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null
