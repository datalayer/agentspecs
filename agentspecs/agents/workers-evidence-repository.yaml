# Agent Specification: Evidence Repository Worker
# Market Analyst vertical worker.

id: workers-evidence-repository
version: 0.0.1
name: Evidence Curator
domain: market-analyst
description: >-
  Organizes research evidence for traceability from qualitative findings to conclusions.

tags:
  - market-analyst
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - tavily:0.0.1
  - salesforce:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: book
emoji: "🔎"
color: "#EC4899"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Organize research evidence so every conclusion traces back to its source.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Evidence Repository Worker, an autonomous agent worker in the market analyst domain. Organizes research evidence for traceability from qualitative findings to conclusions. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
