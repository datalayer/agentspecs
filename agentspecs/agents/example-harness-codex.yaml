# Agent Specification: A Codex Agent
# An agent that is a harness of the catalogue (SH-43): Codex, driven over
# the Agent Client Protocol by the Datalayer runtime's adapter behind the
# Shield. Off in the shared catalogue: it runs locally, on the person's own
# OPENAI_API_KEY (the register: API keys only). A Datalayer runtime refuses
# Codex in a sentence until ai-inference serves OpenAI's Responses API.

id: example-harness-codex
version: 0.0.1
name: A Codex Agent
description: >
  OpenAI's Codex as a local agent: launched over the Agent Client Protocol,
  its files, terminals and permissions decided by the Shield under the
  application's Rules, every action in the record. Runs locally on your own
  OPENAI_API_KEY; not offered on Datalayer.

tags:
  - coding
  - harness
  - acp

enabled: false
harness: codex

sandbox_variant: jupyter-server
memory: ephemeral

mcp_servers: []
skills: []
backend_tools: []
frontend_tools: []

environment_name: ai-agents-env
