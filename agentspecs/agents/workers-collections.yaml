# Agent Specification: Collections Worker
# Accounting vertical worker.

id: workers-collections
version: 0.0.1
name: Collections Worker
vertical: accounting
description: >-
  Follows up on overdue receivables and drafts collection communications for approval.

tags:
  - accounting
  - agent-worker

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - odoo:0.0.1

# Skills available to this agent
skills:
  - accounting:0.0.1
  - pdf:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: credit-card
emoji: "🧾"
color: "#F59E0B"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Prioritize overdue receivables and draft tailored collection follow-ups for human approval.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Collections Worker, an autonomous agent worker in the accounting domain. Follows up on overdue receivables and drafts collection communications for approval. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
