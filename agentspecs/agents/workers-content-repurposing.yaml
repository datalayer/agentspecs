# Agent Specification: Content Repurposing Worker
# Marketing vertical worker.

id: workers-content-repurposing
version: 0.0.1
name: Content Repurposing Worker
vertical: marketing
description: >-
  Adapts existing content and assets across channels and formats.

tags:
  - marketing
  - agent-worker

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - tavily:0.0.1
  - slack:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1
  - events:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1
  - SLACK_BOT_TOKEN:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: megaphone
emoji: "📣"
color: "#8B5CF6"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Repurpose existing content into channel-specific formats while keeping brand voice.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Content Repurposing Worker, an autonomous agent worker in the marketing domain. Adapts existing content and assets across channels and formats. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
