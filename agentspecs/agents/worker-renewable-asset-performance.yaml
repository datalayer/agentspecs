# Agent Specification: Renewable Asset Performance Worker
# Energy vertical worker.

id: workers-renewable-asset-performance
version: 0.0.1
name: Renewable Asset Performance Analyst
domain: energy
description: >-
  Compares expected versus actual generation, adjusts for weather, and investigates performance anomalies.

tags:
  - energy
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - tavily:0.0.1
  - chart:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: zap
emoji: "⚡"
color: "#EAB308"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Compare expected vs actual generation, weather-adjust performance, and investigate underperformance.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Renewable Asset Performance Worker, an autonomous agent worker in the energy domain. Compares expected versus actual generation, adjusts for weather, and investigates performance anomalies. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
