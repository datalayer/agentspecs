# Agent Specification: A Claude Code Agent
# An agent that is a harness of the catalogue (SHIELD.md SH-01, SH-10): Claude
# Code, driven over the Agent Client Protocol by the Datalayer runtime's
# adapter behind the Shield. Off in the shared catalogue: it needs the
# account's own ANTHROPIC_API_KEY (the register: API keys only), which the
# harness declares and the runtime is given by name.

id: example-harness-claude-code
version: 0.0.1
name: A Claude Code Agent
description: >
  Claude Code as a Datalayer agent: launched in the runtime over the Agent
  Client Protocol, its files, terminals and permissions decided by the
  Shield under the application's Rules, every action in the record. Needs
  the account's ANTHROPIC_API_KEY.

tags:
  - coding
  - harness
  - acp

enabled: false
harness: claude-code

sandbox_variant: jupyter-server
memory: ephemeral

mcp_servers: []
skills: []
backend_tools: []
frontend_tools: []

environment_name: ai-agents-env
