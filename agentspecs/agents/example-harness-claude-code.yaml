# Agent Specification: A Claude Code Agent
# An agent that is a harness of the catalogue (SH-01, SH-10): Claude
# Code, driven over the Agent Client Protocol by the Datalayer runtime's
# adapter behind the Shield. Off in the shared catalogue, and offered from
# the Studio's Toolbox. On Datalayer its model calls go through ai-inference,
# answered from AWS Bedrock in the account's credits, on no key of the
# account's. Elsewhere it takes the ANTHROPIC_API_KEY its harness declares.

id: example-harness-claude-code
version: 0.0.1
name: A Claude Code Agent
description: >
  Claude Code as a Datalayer agent: launched in the runtime over the Agent
  Client Protocol, its files, terminals and permissions decided by the
  Shield under the application's Rules, every action in the record. Its
  model calls go through Datalayer's ai-inference, paid in credits.

tags:
  - coding
  - harness
  - acp

enabled: false
harness: claude-code

sandbox_variant: jupyter-server
memory: ephemeral

mcp_servers: []
skills: []
backend_tools: []
frontend_tools: []

environment_name: ai-agents-env
