# Agent Specification: Portfolio Risk Worker
# Capital Markets vertical worker.

id: workers-portfolio-risk
version: 0.0.1
name: Portfolio Risk Worker
domain: capital-markets
description: >-
  Computes exposures and generates recurring, auditable portfolio risk reports.

tags:
  - capital-markets
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - alphavantage:0.0.1
  - chart:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - ALPHAVANTAGE_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: graph
emoji: "📈"
color: "#3B82F6"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Compute portfolio exposures and produce recurring, auditable risk reports.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Portfolio Risk Worker, an autonomous agent worker in the capital markets domain. Computes exposures and generates recurring, auditable portfolio risk reports. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
