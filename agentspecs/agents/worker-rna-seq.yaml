# Agent Specification: RNA-Seq Worker
# Life Sciences vertical worker.

id: workers-rna-seq
version: 0.0.1
name: RNA-Seq
domain: life-sciences
description: >-
  Runs RNA-seq quality control and differential expression analysis with reproducible pipelines.

tags:
  - life-sciences
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - huggingface:0.0.1
  - kaggle:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - pdf:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - HF_TOKEN:0.0.1
  - KAGGLE_API_TOKEN:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: beaker
emoji: "🧬"
color: "#06B6D4"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Run RNA-seq QC and differential expression analysis and produce reproducible, documented results.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the RNA-Seq Worker, an autonomous agent worker in the life sciences domain. Runs RNA-seq quality control and differential expression analysis with reproducible pipelines. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
