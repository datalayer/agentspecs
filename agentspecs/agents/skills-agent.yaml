# Agent Specification: Skills Demo
# Runtime agent used by AgentSkillsExample to demonstrate
# file-based and package-based skills.

id: skills-agent
version: 0.0.1
name: Skills Agent
description: >-
  Uses skills from several sources — built-in file skills and package-registered
  ones (GitHub, PDF, crawl, events) — searches the web with Tavily, and asks for
  approval before a sensitive tool.

tags:
  - workflow
  - automation
  - analysis
  - document-processing
  - human-approval
  - notebook

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent

sandbox_variant: jupyter-server

memory: ephemeral

# Carried over from example-full: web search with the tavily server, a process
# that reads TAVILY_API_KEY. It is started whenever the key is there; without
# it, or on an engine whose sandbox holds no secret (Kagent), the agent starts
# without search and says so.
mcp_servers:
  - tavily:0.0.1

optional:
  mcp_servers:
    - tavily:0.0.1

skills:
  - crawl:0.0.1
  - events:0.0.1
  - github:0.0.1
  - pdf:0.0.1
  - text-summarizer:0.0.1
  - jokes:0.0.1
  - datalayer-whoami:1.0.0

# Carried over from example-full: runtime-echo runs at once, runtime-sensitive-echo
# waits for a person's approval (its spec's manual approval).
backend_tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1

frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

environment_name: ai-agents-env

icon: briefcase
emoji: "🧰"
color: teal

suggestions:
  - text: List all your available skills and group them by source type
    summary: "List your skills"
  - text: Use datalayer-whoami to return my user identity context
    summary: "Who am I"
  - text: Use crawl to summarize https://datalayer.ai
    summary: "Crawl datalayer.ai"
  - text: Use github to list public repositories for an account
    summary: "GitHub public repos"
  # Carried over from skills-agent, merged into this spec.
  - text: list your tools
    summary: "List your tools"
  - text: "Search the web for the latest news on AI agents using Tavily."
    summary: "AI news via Tavily"
  - text: "List my public GitHub repositories and summarize the most active ones."
    summary: "My GitHub repositories"
  - text: "Echo with text 'hello' and reason 'audit', then share the result."
    summary: "Echo with a reason"
  - text: "Echo 'hello world' and share the result in a short sentence."
    summary: "Echo hello world"
  - text: "Call the runtime_sensitive_echo tool with text 'hello' and reason 'audit', then reply with the tool result."
    summary: "Sensitive echo tool"
  - text: "Call the runtime_echo tool with text 'hello world', then reply with the tool result."
    summary: "Runtime echo tool"
  - text: "Tell me a joke using your skills."
    summary: "A joke from your skills"

welcome_message: >-
  Hi! I am the Skills Agent. I can use built-in file skills and
  package-registered skills such as datalayer-whoami.

system_prompt: >-
  You are a skills-focused assistant. Use skills when they are relevant to
  user intent, and summarize tool outputs clearly in natural language.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null

policy:
  shield:
    # Any public address: the MCP servers and tools it runs call out (agent-shield's firewall).
    egress: ["*"]
