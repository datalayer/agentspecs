# Agent Specification: Change Detection Worker
# Earth Observation vertical worker.

id: workers-change-detection
version: 0.0.1
name: Change Detection
domain: earth-observation
description: >-
  Detects environmental and land-use change between satellite image time periods and produces evidence-backed change maps.

tags:
  - earth-observation
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-opus-4-8"
harness: pydantic-ai

sandbox_variant: jupyter-server

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - earthdata:0.0.1
  - tavily:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: telescope
emoji: "🛰️"
color: "#10B981"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Compare imagery across time periods, detect meaningful land-use and environmental change, and deliver annotated maps and reports.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Change Detection Worker, an autonomous agent worker in the earth observation domain. Detects environmental and land-use change between satellite image time periods and produces evidence-backed change maps. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
