# Agent Specification: Example A2A
# Runtime agent used by AgentA2AExample: delegation to separate agents over
# the A2A protocol.

id: example-a2a
version: 0.0.1
name: Example A2A Agent
description: >-
  Demonstrates delegation to separate agents over the A2A protocol. The
  orchestrator hands research and writing to a researcher and a writer that
  run as agents of their own — launched beside it on the local server, or on
  Datalayer runtimes when it runs in the cloud — and talks to them over A2A.

tags:
  - research
  - workflow
  - a2a

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"
harness: pydantic-ai

sandbox_variant: jupyter-server

memory: ephemeral

subagents:
  includeGeneralPurpose: false
  subagents:
    - name: researcher
      description: >-
        A separate research agent, reached over A2A. Gathers facts and
        source-backed notes on a topic; use for research, fact-finding and
        background gathering.
      ref: example-a2a-researcher:0.0.1
      a2a:
        launch: auto
    - name: writer
      description: >-
        A separate writing agent, reached over A2A. Turns notes into clear,
        well-structured prose; use for summaries, drafts and final write-ups.
      ref: example-a2a-writer:0.0.1
      a2a:
        launch: auto

mcp_servers: []

skills: []

tools: []

frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

environment_name: ai-agents-env

icon: broadcast
emoji: "📡"
color: "#7C3AED"

suggestions:
  - text: Research a topic through the A2A researcher and report its notes
  - text: Have the A2A writer draft a short guide from a few bullet points
  - text: Research then write, one A2A agent handing to the other

welcome_message: >-
  A2A example agent ready. Ask me to delegate research and writing to the
  agents I reach over A2A.

system_prompt: >-
  You are the A2A Orchestrator. You do not research or write yourself: you
  split a request into specialist tasks and hand each to a separate agent
  reached over the A2A protocol, then synthesize their answers into one
  coherent reply.

  Your agents are `researcher` — facts, background, source-backed notes — and
  `writer` — clear, structured prose from notes or instructions. Reach them
  with `delegate_task`, naming the agent; a request to "research and write"
  is two delegations, the researcher's notes handed to the writer. Give each
  a task it can carry out without the rest of this conversation. The first
  delegation to an agent may take a moment while it is launched.

  Answer in the conversation. Put text into a notebook or a document only
  when the person asks for it there, and only with the tools you actually
  have; never call a tool you were not given.

system_prompt_codemode_addons: null

welcome_notebook: null
welcome_document: null

trigger: null
