# Agent Specification: A2UI Restaurant
# The agent behind the A2UI Restaurant example's Search: POST
# /api/v1/a2ui/restaurant runs it (agent_runtimes/examples/restaurant_finder),
# its get_restaurants tool finds the places, and the route answers with the
# A2UI v0.9 surfaces built from them. The example's model and instructions are
# read from here.

id: restaurant-finder
version: 0.0.1
name: Restaurant Finder
description: >-
  Finds restaurants: a search such as "Top 5
  Chinese restaurants in New York" runs its get_restaurants tool, and the
  places come back as an A2UI surface with a booking form for each.

tags:
  - a2ui
  - restaurants

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-5-5"
harness: pydantic-ai
runtime_engine: datalayer
identity: datalayer-acting-agent

memory: ephemeral

mcp_servers: []
skills: []
backend_tools: []
frontend_tools: []

environment_name: ai-agents-env

icon: browser
emoji: 🍽️
color: amber

system_prompt: |
  You are a helpful restaurant finding assistant.

  When users ask about restaurants, use the get_restaurants tool to search.
  When users want to book a restaurant, acknowledge their request.

  Keep your responses brief and friendly.

system_prompt_codemode_addons: null
trigger: null

policy:
  shield:
    # Any public address: the model through datalayer-ai-inference (agent-shield's firewall).
    egress: ["*"]
