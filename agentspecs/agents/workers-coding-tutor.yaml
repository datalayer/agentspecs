# Agent Specification: Coding Tutor
# Personal Assistant vertical worker.

id: workers-coding-tutor
version: 0.0.1
name: Coding Tutor
domain: personal-assistant
description: >-
  Teaches coding through interactive, executable exercises and step-by-step feedback.

tags:
  - personal-assistant
  - agent-worker

enabled: false
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - tavily:0.0.1
  - google-workspace:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1
  - crawl:0.0.1
  - events:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - TAVILY_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: person
emoji: "🤖"
color: "#A855F7"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Teach coding interactively with executable exercises and give clear, incremental feedback.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Coding Tutor, an autonomous agent worker in the personal assistant domain. Teaches coding through interactive, executable exercises and step-by-step feedback. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
