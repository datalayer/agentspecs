# Agent Specification: Backtest Auditor
# Capital Markets vertical worker.

id: workers-backtest-auditor
version: 0.0.1
name: Backtest Auditor
vertical: capital-markets
description: >-
  Audits backtests for look-ahead leakage, survivorship bias, and methodological errors.

tags:
  - capital-markets
  - agent-worker

enabled: true
model: "bedrock:us.anthropic.claude-sonnet-4-6"

sandbox_variant: jupyter

# Durable memory to retain context across sessions
memory: mem0

# MCP servers used by this agent
mcp_servers:
  - alphavantage:0.0.1
  - chart:0.0.1

# Skills available to this agent
skills:
  - text-summarizer:0.0.1

# Runtime tools — sensitive actions require human approval
tools:
  - runtime-echo:0.0.1
  - runtime-sensitive-echo:0.0.1
frontend_tools:
  - jupyter-notebook:0.0.1
  - lexical-document:0.0.1

# Secrets / environment variables
envvars:
  - ALPHAVANTAGE_API_KEY:0.0.1

# Runtime environment
environment_name: ai-agents-env

# UI customization
icon: graph
emoji: "📈"
color: "#3B82F6"

# Goal / Prompt (Step 4 in the UI — the user-facing objective)
goal: >-
  Audit a backtest for leakage, survivorship bias, and other flaws, and report findings.

# Protocols & UI Extensions
protocol: vercel-ai
ui_extension: a2ui

# Model configuration
model_config:
  temperature: 0.5
  max_tokens: 4096

# Codemode
codemode:
  enabled: true

# System prompt
system_prompt: >-
  You are the Backtest Auditor, an autonomous agent worker in the capital markets domain. Audits backtests for look-ahead leakage, survivorship bias, and methodological errors. Work step by step, show your reasoning and evidence, and require explicit human approval before any external or irreversible action.
