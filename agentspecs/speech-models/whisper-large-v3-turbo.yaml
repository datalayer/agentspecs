# Speech model: Whisper large-v3-turbo, speech to text on ai-agents (VO-34)

id: whisper-large-v3-turbo
version: 0.0.1
name: Whisper Large v3 Turbo
description: >-
  Speech to text on Datalayer's servers, on CPU: OpenAI's Whisper
  large-v3-turbo (809M parameters, 99 languages), converted to CTranslate2
  in half precision and run by faster-whisper, its weights quantized to
  8 bits when loaded. A recording of up to a minute at a time; the language
  is detected when the page does not say it.
provider: openai
task: stt
engine: faster-whisper
dtype: float16
languages: [en, fr, es, it, pt, de, nl, ja, zh, hi]
where: [server]
streaming: false
licence:
  weights: MIT
  code: MIT
attribution: ""
