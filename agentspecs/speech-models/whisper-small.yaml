# Speech model: Whisper small, short spoken turns on ai-agents (VOICE.md VO-47)

id: whisper-small
version: 0.0.1
name: Whisper Small
description: >-
  Speech to text on Datalayer's servers for short spoken turns, on CPU:
  OpenAI's Whisper small (244M parameters, 99 languages), converted to
  CTranslate2 and run by faster-whisper, its weights quantized to 8 bits
  when loaded. About four times faster than large-v3-turbo; on the
  fixtures it hears English as well (3.3% against 2.4%) and French less
  well (16.1% against 2.6%). Recordings longer than a turn go to
  large-v3-turbo.
provider: openai
task: stt
engine: faster-whisper
dtype: float16
languages: [en, fr, es, it, pt, de, nl, ja, zh, hi]
where: [server]
streaming: false
licence:
  weights: MIT
  code: MIT
attribution: ""
