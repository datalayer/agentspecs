# Speech model: Kokoro-82M, text to speech on ai-agents (VOICE.md, decision 5)

id: kokoro-82m
version: 0.0.1
name: Kokoro 82M
description: >-
  Text to speech on Datalayer's servers (datalayer-speech, on r1), on CPU: hexgrad's
  Kokoro-82M v1.0 exported to ONNX, in full precision, with the voices
  file that holds its 54 voices, run by kokoro-onnx. Its phonemes come from
  eSpeak NG (GPL-3.0), which runs on the server and is never sent to a browser
  (decision 1). Full precision, not the 8-bit export: on a 16-core CPU the
  8-bit one speaks slower than real time (6 s for 3.9 s of speech), this one
  about four times faster than real time (1 s).
task: tts
engine: kokoro-onnx
dtype: fp32
languages: [en, fr, es, it, pt, hi, ja, zh]
where: [server]
streaming: false
