# UI Specification: Chat title bar — the Reactor plugin `@datalayer/loop-plugin-chat-header`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/chat-header):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "chat-header"
version: 0.0.1
name: Chat title bar
description: >-
  The conversation's title bar: who answers, what it runs on, and its actions.
emoji: "🏷️"
octicon: rows
plugin: "@datalayer/loop-plugin-chat-header"
folder: "chat-header"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.header"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
