# UI Specification: Application page — the Reactor plugin `@datalayer/agent-plugin-app-page`, one per application.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/app-page):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "app-page"
version: 0.0.1
name: Application page
description: >-
  Your application's page, drawn beside its conversation.
emoji: "📈"
octicon: browser
plugin: "@datalayer/agent-plugin-app-page"
folder: "app-page"
# Its implementation: `import { defineAppPagePlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/app-page"`
# is what makes the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/app-page"
  export: "defineAppPagePlugin"
  kind: factory
per: application
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "agent.chat.surface"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
- "mcp-apps"
