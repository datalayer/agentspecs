# UI Specification: AWS savings — the Reactor plugin `@datalayer/agent-plugin-aws-savings`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/aws-savings):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "aws-savings"
version: 0.0.1
name: AWS savings
description: >-
  The recommended savings, largest first, each with its evidence, its state and its estimated monthly saving, and their sum (list_recommendations).
emoji: "💸"
octicon: list-ordered
plugin: "@datalayer/agent-plugin-aws-savings"
folder: "aws-savings"
# Its implementation: `import { AwsSavingsPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/aws-savings"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/aws-savings"
  export: "AwsSavingsPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
