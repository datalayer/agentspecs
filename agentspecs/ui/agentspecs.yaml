# UI Specification: Agent picker — the Reactor plugin `@datalayer/loop-plugin-agentspecs`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/agentspecs):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "agentspecs"
version: 0.0.1
name: Agent picker
description: >-
  Choose which agent answers in this conversation.
emoji: "🤖"
octicon: people
plugin: "@datalayer/loop-plugin-agentspecs"
folder: "agentspecs"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.header"
  points:
  - "loop.command"
  commands:
  - "agents"
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
