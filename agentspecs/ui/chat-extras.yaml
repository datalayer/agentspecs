# UI Specification: Banner and status — the Reactor plugin `@datalayer/loop-plugin-chat-extras`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/chat-extras):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "chat-extras"
version: 0.0.1
name: Banner and status
description: >-
  A live banner over the conversation and a status line under it, set by the page around it.
emoji: "📣"
octicon: megaphone
plugin: "@datalayer/loop-plugin-chat-extras"
folder: "chat-extras"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.extras"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
