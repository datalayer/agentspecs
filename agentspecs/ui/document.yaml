# UI Specification: Document — the Reactor plugin `@datalayer/loop-plugin-document`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/document):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "document"
version: 0.0.1
name: Document
description: >-
  A document beside the conversation, written with the agent.
emoji: "📄"
octicon: file
plugin: "@datalayer/loop-plugin-document"
folder: "document"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.surface"
  - "loop.command"
  commands:
  - "document"
# The Contribution Points it offers to other plugins.
contribution_points:
- "loop.document.opening"
- "loop.document.toolbar"
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
