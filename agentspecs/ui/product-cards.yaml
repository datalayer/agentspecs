# UI Specification: Product cards — the Reactor plugin `@datalayer/agent-plugin-product-cards`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/product-cards):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the online shop's backend tools (online-shop-*), in the
# online shop's own chat and in the Shopper's (16 November 2026).

id: "product-cards"
version: 0.0.1
name: Product cards
description: >-
  Products as cards — photo, title, price, rating and stock, a grid for a list — and a quote or a test order with each product's photo and the total (list_products, find_products, get_product, quote_basket, place_test_order).
emoji: "🛍️"
octicon: apps
plugin: "@datalayer/agent-plugin-product-cards"
folder: "product-cards"
# Its implementation: `import { ProductCardsPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/product-cards"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/product-cards"
  export: "ProductCardsPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through: none,
# its cards are drawn with primer-addons (a grid and each photo's placeholder
# are not in the A2UI catalogue).
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
