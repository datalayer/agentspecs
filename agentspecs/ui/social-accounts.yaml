# UI Specification: Linked social accounts — the Reactor plugin `@datalayer/agent-plugin-social-accounts`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/social-accounts):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "social-accounts"
version: 0.0.1
name: Linked social accounts
description: >-
  Which of X, Bluesky and LinkedIn you linked, as whom, and whether each posts, reads or needs connecting again: drawn where the Marketer reads your accounts (social_accounts).
emoji: "🪪"
octicon: person
plugin: "@datalayer/agent-plugin-social-accounts"
folder: "social-accounts"
# Its implementation: `import { socialAccountsPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/social-accounts"`
# is what makes the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/social-accounts"
  export: "socialAccountsPlugin"
  kind: factory
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "agent.chatHeader"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- header
- message
