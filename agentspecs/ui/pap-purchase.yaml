# UI Specification: Approve a purchase — the Reactor plugin `@datalayer/agent-plugin-pap-purchase`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/pap-purchase):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "pap-purchase"
version: 0.0.1
name: Approve a purchase
description: >-
  A company's operation you approve, in the chat: the company, its summary and every term, the exact revision and until when it holds, above the chat's own approval (pap_confirm).
emoji: "💳"
octicon: credit-card
plugin: "@datalayer/agent-plugin-pap-purchase"
folder: "pap-purchase"
# Its implementation: `import { PapPurchasePlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/pap-purchase"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/pap-purchase"
  export: "PapPurchasePlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
