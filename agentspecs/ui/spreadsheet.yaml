# UI Specification: Spreadsheet — the Reactor plugin `@datalayer/agent-plugin-spreadsheet`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/spreadsheet):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "spreadsheet"
version: 0.0.1
name: Spreadsheet
description: >-
  A workbook beside the conversation, drawn by Datalayer Cells.
emoji: "🧮"
octicon: table
plugin: "@datalayer/agent-plugin-spreadsheet"
folder: "spreadsheet"
# Its implementation: `import { SpreadsheetPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/spreadsheet"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/spreadsheet"
  export: "SpreadsheetPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "agent.chat.surface"
  - "agent.command"
  commands:
  - "spreadsheet"
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
