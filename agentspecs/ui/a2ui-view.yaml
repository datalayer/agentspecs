# UI Specification: Surface view — the Reactor plugin `@datalayer/loop-plugin-a2ui`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/a2ui):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "a2ui-view"
version: 0.0.1
name: Surface view
description: >-
  The last result of the code, shown as a page you can use rather than as raw output.
emoji: "🖼"
octicon: browser
plugin: "@datalayer/loop-plugin-a2ui"
folder: "a2ui"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.command"
  - "loop.viewType"
  commands:
  - "a2ui"
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
