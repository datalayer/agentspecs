# UI Specification: Trip map — the Reactor plugin `@datalayer/agent-plugin-trip-map`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/trip-map):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 19 November 2026: the Traveller's options on
# a real map, with Overture Maps).

id: "trip-map"
version: 0.0.1
name: Trip map
description: >-
  The places of each trip option on a map — numbered by day, one option at a time — over Overture Maps' open basemap, with its attribution (show_trip_map). The map library loads only when the card is drawn.
emoji: "🗺️"
octicon: location
plugin: "@datalayer/agent-plugin-trip-map"
folder: "trip-map"
# Its implementation: `import { TripMapPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/trip-map"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/trip-map"
  export: "TripMapPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
