# UI Specification: Your own components — the Reactor plugin `@datalayer/loop-plugin-app-components`, one per application.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/app-components):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "app-components"
version: 0.0.1
name: Your own components
description: >-
  The components your application's developer wrote, on its page and in its answers.
emoji: "🧩"
octicon: apps
plugin: "@datalayer/loop-plugin-app-components"
folder: "app-components"
per: application
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.a2ui.component"
  - "loop.canvas.block"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
