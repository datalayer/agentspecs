# UI Specification: Browser sessions — the Reactor plugin `@datalayer/agent-plugin-browser-session`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/browser-session):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "browser-session"
version: 0.0.1
name: Browser sessions
description: >-
  Sign in to LinkedIn in your runtime's own browser, from the chat, so that its
  MCP server reads and acts through your session (the user, 15 November 2026).
emoji: "🌐"
octicon: browser
plugin: "@datalayer/agent-plugin-browser-session"
folder: "browser-session"
# Its implementation: `import { BrowserSessionPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/browser-session"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/browser-session"
  export: "BrowserSessionPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "agent.chatHeader"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- header
