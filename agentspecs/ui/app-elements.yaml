# UI Specification: Side panel and pages — the Reactor plugin `@datalayer/loop-plugin-app-elements`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/app-elements):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "app-elements"
version: 0.0.1
name: Side panel and pages
description: >-
  What your application opens beside the conversation: a side panel, a page of its own, a question for you.
emoji: "🗂️"
octicon: sidebar-expand
plugin: "@datalayer/loop-plugin-app-elements"
folder: "app-elements"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "root"
  points:
  - "reactor.ui.renderer"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
