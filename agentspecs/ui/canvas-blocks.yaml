# UI Specification: Blocks — the Reactor plugin `@datalayer/loop-plugin-ui`, one per ui.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/canvas-blocks):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "canvas-blocks"
version: 0.0.1
name: Blocks
description: >-
  The blocks you place on your application's page in the visual editor, one set for each part that draws them.
emoji: "🧱"
octicon: apps
plugin: "@datalayer/loop-plugin-ui"
folder: "canvas-blocks"
per: ui
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.canvas.block"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
