# UI Specification: Sign in at a company — the Reactor plugin `@datalayer/loop-plugin-pap-sign-in`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/pap-sign-in):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "pap-sign-in"
version: 0.0.1
name: Sign in at a company
description: >-
  Where your agent asks you to sign in at a company: its page, the code, and until when.
emoji: "🔑"
octicon: sign-in
plugin: "@datalayer/loop-plugin-pap-sign-in"
folder: "pap-sign-in"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.chatHeader"
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "mcp-ui"
