# UI Specification: Models — the Reactor plugin `@datalayer/loop-plugin-models`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/models):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "models"
version: 0.0.1
name: Models
description: >-
  Which model answers, and the models you may choose from.
emoji: "🧠"
octicon: cpu
plugin: "@datalayer/loop-plugin-models"
folder: "models"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.command"
  commands:
  - "models"
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
