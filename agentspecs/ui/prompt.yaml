# UI Specification: Floating composer — the Reactor plugin `@datalayer/loop-plugin-prompt`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/prompt):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "prompt"
version: 0.0.1
name: Floating composer
description: >-
  The composer in a card you move over the page, and the commands that bring it back or start over.
emoji: "🪶"
octicon: paper-airplane
plugin: "@datalayer/loop-plugin-prompt"
folder: "prompt"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.promptAction"
  points:
  - "loop.command"
  commands:
  - "new"
  - "prompt"
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
