# UI Specification: Analysis header — the Reactor plugin `@datalayer/loop-plugin-analysis-header`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/analysis-header):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
#
# The Analyst's title bar (the user, 19 November 2026): what is being
# analysed, whether its diagrams parse (said by the agent, from what Mermaid's
# parser answered), and a button that asks for it on the canvas.

id: "analysis-header"
version: 0.0.1
name: Analysis header
description: >-
  The Analyst's title bar: what is being analysed, whether its diagrams parse, and a button that asks for it on the canvas.
emoji: "📐"
octicon: workflow
plugin: "@datalayer/loop-plugin-analysis-header"
folder: "analysis-header"
contributions:
  slots:
  - "loop.chatHeader"
  points:
  - "loop.chat.extras"
  commands: []
contribution_points: []
renderers: []
placements:
- header
- right
- left
header:
  tool: set_analysis_header
  when: >-
    Call it once you know what is being analysed (a few words as the label of subject), and after each diagram you write to say whether the diagrams parse. Never show a diagram as valid that Mermaid refused.
  items:
  - id: subject
    kind: indicator
    display: label
    label: Subject
    description: What is being analysed, such as "Checkout flow".
    octicon: workflow
  - id: check
    kind: indicator
    display: status
    label: Diagrams
    description: Whether the diagrams parse, said from what Mermaid answered, such as "2 diagrams valid" (tone "success") or "Diagram refused" (tone "danger").
    octicon: check-circle
  - id: canvas
    kind: action
    label: Draw on the canvas
    description: Asks for the subject as a drawing on the Excalidraw canvas.
    octicon: paintbrush
    message: Draw this on the canvas, each part a labelled shape and the arrows bound to them.
