# UI Specification: Sheet in the page — the Reactor plugin `@datalayer/loop-plugin-page-sheet`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/page-sheet):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
#
# A page UI (the user, 18 November 2026: "add to the accountant the frontend
# tools to create spreadsheets"): it hands the chat's agent the frontend tools of
# the `page-sheet` set (agentspecs/frontend-tools/page-sheet.yaml), run in the
# page on the conversation's workbook, and draws their calls — the sheet, live,
# at the last call that changed it. Named under `ui` by the agent that names
# the set under `frontend_tools`, and by its applications.

id: "page-sheet"
version: 0.0.1
name: Sheet in the page
description: >-
  A spreadsheet the agent fills in the conversation, with tools run in the page: shown as it is built, editable by the person, its formulas computed by Datalayer Cells, exported as CSV.
emoji: "📑"
octicon: table
plugin: "@datalayer/loop-plugin-page-sheet"
folder: "page-sheet"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.extras"
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
- right
- left
