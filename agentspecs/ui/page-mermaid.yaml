# UI Specification: Mermaid in the page — the Reactor plugin `@datalayer/loop-plugin-page-mermaid`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/page-mermaid):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
#
# A page UI (the user, 19 November 2026: the Functional Analyst's Excalidraw and Mermaid
# frontend tools): it hands the chat's agent the frontend tools of the
# `page-mermaid` set (agentspecs/frontend-tools/page-mermaid.yaml), which are
# `@datalayer/reactor-mermaid`'s, run in the page, and draws their calls. Named
# under `ui` by the agent that names the set under `frontend_tools`, and by
# its applications.

id: "page-mermaid"
version: 0.0.1
name: Mermaid in the page
description: >-
  Mermaid diagrams the agent writes in the conversation, with tools run in the page: each source checked by Mermaid's parser before it is shown, drawn in the page's colours, its source a click away.
emoji: "🧜"
octicon: workflow
plugin: "@datalayer/loop-plugin-page-mermaid"
folder: "page-mermaid"
contributions:
  slots: []
  points:
  - "loop.chat.extras"
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
contribution_points: []
renderers: []
placements:
- message
- right
- left
