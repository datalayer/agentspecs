# UI Specification: Activity — the Reactor plugin `@datalayer/loop-plugin-app-activity`, one per application.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/app-activity):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "app-activity"
version: 0.0.1
name: Activity
description: >-
  What your application did, is doing, and is about to do, beside its page.
emoji: "🕘"
octicon: pulse
plugin: "@datalayer/loop-plugin-app-activity"
folder: "app-activity"
per: application
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.sidebar"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
