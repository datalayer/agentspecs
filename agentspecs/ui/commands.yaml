# UI Specification: Command palette — the Reactor plugin `@datalayer/loop-plugin-commands`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/commands):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "commands"
version: 0.0.1
name: Command palette
description: >-
  Every command at hand, with Ctrl-K.
emoji: "⌘"
octicon: command-palette
plugin: "@datalayer/loop-plugin-commands"
folder: "commands"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.status"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
