# UI Specification: Trip being planned — the Reactor plugin `@datalayer/loop-plugin-trip-summary`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/trip-summary):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "trip-summary"
version: 0.0.1
name: Trip being planned
description: >-
  The trip being planned, in the chat's title bar: where and when, and its budget so far, read from the trip the agent showed (show_itinerary, show_trip_options, show_trip_budget).
emoji: "🧭"
octicon: paper-airplane
plugin: "@datalayer/loop-plugin-trip-summary"
folder: "trip-summary"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.chatHeader"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- header
- footer
