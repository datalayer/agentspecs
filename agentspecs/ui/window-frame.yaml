# UI Specification: Window — the Reactor plugin `@datalayer/loop-plugin-window-frame`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/window-frame):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "window-frame"
version: 0.0.1
name: Window
description: >-
  Draws the editor as a window, with room in its title bar for controls and actions.
emoji: "🪟"
octicon: browser
plugin: "@datalayer/loop-plugin-window-frame"
folder: "window-frame"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.header"
  - "loop.window.controls"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
