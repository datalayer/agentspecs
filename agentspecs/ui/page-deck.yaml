# UI Specification: Deck in the page — the Reactor plugin `@datalayer/loop-plugin-page-deck`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/page-deck):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
#
# A page UI (the user, 18 November 2026: "add to the marketer the frontend
# tools to create slides"): it hands the chat's agent the frontend tools of
# the `page-deck` set (agentspecs/frontend-tools/page-deck.yaml), run in the
# page on the conversation's deck, and draws their calls — the deck, live,
# at the last call that changed it. Named under `ui` by the agent that names
# the set under `frontend_tools`, and by its applications.

id: "page-deck"
version: 0.0.1
name: Deck in the page
description: >-
  A deck the agent builds in the conversation, slide by slide, with tools run in the page: shown as it is built, its notes under it, presented full screen.
emoji: "🎞️"
octicon: project
plugin: "@datalayer/loop-plugin-page-deck"
folder: "page-deck"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.extras"
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
- right
- left
