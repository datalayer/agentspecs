# UI Specification: Document toolbar — the Reactor plugin `@datalayer/loop-plugin-document-toolbar`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/document-toolbar):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "document-toolbar"
version: 0.0.1
name: Document toolbar
description: >-
  Shows what the document's code blocks run on.
emoji: "🔵"
octicon: circle
plugin: "@datalayer/loop-plugin-document-toolbar"
folder: "document-toolbar"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.document.toolbar"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points:
- "loop.document.toolbar.item"
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
