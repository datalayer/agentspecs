# UI Specification: Document button — the Reactor plugin `@datalayer/agent-plugin-document-view`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/document-view):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "document-view"
version: 0.0.1
name: Document button
description: >-
  The document beside the conversation, from under the composer.
emoji: "📄"
octicon: file
plugin: "@datalayer/agent-plugin-document-view"
folder: "document-view"
# Its implementation: `import { DocumentViewPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/document-view"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/document-view"
  export: "DocumentViewPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "agent.promptAction"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
