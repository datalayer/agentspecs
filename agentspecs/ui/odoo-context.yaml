# UI Specification: Odoo company and period — the Reactor plugin `@datalayer/agent-plugin-odoo-context`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/odoo-context):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "odoo-context"
version: 0.0.1
name: Odoo company and period
description: >-
  The Odoo company the agent works in and the period it reads, in the chat's title bar, from what Odoo answered (odoo_get_context) and the balances it showed.
emoji: "🏢"
octicon: briefcase
plugin: "@datalayer/agent-plugin-odoo-context"
folder: "odoo-context"
# Its implementation: `import { odooContextPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/odoo-context"`
# is what makes the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/odoo-context"
  export: "odooContextPlugin"
  kind: factory
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "agent.chatHeader"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- header
- footer
