# UI Specification: Satellite scenes — the Reactor plugin `@datalayer/agent-plugin-earth-scenes`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/earth-scenes):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "earth-scenes"
version: 0.0.1
name: Satellite scenes
description: >-
  The satellite scenes found, by date, each with its collection, sensor and cloud cover as the catalogue gave them (show_scenes).
emoji: "🛰️"
octicon: globe
plugin: "@datalayer/agent-plugin-earth-scenes"
folder: "earth-scenes"
# Its implementation: `import { EarthScenesPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/earth-scenes"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/earth-scenes"
  export: "EarthScenesPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
