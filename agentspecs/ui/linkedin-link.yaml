# UI Specification: Link LinkedIn — the Reactor plugin `@datalayer/loop-plugin-linkedin-link`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/linkedin-link):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "linkedin-link"
version: 0.0.1
name: Link LinkedIn
description: >-
  Link LinkedIn in Settings, in the chat's title bar, while your LinkedIn is not
  linked through Datalayer or its 60-day grant lapsed; brought by the
  datalayer-social LinkedIn tools, never for an anonymous visitor.
emoji: "🔗"
octicon: link
plugin: "@datalayer/loop-plugin-linkedin-link"
folder: "linkedin-link"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.chatBanner"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- banner
- header
