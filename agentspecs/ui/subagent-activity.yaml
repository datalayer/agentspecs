# UI Specification: Delegated work — the Reactor plugin `@datalayer/loop-plugin-subagent-activity`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/subagent-activity):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "subagent-activity"
version: 0.0.1
name: Delegated work
description: >-
  The face of an agent yours handed work to, pulsing while it works.
emoji: "👥"
octicon: people
plugin: "@datalayer/loop-plugin-subagent-activity"
folder: "subagent-activity"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.inpromptMenu"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
