# UI Specification: Notebook — the Reactor plugin `@datalayer/loop-plugin-notebook`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/notebook):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "notebook"
version: 0.0.1
name: Notebook
description: >-
  A notebook beside the conversation, its code run as you go.
emoji: "📓"
octicon: rows
plugin: "@datalayer/loop-plugin-notebook"
folder: "notebook"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.surface"
  - "loop.command"
  commands:
  - "notebook"
# The Contribution Points it offers to other plugins.
contribution_points:
- "loop.notebook.opening"
- "loop.notebook.toolbar"
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
