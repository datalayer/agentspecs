# UI Specification: Excalidraw in the page — the Reactor plugin `@datalayer/loop-plugin-page-excalidraw`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/page-excalidraw):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
#
# A page UI (the user, 19 November 2026: the Functional Analyst's Excalidraw and Mermaid
# frontend tools): it hands the chat's agent the frontend tools of the
# `page-excalidraw` set (agentspecs/frontend-tools/page-excalidraw.yaml), which are
# `@datalayer/reactor-excalidraw`'s, run in the page, and draws their calls. Named
# under `ui` by the agent that names the set under `frontend_tools`, and by
# its applications.

id: "page-excalidraw"
version: 0.0.1
name: Excalidraw in the page
description: >-
  Drawings the agent makes in the conversation on an Excalidraw canvas, with tools run in the page: shown as they are drawn, editable by the person, its shapes bound so they move together.
emoji: "🖌️"
octicon: paintbrush
plugin: "@datalayer/loop-plugin-page-excalidraw"
folder: "page-excalidraw"
contributions:
  slots: []
  points:
  - "loop.chat.extras"
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
contribution_points: []
renderers: []
placements:
- message
- right
- left
