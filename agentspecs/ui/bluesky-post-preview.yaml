# UI Specification: Bluesky post preview — the Reactor plugin `@datalayer/agent-plugin-bluesky-post-preview`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/bluesky-post-preview):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "bluesky-post-preview"
version: 0.0.1
name: Bluesky post preview
description: >-
  A post or reply on Bluesky as it will stand there, with its length against the 300 characters Bluesky takes and its images, above its approval (post_to_bluesky, reply_on_bluesky).
emoji: "🦋"
octicon: megaphone
plugin: "@datalayer/agent-plugin-bluesky-post-preview"
folder: "bluesky-post-preview"
# Its implementation: `import { BlueskyPostPreviewPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/bluesky-post-preview"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/bluesky-post-preview"
  export: "BlueskyPostPreviewPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
