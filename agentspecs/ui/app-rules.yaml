# UI Specification: Rules and approvals — the Reactor plugin `@datalayer/loop-plugin-app-rules`, one per application.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/app-rules):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "app-rules"
version: 0.0.1
name: Rules and approvals
description: >-
  When your application acts alone, when it asks you, and the approvals waiting for your yes.
emoji: "🛡️"
octicon: shield-check
plugin: "@datalayer/loop-plugin-app-rules"
folder: "app-rules"
per: application
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.sidebar"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
