# UI Specification: Composer — the Reactor plugin `@datalayer/agent-plugin-composer-portal`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/composer-portal):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# A button in the chat's toolbar that opens the application's Composer full
# screen (the user, 21 November 2026): its Canvas, its spec and its Python,
# read only. What fills it is the host's when the host contributes to the
# `agent.composerView` slot, otherwise the plugin's own spec and Python.
# On every application's chat by default (the user, 21 November 2026), unless
# its spec sets `interface.composer_portal_disabled: true`.

id: "composer-portal"
version: 0.0.1
name: Composer
description: >-
  A button in the chat's toolbar that opens the application's Composer full screen: its Canvas, its spec and its Python, read only. Every application's chat has it, listed in its `ui` or not, unless its spec leaves it out (`interface.composer_portal_disabled: true`). Needs no connection: an anonymous visitor has it.
emoji: "🧱"
octicon: pencil
plugin: "@datalayer/agent-plugin-composer-portal"
folder: "composer-portal"
# Its implementation: `import { composerPortalPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/composer-portal"`
# is what makes the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/composer-portal"
  export: "composerPortalPlugin"
  kind: factory
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "agent.promptAction"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- toolbar
- header
