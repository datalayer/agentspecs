# UI Specification: Product comparison — the Reactor plugin `@datalayer/loop-plugin-product-comparison`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/product-comparison):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "product-comparison"
version: 0.0.1
name: Product comparison
description: >-
  The products the agent compared, side by side — price, variant, availability, rating, seller and photo — and the one it would pick with why (show_comparison).
emoji: "📊"
octicon: table
plugin: "@datalayer/loop-plugin-product-comparison"
folder: "product-comparison"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
