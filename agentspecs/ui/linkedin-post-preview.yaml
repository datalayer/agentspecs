# UI Specification: LinkedIn post preview — the Reactor plugin `@datalayer/loop-plugin-linkedin-post-preview`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/linkedin-post-preview):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "linkedin-post-preview"
version: 0.0.1
name: LinkedIn post preview
description: >-
  A post or comment on LinkedIn as it will stand there, with its length and its image, above its approval (post_to_linkedin, comment_on_linkedin).
emoji: "💼"
octicon: megaphone
plugin: "@datalayer/loop-plugin-linkedin-post-preview"
folder: "linkedin-post-preview"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
