# UI Specification: Stripe checkout — the Reactor plugin `@datalayer/agent-plugin-stripe-checkout`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/stripe-checkout):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought by the stripe MCP server (the user, 15 November 2026), drawn with
# the A2UI renderer.

id: "stripe-checkout"
version: 0.0.1
name: Stripe checkout
description: >-
  A Stripe Checkout Session the agent created, as an A2UI card: its line items,
  total and currency, test mode said; Checkout opens Stripe's own page, where
  the person pays — no card data is ever typed in the chat — and the session's
  status (paid, open or expired) shows when they are back. A live session is
  refused.
emoji: "💳"
octicon: credit-card
plugin: "@datalayer/agent-plugin-stripe-checkout"
folder: "stripe-checkout"
# Its implementation: `import { StripeCheckoutPlugin } from "@datalayer/agent-runtimes/lib/apps/plugins/stripe-checkout"`
# is the plugin, whose manifest says what this spec says.
implementation:
  package: "@datalayer/agent-runtimes"
  module: "lib/apps/plugins/stripe-checkout"
  export: "StripeCheckoutPlugin"
  kind: plugin
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
