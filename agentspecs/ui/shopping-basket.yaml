# UI Specification: Shopping basket — the Reactor plugin `@datalayer/loop-plugin-shopping-basket`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/shopping-basket):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "shopping-basket"
version: 0.0.1
name: Shopping basket
description: >-
  The basket the agent put together: each item with its photo, its seller and price, the shipping and the total summed by the tool; nothing is bought from it (show_basket).
emoji: "🛒"
octicon: package
plugin: "@datalayer/loop-plugin-shopping-basket"
folder: "shopping-basket"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "reactor.ui.renderer"
  - "reactor.ui.toolBinding"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers:
- "a2ui"
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- message
