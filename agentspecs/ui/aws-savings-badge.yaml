# UI Specification: Savings found — the Reactor plugin `@datalayer/loop-plugin-aws-savings-badge`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/aws-savings-badge):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.
# Brought to the chat by the agent, MCP server, skill or backend tool that
# names it under `ui` (the user, 15 November 2026).

id: "aws-savings-badge"
version: 0.0.1
name: Savings found
description: >-
  This session's estimated monthly savings and the AWS account they were found in, in the chat's title bar, read from the recommendations recorded (record_recommendation, list_recommendations).
emoji: "💸"
octicon: graph
plugin: "@datalayer/loop-plugin-aws-savings-badge"
folder: "aws-savings-badge"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots:
  - "loop.chatHeader"
  points: []
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
# Where in the chat it goes, its default first (agentspecs 0.0.197).
placements:
- header
- footer
