# UI Specification: Composer — the Reactor plugin `@datalayer/loop-plugin-input-prompt`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/input-prompt):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "input-prompt"
version: 0.0.1
name: Composer
description: >-
  Where you write to the agent, under or over the conversation.
emoji: "✏️"
octicon: pencil
plugin: "@datalayer/loop-plugin-input-prompt"
folder: "input-prompt"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.composer"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points:
- "loop.prompt.panel"
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
