# UI Specification: Chat — the Reactor plugin `@datalayer/loop-plugin-chat`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/chat):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "chat"
version: 0.0.1
name: Chat
description: >-
  The conversation: what you ask, what it answers, and the work it opens beside it.
emoji: "💬"
octicon: comment-discussion
plugin: "@datalayer/loop-plugin-chat"
folder: "chat"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.chat.turn"
  - "loop.command"
  - "loop.document.toolbar.item"
  - "loop.notebook.toolbar.item"
  - "loop.viewType"
  commands:
  - "chat"
# The Contribution Points it offers to other plugins.
contribution_points:
- "loop.agent.available"
- "loop.chat.composer"
- "loop.chat.extras"
- "loop.chat.header"
- "loop.chat.suggestion"
- "loop.chat.turn"
- "loop.frontendTool"
# Its settings: the JSON Schema of its configuration, its defaults the plugin's.
settings:
  type: object
  properties:
    placeholder:
      type: string
      title: Composer hint
      description: Shown in the composer while it is empty; the agent's own when unsaid.
      default: ''
    defaultSurface:
      type: string
      title: Opens beside it
      description: 'What opens beside the conversation: notebook, document, a page, or none.'
      default: notebook
    showSurfaceSelector:
      type: boolean
      title: Offers the switcher
      description: The strip that switches what is open beside the conversation.
      default: true
    hideHeader:
      type: boolean
      title: Hides its title bar
      description: The conversation without its own title bar.
      default: false
    headerButtons:
      type: object
      title: Title bar buttons
      description: Whether the title bar offers a new chat and clearing this one.
      properties:
        newChat:
          type: boolean
          title: New chat
          description: Start another conversation.
        clear:
          type: boolean
          title: Clear
          description: Clear this conversation.
      default:
        newChat: false
        clear: false
    hidePrompt:
      type: boolean
      title: Hides the composer
      description: The conversation read without being written to.
      default: false
    promptPlacement:
      type: string
      title: Composer place
      description: Where the composer sits.
      enum:
      - top
      - bottom
      - bottom-chat
      - floating
      default: bottom
    autoFocusPrompt:
      type: boolean
      title: Composer takes the caret
      description: The composer is ready to type in when the page opens.
      default: true
    suggestionLabels:
      type: boolean
      title: Openers by the composer
      description: The openers shown as labels by the composer, not only in its menu.
      default: true
    fullScreenTopOffset:
      type:
      - number
      - string
      title: Room kept at the top
      description: What full screen leaves at the top for the page's own header.
      default: 0
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
