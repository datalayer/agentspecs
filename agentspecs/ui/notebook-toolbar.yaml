# UI Specification: Notebook toolbar — the Reactor plugin `@datalayer/loop-plugin-notebook-toolbar`.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/notebook-toolbar):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "notebook-toolbar"
version: 0.0.1
name: Notebook toolbar
description: >-
  Shows what the notebook is running on.
emoji: "🟢"
octicon: circle
plugin: "@datalayer/loop-plugin-notebook-toolbar"
folder: "notebook-toolbar"
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.notebook.toolbar"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points:
- "loop.notebook.toolbar.item"
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
