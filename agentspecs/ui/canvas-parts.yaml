# UI Specification: Parts — the Reactor plugin `@datalayer/loop-plugin-parts`, one per source.
#
# Read from the plugin's registration in agent-runtimes (src/apps/plugins/canvas-parts):
# its Slots, Contributions, Commands and Contribution Points are what the
# reactor registers for it, held to it by agent-runtimes' ui-specs test.

id: "canvas-parts"
version: 0.0.1
name: Parts
description: >-
  What you drop on your agent in the visual editor: connections, skills, models, rules, tests and events.
emoji: "🧰"
octicon: package
plugin: "@datalayer/loop-plugin-parts"
folder: "canvas-parts"
per: source
# Its Contributions: the Slots it fills, the Contribution Points it
# contributes to, the Commands it adds (the composer's `/` commands by name).
contributions:
  slots: []
  points:
  - "loop.canvas.part"
  commands: []
# The Contribution Points it offers to other plugins.
contribution_points: []
# The UI renderers (agentspecs/ui-renderers) it may be exposed through.
renderers: []
