# An embed's visitor: nothing is kept of them.
id: datalayer-visitor
version: 0.0.1
name: Visitor
description: >-
  Someone talking to an embedded or public application without an account: an
  ephemeral identity, no vault, never asked to consent to a third party; a tool
  that needs one is refused in a sentence.
subject: visitor
provider: datalayer
inbound:
  kind: jwt
  issuer: https://prod1.datalayer.run/api/iam/v1/oauth
  algorithms: [HS256]
  lifetime_seconds: 3600
custody:
  keys: shared-secret
  algorithm: HS256
tags: [datalayer, visitor]
icon: eye
emoji: "👀"
