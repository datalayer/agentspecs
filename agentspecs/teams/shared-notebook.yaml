# The shared-notebook team: Analyst, Reviewer, Writer.
#
# Three specialists that work in the one notebook a person has open, which
# is the whole argument of the page that mounts this team: analysis, review
# and write-up happen in the same cells, so nothing is handed off and nothing
# is lost between them. Every member is a `ref` into `agents/`, all three run
# in the browser, and all three read one shared transcript.
#
# Supervisor mode with the Analyst at the front door. A request is either an
# analysis, a check on one, or a write-up of one, and the Analyst — the member
# that already has to read the notebook to answer anything — routes it. It
# also does its own work, so it is listed among the members too.

id: shared-notebook
version: 0.0.1
name: Shared Notebook
description: >-
  Analyst, Reviewer and Writer, working in the same Jupyter notebook: the
  Analyst adds and runs the cells, the Reviewer checks them and records what
  it finds, the Writer writes the result up between them.

tags:
  - notebook
  - jupyter
  - collaboration
  - analysis
  - review

enabled: true
icon: people
emoji: "🧑‍🤝‍🧑"
color: "#0969DA"

orchestration_protocol: datalayer
execution_mode: supervisor

supervisor:
  name: Analyst
  ref: notebook-analyst:0.0.1
  model: "bedrock:us.anthropic.claude-sonnet-4-6"
  goal: >-
    Keep the work in the notebook. Answer analysis requests directly; send a
    request to check something to the Reviewer and a request to write
    something up to the Writer, and never leave results anywhere but the
    cells.
  approval: auto
  can_terminate: false

routing_instructions: >-
  Send anything about exploring, computing, plotting or extending the
  analysis — "analyze", "plot", "compute", "add a cell that…" — to the
  Analyst. Send anything about checking, verifying, doubting or re-running —
  "find what is wrong", "check this", "is this right", "re-run" — to the
  Reviewer. Send anything about explaining, summarising, writing up or
  verifying the wording of a conclusion to the Writer.

  When a request is two of these ("analyze this and write it up"), the
  Analyst goes first and the Writer follows on the cells it produced. When
  neither fits, answer directly rather than forcing the request onto a
  specialist.

# The three openers a visitor sees, one per member, in the order the work
# usually goes. Each is a whole request in the words somebody would type.
suggestions:
  - text: Analyze the dataset
    icon: graph
    emoji: "🔎"
  - text: Find what is wrong
    icon: checklist
    emoji: "🧐"
  - text: Verify the conclusion
    icon: pencil
    emoji: "✍️"

# Members reach the person through the notebook, not each other: the Analyst
# handing work straight to the Writer would produce a write-up of cells the
# person has not seen yet. Routing is the supervisor's, where it is visible.
delegation:
  max_depth: 2
  allow_peer_delegation: false
  include_general_purpose: false

# One thread, read by all three. The Reviewer checking cells it did not see
# asked for, or the Writer summarising a review it never read, is the handoff
# problem this team exists to remove.
context:
  sharing: shared

validation:
  timeout: 300s
  retry_on_failure: true
  max_retries: 1

agents:
  - id: analyst
    ref: notebook-analyst:0.0.1
    name: Analyst
    role: initiator
    goal: >-
      Explore the data in the open notebook — add the cells, run them, and
      leave the results on them for the others to build on.
    depends_on: []
    approval: auto

  - id: reviewer
    ref: notebook-reviewer:0.0.1
    name: Reviewer
    role: reviewer
    goal: >-
      Re-run what matters, find what is wrong or unsupported, and record the
      verdict in the notebook beside the code it concerns.
    depends_on: []
    approval: auto

  - id: writer
    ref: notebook-writer:0.0.1
    name: Writer
    role: finalizer
    goal: >-
      Write the analysis up between the cells — summary, explanations,
      conclusion — saying only what the cells support.
    depends_on: []
    approval: auto

reaction_rules:
  - id: rr-sn-1
    trigger: review_found_unsupported_claim
    action: escalate_to_supervisor
    auto: true
    max_retries: 1
    escalate_after_retries: 1
    priority: medium

health_monitoring:
  heartbeat_interval: 15s
  stale_threshold: 60s
  unresponsive_threshold: 180s
  stuck_threshold: 300s
  max_restart_attempts: 3
