# Team Specification: Buy from a shop
# Two applications working as a team over A2A. A person talks to their
# Shopper, in their browser. The Shopper asks the Demo Shop, on a runtime,
# for products, a quote and a test order, and hands over what the shop
# answers. The shop's member id is its application's (demo-shop), as the
# demo account's kept deployment names it. The shop answers from its own catalogue and charges nothing.

id: buy-from-a-shop
version: 0.0.1
name: Buy from a shop
description: >-
  A person's Shopper in the browser that buys from the Demo Shop, a company
  application on a runtime, over A2A: the shop finds its products with their
  photos, quotes the basket and places a test order — nothing is charged and
  nothing ships.
tags:
  - example
  - shopping
  - commerce
  - a2a
  - companies
enabled: true
icon: gift
emoji: "🛍️"
color: yellow

orchestration_protocol: a2a
execution_mode: supervisor
# The Shopper decides when the shop is asked, and what the person is told.
supervisor:
  name: Shopper
  app: shopper:0.0.2
  can_terminate: true
entry: shopper
routing_instructions: >-
  The Shopper asks the Demo Shop for every product, quote and order, one
  request each time, and reports what the shop answers without adding to it.

suggestions:
  - text: Find me what the shop has for tennis, and say which you would pick.
    emoji: "🎾"
  - text: Quote two tennis balls and the tennis racket.
    emoji: "🧾"
  - text: Place a test order of two tennis balls and the tennis racket.
    emoji: "📦"

delegation:
  max_depth: 1
  allow_peer_delegation: true

validation:
  timeout: 300s

agents:
  - id: shopper
    app: shopper:0.0.2
    role: initiator
    runs_in: browser
    goal: >-
      Take the person's request, ask the Demo Shop for it, and hand over what
      the shop answered.
    talks_to:
      - member: demo-shop
        over: a2a
  - id: demo-shop
    app: demo-shop:0.0.1
    role: contributor
    runs_in: runtime
    goal: >-
      Answer from the shop's own catalogue over A2A: its products with their
      photos, a basket quoted, a test order placed once asked.
