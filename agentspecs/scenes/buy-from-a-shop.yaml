# Scene: Buy from a shop. The team `buy-from-a-shop` staged: the Shopper,
# in the visitor's browser, takes the request and asks the Demo Shop, on a
# runtime, which answers from its own catalogue — 24 products with their
# photos — quotes the basket and places a test order. Three beats, each a
# cue the audience may say. Nothing is charged and nothing ships.

schema: loop.scene/v1
id: buy-from-a-shop
version: 0.0.1
name: Buy from a shop
description: >-
  A person's Shopper asks a shop for tennis gear, gets the basket quoted and
  places a test order; the shop answers from its own catalogue, with photos,
  and charges nothing.
tags:
  - example
  - scene
  - shopping
  - commerce
  - a2a
icon: gift
emoji: "🛒"

team: buy-from-a-shop:0.0.1
cast:
  - member: shopper
    persona:
      name: Shopper
      line: I shop for you, and bring back what the shop says.
    brief: >-
      Ask the Demo Shop for every product, quote and order, one request each
      time, and report what it answers without adding to it. Do not question
      the audience first: a cue is the whole of what it says, and nobody is
      standing there to answer you back. A cue that says what to place an
      order for is the go-ahead: ask the shop to place that test order.
  - member: demo-shop
    persona:
      name: Demo Shop
      line: I answer from my own catalogue; my orders are test orders.
    brief: >-
      Answer only from your tools: find the products with find_products, quote
      a basket with quote_basket and place an order with place_test_order when
      asked to, saying each time that nothing is charged and nothing ships.

setting:
  period: today
  language: en
  assumes: >-
    Two agents over A2A — your Shopper in your browser, the Demo Shop on
    Datalayer — on the shop's own catalogue of 24 products. Its orders are
    test orders: nothing is charged and nothing ships.

script:
  - id: find
    cue:
      say: Find me what the shop has for tennis, and say which you would pick.
    narration: The Shopper asks the shop, which looks in its catalogue.
    moves:
      - who: shopper
        asks: demo-shop
        over: a2a
        what: the shop's products for tennis
      - who: demo-shop
        answers: words
        what: its tennis racket and tennis ball, each with its price, rating and stock
      - who: shopper
        answers: words
        what: what the shop has, and which it would pick
    expect: >-
      The shop's tennis racket (49.99 USD) and tennis ball (6.99 USD) from its
      catalogue, with their stock; the Shopper picks one from those figures.
    pace: steady
  - id: quote
    cue:
      say: Quote two tennis balls and the tennis racket.
    narration: The shop prices the basket; the Shopper adds nothing up itself.
    moves:
      - who: shopper
        asks: demo-shop
        over: a2a
        what: a quote for two tennis balls and one tennis racket
      - who: demo-shop
        answers: words
        what: each line and the total, summed by the shop
      - who: shopper
        answers: words
        what: the basket and its total, as the shop quoted it
    expect: >-
      Each line and a total of 63.97 USD, the shop's own; nothing is ordered
      yet.
  - id: order
    cue:
      say: Place a test order of two tennis balls and the tennis racket.
    narration: An order, said to be a test — nothing is charged, nothing ships.
    moves:
      - who: shopper
        asks: demo-shop
        over: a2a
        what: a test order of two tennis balls and one tennis racket
      - who: demo-shop
        answers: words
        what: the test order's number, and that nothing is charged and nothing ships
      - who: shopper
        answers: words
        what: the order placed, a test, with its number
    expect: >-
      A test order number (TEST-…) and the total, with the shop saying nothing
      is charged and nothing ships; the Shopper says the same.
    pace: slow

stage:
  backdrop: hero
  positions:
    shopper: { x: 0.25, y: 0.5 }
    demo-shop: { x: 0.75, y: 0.5 }
  opens_first: shopper
  transcript:
    tools: true
    narration: true
    withhold:
      - ids
  inspectors:
    - agent
    - a2a
    - tools
  rests_after: 10m
  pace: steady

audience:
  who: visitors
  ceiling_per_ask: 0.05
  asks_a_day: 5

rehearsal:
  # Not measured yet: the scene has not been played. A beat is two model
  # turns and one or two of the shop's own tools, read in process from its
  # catalogue; 120 s is written before any play, as the other scenes' bounds
  # were, and the first rehearsal on Datalayer is what sets it.
  within: 10m
  beats:
    - beat: find
      lines:
        - "You → Shopper"
        - "Shopper → Demo Shop"
        - "Demo Shop: words"
        - "Shopper: words"
      must_say:
        - racket
      must_not_say:
        - I cannot
        - error
      within: 120s
    - beat: quote
      lines:
        - "You → Shopper"
        - "Shopper → Demo Shop"
        - "Demo Shop: words"
        - "Shopper: words"
      must_say:
        - "63.97"
      within: 120s
    - beat: order
      lines:
        - "You → Shopper"
        - "Shopper → Demo Shop"
        - "Demo Shop: words"
        - "Shopper: words"
      must_say:
        - TEST-
      must_not_say:
        - charged to your
      within: 120s
  verified:
    live: []
    recorded:
      - "The shop's tools are tested in process against its bundled catalogue: the tennis products, a quote of 63.97 USD summed by the tool, a test order charging nothing."
    unverified:
      - "Not played yet: the Demo Shop must be kept always on under the demo account (demo-shop) for the Shopper to reach it."

deployment:
  account: demo
  page: /
  addresses:
    demo-shop: DATALAYER_DEMO_SCENE_BUY_FROM_A_SHOP_DEMO_SHOP_A2A_URL
