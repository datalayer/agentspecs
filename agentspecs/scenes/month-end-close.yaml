# Scene: Month-end Close (LOOP A-13). The team `month-end-close` staged: one
# agent and its data. Month-end Close, on a runtime, reads the Odoo books
# through odoo-accounting and drives the close; the audience talks to it over
# A2A from the page. Four beats: the checklist (a table), the accruals (the
# sources), the expenses (a chart), posting the accruals (an approval).

schema: loop.scene/v1
id: month-end-close
version: 0.0.1
name: Month-end Close
description: >-
  One agent drives the close from the Odoo books it only reads: where the
  close stands, what is to book, what is still open.
tags:
  - example
  - scene
  - odoo
  - finance
  - a2a
icon: calendar
emoji: "📒"

team: month-end-close:0.0.1
cast:
  - member: month-end-close
    persona:
      name: Month-end Close
      line: I read the books and tell you where the close stands.
    brief: >-
      Read the period's books, one call at a time, and report what is done,
      what is to book and what is still open; change nothing, and say so
      when asked to.

setting:
  systems:
    - server: odoo-accounting:0.0.1
      as: Odoo
      holds: Datalayer's own books, read only.
  period: last month
  language: en
  assumes: >-
    One agent, its data: Month-end Close on Datalayer, on Datalayer's own
    books in Odoo, read only.

script:
  - id: close-checklist
    cue:
      say: Where does the month-end close stand for last month? Give me the checklist.
    narration: The lock dates and the bank first, then the checklist.
    moves:
      - who: month-end-close
        asks: odoo
        over: mcp
        tool: odoo_accounting_get_lock_dates
        does: read
        what: whether last month is locked
      - who: month-end-close
        asks: odoo
        over: mcp
        tool: odoo_accounting_bank_status
        does: read
        what: where the bank reconciliation stands
      - who: month-end-close
        answers: table
        what: the checklist, each step done, to do or blocked
    expect: >-
      A checklist of the close with each step marked done, to do or blocked,
      read from the books, nothing assumed.
    shows:
      - table
    branch:
      - decision: last month is locked in the books
        expect: It says the close is done, and gives the lock date.
  - id: accruals
    cue:
      say: Which accruals should be booked for last month? Show me the entries each rests on.
    narration: The entries of the period, and what they leave to accrue.
    moves:
      - who: month-end-close
        asks: odoo
        over: mcp
        tool: odoo_accounting_list_journal_entries
        does: read
        what: last month's journal entries
      - who: month-end-close
        asks: odoo
        over: mcp
        tool: odoo_accounting_general_ledger
        does: read
        what: the accounts the accruals go to
      - who: month-end-close
        answers: sources
        what: each accrual to book, with the entries it rests on as cards
    expect: >-
      The accruals to book, each with its account and its amount, and the
      entries each rests on as cards; nothing booked.
    shows:
      - sources
    pace: slow
  - id: expenses-by-month
    cue:
      say: Chart last month's expenses by account against the month before.
    narration: Two months of expenses, account by account.
    moves:
      - who: month-end-close
        asks: odoo
        over: mcp
        tool: odoo_accounting_trial_balance
        does: read
        what: the expense accounts of the two months
      - who: month-end-close
        answers: chart
        what: each expense account, last month against the month before
    expect: >-
      A chart of the expense accounts, last month beside the month before,
      read from the books; the accounts that moved most said in words.
    shows:
      - chart
  - id: post-accruals
    cue:
      say: Post the accruals you suggested for last month.
    narration: A change to the books — asked first, and not done for a visitor.
    moves:
      - who: month-end-close
        asks: odoo
        over: mcp
        tool: odoo_accounting_list_journal_entries
        does: read
        what: last month's entries, to name the accruals
      - who: month-end-close
        answers: approval
        what: the entries it would post, as a choice to approve
    expect: >-
      It names the entries it would post and asks first — Post them · Not now
      — and posts nothing; a visitor who approves is refused in a sentence:
      without an account it only reads.
    shows:
      - approval
    branch:
      - decision: the audience asks to post the accruals
        expect: It leaves the posting to a person, and says what they would do.

stage:
  positions:
    month-end-close: { x: 0.5, y: 0.5 }
  opens_first: month-end-close
  transcript:
    tools: true
    narration: true
    withhold:
      - ids
  inspectors:
    - agent
    - tools
  rests_after: 10m
  pace: steady

audience:
  who: visitors
  ceiling_per_ask: 0.05
  asks_a_day: 5

rehearsal:
  within: 180s
  beats:
    - beat: close-checklist
      lines:
        - "You → Month-end Close"
        - "Month-end Close → Odoo: odoo_accounting_get_lock_dates"
        - "Month-end Close → Odoo: odoo_accounting_bank_status"
        - "Month-end Close: a table"
      must_say:
        - close
      must_not_say:
        - I posted
      within: 60s
    - beat: accruals
      lines:
        - "You → Month-end Close"
        - "Month-end Close → Odoo: odoo_accounting_*"
        - "Month-end Close: sources"
      must_say:
        - accrual
      must_not_say:
        - I posted
      within: 60s
    - beat: expenses-by-month
      lines:
        - "You → Month-end Close"
        - "Month-end Close → Odoo: odoo_accounting_trial_balance"
        - "Month-end Close: a chart"
      must_say:
        - expense
      within: 60s
    - beat: post-accruals
      lines:
        - "You → Month-end Close"
        - "Month-end Close → Odoo: odoo_accounting_list_journal_entries"
        - "Month-end Close: an approval"
      must_say:
        - accrual
      must_not_say:
        - I posted
      within: 60s
  verified:
    live: []
    recorded: []
    unverified:
      - "Its runtime is not deployed under the demo account yet, and the rehearsal has not been played (A-14)."

deployment:
  account: demo
  page: /
  addresses:
    month-end-close: DATALAYER_DEMO_SCENE_MONTH_END_CLOSE_MONTH_END_CLOSE_A2A_URL
