# Scene: A coding agent behind the Shield. One member, written inline: Code
# Explainer, an application whose agent is OpenCode, a harness of the
# catalogue, on a runtime. It is lent one repository — the workspace it runs
# in — and may only read it. The audience asks it to explain a file, and its
# harness's steps (each file it reads, each command it runs) are lines of the
# transcript, *Code Explainer → its workspace: Read README.md*. Then the
# audience asks it to change the file: the Shield refuses the write under the
# application's rule *Change a file*, and the drill-down of that line shows
# the refusal and the rule. Two beats.

schema: loop.scene/v1
id: coding-agent-behind-the-shield
version: 0.0.1
name: A Coding Agent Behind the Shield
description: >-
  A coding agent lent one repository to read explains a file; the edit it
  is then asked for is refused by the Shield, which says the rule.
tags:
  - example
  - scene
  - coding
  - harness
  - shield
  - a2a
icon: code
emoji: "🔒"

cast:
  - member: code-explainer
    app: code-explainer:0.0.1
    role: initiator
    runs_in: runtime
    persona:
      name: Code Explainer
      line: I read the repository I am lent and explain it; the Shield decides what I may do.
    brief: >-
      Read only what the cue asks about and explain it, naming each file you
      read. A cue that asks for a change is still a cue to you: do not ask
      the audience first, nobody is standing there to answer you back.

setting:
  contents:
    - The repository it is lent, read only
  language: en
  assumes: >-
    One coding agent, OpenCode, on Datalayer, lent one repository to read;
    the Shield in front of it decides every file it opens and every edit it
    tries, by the application's Rules.

script:
  - id: explain-a-file
    cue:
      say: Explain what README.md says about this project, and how the repository is laid out.
    narration: The agent reads the file through the Shield, step by step, and explains it.
    moves:
      - who: code-explainer
        answers: words
        what: what README.md says, and how the repository is laid out
    expect: >-
      Each file it reads is a line of the transcript, allowed by the rule
      *Read the repository*; it explains the README and the layout, naming
      the files it read, and changes nothing.
    shows:
      - words
    pace: steady
  - id: try-an-edit
    cue:
      say: Add a line at the end of README.md that says who explained it.
    narration: A write, refused by the Shield — the drill-down names the rule.
    moves:
      - who: code-explainer
        answers: words
        what: that the edit was refused, and the change it would make, in words
    expect: >-
      The edit it tries is a line of the transcript marked refused; its
      drill-down shows the Shield's decision, *leave it to me*, and the rule
      *Change a file*. README.md is unchanged.
    shows:
      - words
    pace: slow

stage:
  backdrop: hero
  positions:
    code-explainer: { x: 0.5, y: 0.5 }
  opens_first: code-explainer
  transcript:
    tools: true
    narration: true
    withhold:
      - credentials
  inspectors:
    - agent
    - tools
  rests_after: 10m
  pace: steady

audience:
  who: visitors
  ceiling_per_ask: 0.1
  asks_a_day: 3

rehearsal:
  # Not measured yet: the scene has not been played. A harness's turn starts
  # its program (npx fetches OpenCode on a runtime's first turn), then reads
  # file by file through the Shield, each read a decision; 180 s is written
  # before any play, as the other scenes' bounds were, and the first
  # rehearsal on Datalayer is what sets it.
  within: 10m
  beats:
    - beat: explain-a-file
      lines:
        - "You → Code Explainer"
        # The harness names its own steps (OpenCode's *Read README.md*); the
        # beat asks that it read the file, not in which words it says so.
        - "Code Explainer → its workspace: *README*"
        - "Code Explainer: words"
      must_say:
        - README
      must_not_say:
        - I edited
        - I changed
      within: 180s
    - beat: try-an-edit
      lines:
        - "You → Code Explainer"
        # The write it tries, refused: the line is marked failed and its
        # drill-down carries the Shield's rule.
        - "Code Explainer → its workspace: *README*"
        - "Code Explainer: words"
      must_say:
        # The Shield's sentence names the rule it refused the write under.
        - Change a file
      must_not_say:
        - I added
        - I have added
      within: 180s
  verified:
    live: []
    recorded: []
    unverified:
      - "Not played yet: its runtime is not deployed under the demo account, and the repository it is lent is the workspace of that runtime."

deployment:
  account: demo
  page: /
  addresses:
    code-explainer: DATALAYER_DEMO_SCENE_CODING_AGENT_BEHIND_THE_SHIELD_CODE_EXPLAINER_A2A_URL
