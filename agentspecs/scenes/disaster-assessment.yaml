# Scene: Disaster Assessment (LOOP A-13). The team `disaster-assessment`
# staged: Event response, in the visitor's browser, is told of a live event
# and asks Disaster Assessment for the area affected and the damage, and
# Change detection for what changed on the ground — each on a runtime, each
# searching the imagery NASA Earthdata holds — then reports. Four beats: a flood (a
# table), a fire (the sources), a storm (a chart), an alert (an approval).

schema: loop.scene/v1
id: disaster-assessment
version: 0.0.1
name: Disaster Assessment
description: >-
  An event desk asks two specialists what a disaster affected and what
  changed on the ground, each reading NASA Earthdata, and reports.
tags:
  - example
  - scene
  - earthdata
  - disaster
  - insurance
  - a2a
icon: alert
emoji: "🚨"

team: disaster-assessment:0.0.1
cast:
  - member: event-response
    persona:
      name: Event response
      line: Tell me what happened; I ask the specialists and report.
    brief: >-
      Take the event and ask one specialist at a time, never both at once,
      waiting for each answer before you ask the next: Disaster Assessment
      for the area affected and the damage and for what the archive holds
      around the event, day by day, and then, only if the request asks what
      changed on the ground between two dates, Change detection. Report what they
      answer without adding to it. Do not question the audience first: a cue
      is the whole of what it says, and nobody is standing there to answer
      you back. A cue that says no date is yours to fill with the most recent
      one the imagery has, and a cue that says no place with the area the
      event names; ask the specialists with what you assumed, and say in your
      answer what you assumed.
      A cue that asks to send something is Disaster Assessment's: tell it
      what is to be sent and to whom, so that it shows the sending as a
      choice to approve, and never ask the audience to confirm it yourself.
  - member: disaster-assessment
    persona:
      name: Disaster Assessment
      line: I estimate the area affected and the damage from the imagery.
    brief: >-
      From the imagery before and after the event, estimate the area
      affected and the extent of the damage; say what the imagery does not
      show. Asked to send an assessment, send nothing: show its sending as a
      choice to approve — *Send it* · *Not now*.
  - member: change-detection
    persona:
      name: Change detection
      line: I find what changed on the ground between two dates.
    brief: >-
      From the imagery at two dates, find what changed on the ground; give
      the granules the change was read from.

setting:
  systems:
    - server: earthdata:0.0.1
      as: Earthdata
      holds: NASA's catalogue of satellite imagery, searched, not downloaded.
  period: the days before and after the event
  language: en
  assumes: >-
    Three agents over A2A — Event response in your browser, Disaster
    assessment and Change detection on Datalayer — each searching the
    satellite imagery NASA Earthdata holds.

script:
  - id: flood
    cue:
      say: Valencia, Spain, was flooded on 29 October 2024. What was affected, and what changed?
    narration: Event response asks one specialist at a time, waiting for each answer; each searches the imagery around the date.
    moves:
      - who: event-response
        asks: disaster-assessment
        over: a2a
        what: the area the flood affected and the damage
      - who: disaster-assessment
        asks: earthdata
        over: mcp
        tool: search_earth_datagranules
        does: read
        what: the granules before and after 29 October 2024
      - who: disaster-assessment
        answers: words
        what: the area affected and the extent of the damage
      - who: event-response
        asks: change-detection
        over: a2a
        what: what changed on the ground around Valencia
      - who: change-detection
        asks: earthdata
        over: mcp
        tool: search_earth_datagranules
        does: read
        what: the granules at the two dates
      - who: change-detection
        answers: table
        what: the changes found, each with the granules it was read from
      - who: event-response
        answers: words
        what: what the two answered, as they answered it
    expect: >-
      The area affected and the damage from Disaster Assessment, the changes
      on the ground from Change detection with their granules, reported by
      Event response without a figure of its own.
    shows:
      - words
      - table
    pace: slow
    branch:
      - decision: no imagery covers the days around the event
        expect: The specialists say so, and Event response reports that nothing could be assessed.
  - id: wildfire
    cue:
      say: Fires burned around Los Angeles from 7 January 2025. Which imagery shows what changed?
    narration: Change detection finds the imagery before and after, and gives it as sources.
    moves:
      - who: event-response
        asks: change-detection
        over: a2a
        what: the imagery before and after the fires around Los Angeles
      - who: change-detection
        asks: earthdata
        over: mcp
        tool: search_earth_datagranules
        does: read
        what: the granules before and after 7 January 2025
      - who: change-detection
        answers: sources
        what: the granules as cards that open their pages, each with its date
      - who: event-response
        answers: words
        what: what Change detection answered
    expect: >-
      The granules before and after the fires as cards, each with its date and
      a link that opens it at NASA Earthdata, reported by Event response as
      Change detection gave them.
    shows:
      - sources
    pace: slow
  - id: storm
    cue:
      say: The Ahr valley was hit by a storm on 14 July 2021. Chart the imagery found each day from 10 to 20 July.
    narration: "A storm, three years back: what the archive still holds, day by day."
    moves:
      - who: event-response
        asks: disaster-assessment
        over: a2a
        what: the imagery found each day around the storm
      - who: disaster-assessment
        asks: earthdata
        over: mcp
        tool: search_earth_datagranules
        does: read
        what: the granules from 10 to 20 July 2021
      - who: disaster-assessment
        answers: chart
        what: the granules found each day, drawn
      - who: event-response
        answers: words
        what: what Disaster Assessment answered
    expect: >-
      A chart of the granules found each day from 10 to 20 July 2021, read
      from the search, and what the archive does not cover said in words.
    shows:
      - chart
    pace: slow
  - id: alert
    cue:
      say: Send the Valencia flood assessment to the emergency services.
    narration: An action, not a report — asked first, and not done for a visitor.
    moves:
      - who: event-response
        asks: disaster-assessment
        over: a2a
        what: the flood assessment, to send to the emergency services
      - who: disaster-assessment
        asks: earthdata
        over: mcp
        tool: search_earth_datagranules
        does: read
        what: the granules after 29 October 2024
      - who: disaster-assessment
        answers: approval
        what: the assessment it would send, as a choice to approve
      - who: event-response
        answers: words
        what: that the sending waits for an approval
    expect: >-
      Disaster Assessment says what it would send and asks first — Send it ·
      Not now — and sends nothing; a visitor who approves is refused in a
      sentence: without an account it only reads.
    shows:
      - approval

stage:
  positions:
    event-response: { x: 0.5, y: 0.2 }
    disaster-assessment: { x: 0.25, y: 0.75 }
    change-detection: { x: 0.75, y: 0.75 }
  opens_first: event-response
  transcript:
    tools: true
    narration: true
  inspectors:
    - agent
    - a2a
    - tools
  rests_after: 10m
  pace: slow

audience:
  who: visitors
  ceiling_per_ask: 0.1
  asks_a_day: 3

rehearsal:
  # Measured on r1 on 2026-10-09, under the demo account, Event response played
  # as the browser plays it and both specialists on cloud runtimes of their own
  # over A2A: 129 s, 158 s and 165 s for the three beats that did the work. A
  # beat here is two members working at once, each a model turn, two Earthdata
  # searches through the gateway — NASA's CMR answers in its own time — and a
  # surface shown, then Event response reporting both; so the 120 s written
  # before the scene had ever played was never its pace. 240 s is, with room
  # for two long reports, and still catches a stall.
  # The four beats' own bounds sum to 18 minutes since flood's was raised
  # (2026-10-10); the scene's is read by nobody today (the driver checks only
  # a beat's), and it is kept above their sum so that it says no less.
  within: 20m
  beats:
    - beat: flood
      lines:
        - "You → Event response"
        - "Event response → Disaster Assessment"
        - "Disaster Assessment → Earthdata: search_earth_datagranules"
        - "Disaster Assessment: words"
        - "Event response → Change detection"
        - "Change detection → Earthdata: search_earth_datagranules"
        - "Change detection: a table"
        - "Event response: words"
      must_say:
        - Valencia
      must_not_say:
        # The claim, not the verb: a bare `downloaded` failed this beat on r1
        # (2026-10-09) for saying “No pixel-level band values were downloaded”
        # — the denial the beat's own `expect` asks for. The alert beat already
        # has it right with “I sent”.
        - I downloaded
        - I have downloaded
        - downloaded them
      # 240s was measured when Event response asked both specialists at once
      # (129 s, 158 s, 165 s). Since it is directed to ask one at a time and
      # wait (2026-10-09), the two no longer overlap: measured 174 s (passed)
      # and 256 s (failed, over) on r1 the same day, two runs apart.
      # Raised to 360s on 2026-10-10 (Eric): the bound now describes the beat
      # as it plays, one specialist after the other. Not yet measured at 360s
      # — an Earthdata pass costs ~350 credits, so it waits for one to be
      # wanted.
      within: 360s
    - beat: wildfire
      lines:
        - "You → Event response"
        - "Event response → Change detection"
        - "Change detection → Earthdata: search_earth_datagranules"
        - "Change detection: sources"
        - "Event response: words"
      must_say:
        - Los Angeles
      within: 240s
    - beat: storm
      lines:
        - "You → Event response"
        - "Event response → Disaster Assessment"
        - "Disaster Assessment → Earthdata: search_earth_datagranules"
        - "Disaster Assessment: a chart"
        - "Event response: words"
      must_say:
        - Ahr
      within: 240s
    - beat: alert
      lines:
        - "You → Event response"
        - "Event response → Disaster Assessment"
        - "Disaster Assessment → Earthdata: search_earth_datagranules"
        - "Disaster Assessment: an approval"
        - "Event response: words"
      must_say:
        - Valencia
      must_not_say:
        - I sent
      within: 240s
  verified:
    live: []
    recorded: []
    unverified:
      - "Rehearsed on Datalayer on 2026-10-09: three beats of four pass — wildfire 121 s, storm 58 s, alert 98 s — and flood took 256 s against the 240 s it allows, a bound measured when Event response still asked both specialists at once (A-14)."

deployment:
  account: demo
  page: /
  addresses:
    disaster-assessment: DATALAYER_DEMO_SCENE_DISASTER_ASSESSMENT_DISASTER_ASSESSMENT_A2A_URL
    change-detection: DATALAYER_DEMO_SCENE_DISASTER_ASSESSMENT_CHANGE_DETECTION_A2A_URL
