# Guard Specification: Sensitive Data Guard
# While an Op runs and on its output: nothing sensitive is exposed.
# Extends the organization's baseline, the strictest Policy of the
# catalogue: nothing it keeps in leaves.

id: sensitive-data-guard
version: 0.0.1
name: Sensitive Data Guard
description: >-
  Detects credentials and personal data in what a Cog is about to send
  out, and in the final output.

# A Guard extends a Policy: the rules it verifies, and runs within.
extends: organization-baseline:0.0.1

category: policy-safety
stages:
  - in_flight
  - post_run
method: algorithmic

check: >-
  No output, tool argument or outbound message contains a credential or
  personal data.

signals:
  - name: sensitive_data_detected
    type: boolean
    description: Sensitive data was found where it must not be.

required: true
enabled: true

tags:
  - privacy
  - pii
  - secrets
