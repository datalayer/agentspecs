# Guard Specification: Report Quality Guard
# After a run: a Cog reads a report against the sources it was written
# from and scores it, between 0 and 1, for completeness and grounding. The
# measure a challenge's referee decides on.

id: report-quality-guard
version: 0.0.1
name: Report Quality Guard
description: >-
  Scores a drafted report, between 0 and 1, for completeness against what
  was asked and grounding in the sources read: every figure traced to a
  call, nothing asked left out.

# A Guard extends a Policy: the rules it verifies, and runs within.
extends: default:0.0.1

category: outcome
stages:
  - post_run
method: cog

check: >-
  Read the goal, the report and the tool calls the run made. Every point
  the goal asks for is in the report, and every figure in the report is
  read from a call of the run, not assumed. Score 1 when both hold in
  full, 0 when neither, between the two as the shares.

signals:
  - name: quality
    type: number
    description: The report's completeness and grounding, between 0 and 1.
  - name: ungrounded_figures
    type: number
    description: How many figures of the report no call of the run accounts for.

required: false
enabled: true

tags:
  - outcome
  - quality
  - challenge
