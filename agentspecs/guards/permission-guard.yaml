# Guard Specification: Permission Guard
# Before an Op runs: who launched it may do what it does.

id: permission-guard
version: 0.0.1
name: Permission Guard
description: >-
  Checks that the person or the system launching the Op may do what the
  Op's Cogs do, by the rules of the Policy it extends.

# A Guard extends a Policy: the rules it verifies, and runs within.
extends: default:0.0.1

category: policy-safety
stages:
  - preflight
method: algorithmic

check: >-
  Each class of action the Op's Cogs take — read, write, delete, execute,
  send, buy — is one the Policy's rules allow or ask about for the launching
  identity; none is a class the Policy denies, or needs an authorization the
  identity does not hold.

signals:
  - name: permission_denied
    type: boolean
    description: A permission the Op needs is not granted.

required: true
enabled: true

tags:
  - permissions
  - identity
