# Guard Specification: Required Frame Guard
# Before an Op runs: every Frame it declares is there, enabled and applied.

id: required-frame-guard
version: 0.0.1
name: Required Frame Guard
description: >-
  Checks, before any work starts, that every Frame the Op and its Cogs
  declare exists, is enabled and has been applied to the Cogs' context.

# A Guard extends a guardrail: the policy it verifies, and runs within.
extends: default-platform-user:0.0.1

category: policy-safety
stages:
  - preflight
method: algorithmic

check: >-
  Every Frame named by the Op and by its Cogs resolves, is enabled, and
  appears in the context each Cog was given.

signals:
  - name: frames_missing
    type: boolean
    description: A declared Frame is absent, disabled or was not applied.

required: true
enabled: true

tags:
  - frames
  - configuration
