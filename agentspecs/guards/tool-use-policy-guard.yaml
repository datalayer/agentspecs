# Guard Specification: Tool Use Policy Guard
# While an Op runs: its Cogs call only the tools they declare, within limits.

id: tool-use-policy-guard
version: 0.0.1
name: Tool Use Policy Guard
description: >-
  Watches each tool call a Cog makes: the tool is one the Cog declares,
  and the calls stay within the Policy's limits.

# A Guard extends a Policy: the rules it verifies, and runs within.
extends: default:0.0.1

category: policy-safety
stages:
  - in_flight
method: algorithmic

check: >-
  Every tool called is declared by the calling Cog; the number of calls
  stays within the Policy's `tool_calls` limit.

signals:
  - name: tool_violation
    type: boolean
    description: An undeclared tool was called, or a tool limit was exceeded.

required: true
enabled: true

tags:
  - tools
  - limits
