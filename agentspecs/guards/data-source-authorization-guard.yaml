# Guard Specification: Data Source Authorization Guard
# Before an Op runs: every data source it reads is one it is allowed to read.

id: data-source-authorization-guard
version: 0.0.1
name: Data Source Authorization Guard
description: >-
  Checks that each system the Op is about to read is one the Policy lends
  it, and that reading what it reads is not something the Policy denies.

# A Guard extends a Policy: the rules it verifies, and runs within.
extends: default:0.0.1

category: policy-safety
stages:
  - preflight
method: algorithmic

check: >-
  Every MCP server the run connects to is among those the Policy lends
  (`mcp.allow`; a Policy lending none by name lends every one), and reading
  each document and Space the run names is not denied by the Policy's rules.

signals:
  - name: unauthorized_source
    type: boolean
    description: A data source outside the allowed scope is requested.

required: true
enabled: true

tags:
  - data
  - authorization
