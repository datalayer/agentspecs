# A card the person is shown: the data the agent passes, checked and answered
# normalized; it reads and writes nothing (agent_runtimes.tools.cards).
# The Traveller's options on a map (the user, 19 November 2026), drawn over
# Overture Maps' open basemap by the trip-map UI plugin.

id: show-trip-map
version: 0.0.1
name: Show Trip Map
description: >-
  Show the person the places of up to three trip options on one map — stays, restaurants, sights, stations — numbered by day, one option at a time with a switch between them, over Overture Maps' open basemap. Only points a tool returned. Drawn by the trip-map UI plugin.
tags:
  - travel
  - card
  - traveller
  - maps
enabled: true
action: read
approval: auto
runtime:
  language: python
  package: agent_runtimes.tools.cards
  method: show_trip_map
icon: "@primer/octicons-react:location"
emoji: "🗺️"

ui:
  - plugin: trip-map
