# The datalayer-social toolset (15 November 2026): a repost of one X post on
# the person's profile. It puts the post before the person's followers, so it
# publishes and waits for the person's word every time (approval: manual).

id: social-repost-x
version: 0.0.1
name: Repost on X
description: >-
  Repost one X post on the person's profile, through Datalayer's IAM; it waits
  for the person's approval every time, held to the person's X budget.
tags:
  - social
  - x
  - datalayer-social
enabled: true
action: publish
approval: manual
linked_accounts:
  - x
runtime:
  language: python
  package: agent_runtimes.tools.social
  method: repost_on_x
icon: "@primer/octicons-react:sync"
emoji: "🔁"
