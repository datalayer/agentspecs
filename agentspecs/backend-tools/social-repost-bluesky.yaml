# The datalayer-social toolset (15 November 2026): a repost of one Bluesky post
# on the person's profile. It puts the post before the person's followers, so it
# publishes and waits for the person's word every time (approval: manual).

id: social-repost-bluesky
version: 0.0.1
name: Repost on Bluesky
description: >-
  Repost one Bluesky post on the person's profile, through Datalayer's IAM;
  it waits for the person's approval every time.
tags:
  - social
  - bluesky
  - datalayer-social
enabled: true
action: publish
approval: manual
linked_accounts:
  - bluesky
runtime:
  language: python
  package: agent_runtimes.tools.social
  method: repost_on_bluesky
icon: "@primer/octicons-react:sync"
emoji: "🔁"
