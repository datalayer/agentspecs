# The datalayer-social toolset (decided 14 November 2026): a post on the
# person's own LinkedIn profile, linked in Settings, with one image. The runtime
# asks IAM with its social token; IAM posts with the person's LinkedIn grant
# (Share on LinkedIn, w_member_social), which never leaves IAM. It publishes, so
# it waits for the person's word every time (approval: manual). Set up when the
# person linked LinkedIn for posting (linked_accounts): no secret is pasted.
# LinkedIn lets Datalayer post and comment as the member, not read posts,
# comments or reactions (its Community Management API, not granted).

id: social-post-linkedin
version: 0.0.1
name: Post to LinkedIn
description: >-
  Publish one post on the person's own LinkedIn profile, linked in Settings, with
  one PNG or JPEG image and its alt text, through Datalayer's IAM; it waits for
  the person's approval every time.
tags:
  - social
  - linkedin
  - datalayer-social
enabled: true
action: publish
approval: manual
linked_accounts:
  - linkedin
runtime:
  language: python
  package: agent_runtimes.tools.social
  method: post_to_linkedin
icon: "@datalayer/icons-react:linked-in"
emoji: "💼"
