# The datalayer-social toolset (the user, 15 November 2026: "for Bluesky, make
# it clear we can do everything"): Bluesky read as the person, with their own
# account linked in Settings — the timeline, someone's posts, a thread and its
# replies, who liked or reposted a post, a profile, search of posts and people,
# the notifications, follows and followers. The runtime asks IAM with its social
# token; IAM reads with the person's session, which never leaves IAM. It only
# reads (approval: auto). No app password is pasted for it.

id: social-read-bluesky
version: 0.0.1
name: Read Bluesky
description: >-
  Read Bluesky as the person, with their account linked in Settings: their
  timeline, someone's posts, a thread and its replies, who liked or reposted a
  post, a profile, search of posts and people, their notifications, follows and
  followers, through Datalayer's IAM.
tags:
  - social
  - bluesky
  - datalayer-social
enabled: true
action: read
approval: auto
linked_accounts:
  - bluesky
runtime:
  language: python
  package: agent_runtimes.tools.social
  method: read_bluesky
icon: "@datalayer/icons-react:bluesky"
emoji: "🦋"
