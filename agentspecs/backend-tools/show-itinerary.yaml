# A card the person is shown: the data the agent passes, checked and answered
# normalized; it reads and writes nothing (agent_runtimes.tools.cards).

id: show-itinerary
version: 0.0.1
name: Show Itinerary
description: >-
  Show the person the trip day by day, each stop with its time and its place on a map. Drawn by the trip-itinerary UI plugin.
tags:
  - travel
  - card
  - traveller
enabled: true
action: read
approval: auto
runtime:
  language: python
  package: agent_runtimes.tools.cards
  method: show_itinerary
icon: "@primer/octicons-react:calendar"
emoji: "🗺️"

# The UI plugins it brings to the chat that uses it (agentspecs 0.0.196):
# injected after the agent's own while it is in use.
ui:
  - plugin: trip-itinerary
