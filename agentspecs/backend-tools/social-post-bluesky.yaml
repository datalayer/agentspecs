# The datalayer-social toolset (decided 14 November 2026): a post on the
# person's own Bluesky account, linked in Settings, with up to four images and
# their alt text. The runtime asks IAM with its social token; IAM writes the
# record with the account's session, bound to a key only IAM holds, and the
# session never leaves IAM. It publishes, so it waits for the person's word
# every time (approval: manual). Set up when the person linked Bluesky
# (linked_accounts): no app password is pasted for it.

id: social-post-bluesky
version: 0.0.1
name: Post to Bluesky
description: >-
  Publish one post on the person's own Bluesky account, linked in Settings, with
  up to four PNG or JPEG images and their alt text, through Datalayer's IAM; it
  waits for the person's approval every time.
tags:
  - social
  - bluesky
  - datalayer-social
enabled: true
action: publish
approval: manual
linked_accounts:
  - bluesky
runtime:
  language: python
  package: agent_runtimes.tools.social
  method: post_to_bluesky
icon: "@datalayer/icons-react:bluesky"
emoji: "🦋"
