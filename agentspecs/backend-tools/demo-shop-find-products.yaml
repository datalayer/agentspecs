# The demo shop's catalogue, a snapshot bundled with the demo-shop application
# (apps/demo-shop/catalog.json): read in process, never from the network; it
# changes nothing anywhere (agent_runtimes.tools.demo_shop).

id: demo-shop-find-products
version: 0.0.1
name: Find Demo Shop Products
description: >-
  Find the demo shop's products by words, category and price range, the cheapest first, each with its photo, price, rating and stock. Drawn as a grid of product cards.
tags:
  - shopping
  - demo
  - demo-shop
enabled: true
action: read
approval: auto
runtime:
  language: python
  package: agent_runtimes.tools.demo_shop
  method: find_products
icon: "@primer/octicons-react:search"
emoji: "🔎"

# The UI plugin it brings to the chat that uses it: its answer drawn as
# product cards, each with its photo.
ui:
  - plugin: product-cards
