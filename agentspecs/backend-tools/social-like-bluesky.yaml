# The datalayer-social toolset (15 November 2026): a like as the person on one
# Bluesky post. It waits for the person's word every time (approval: manual).
# Set up when the person linked Bluesky.

id: social-like-bluesky
version: 0.0.1
name: Like on Bluesky
description: >-
  Like one Bluesky post as the person, through Datalayer's IAM; it waits for
  the person's approval every time.
tags:
  - social
  - bluesky
  - datalayer-social
enabled: true
action: write
approval: manual
linked_accounts:
  - bluesky
runtime:
  language: python
  package: agent_runtimes.tools.social
  method: like_on_bluesky
icon: "@primer/octicons-react:heart"
emoji: "❤️"
