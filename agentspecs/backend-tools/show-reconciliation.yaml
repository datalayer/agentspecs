# A card the person is shown: the data the agent passes, checked and answered
# normalized; it reads and writes nothing (agent_runtimes.tools.cards).

id: show-reconciliation
version: 0.0.1
name: Show Reconciliation
description: >-
  Show the person bank lines beside the invoices they would settle, with the difference and a confidence; the person approves the matches and sends them back. Drawn by the bank-reconciliation UI plugin.
tags:
  - accounting
  - card
  - accountant
enabled: true
action: read
approval: auto
runtime:
  language: python
  package: agent_runtimes.tools.cards
  method: show_reconciliation
icon: "@primer/octicons-react:git-compare"
emoji: "🧾"

# The UI plugins it brings to the chat that uses it (agentspecs 0.0.196):
# injected after the agent's own while it is in use.
ui:
  - plugin: bank-reconciliation
    renderer: a2ui
