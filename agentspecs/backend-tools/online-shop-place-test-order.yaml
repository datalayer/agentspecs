# The online shop's catalogue, a snapshot bundled with the online-shop application
# (apps/online-shop/catalog.json): read in process, never from the network; it
# changes nothing anywhere (agent_runtimes.tools.online_shop).

id: online-shop-place-test-order
version: 0.0.1
name: Place an Online Shop Test Order
description: >-
  Place a test order of a basket at the online shop: answered with a test order number, and nothing is charged, nothing ships and nothing is kept. Placed only once the person said to. Drawn with each product's photo.
tags:
  - shopping
  - demo
  - online-shop
enabled: true
action: read
approval: auto
runtime:
  language: python
  package: agent_runtimes.tools.online_shop
  method: place_test_order
icon: "@primer/octicons-react:check-circle"
emoji: "✅"

# The UI plugin it brings to the chat that uses it: its answer drawn as
# product cards, each with its photo.
ui:
  - plugin: product-cards
