# A card the person is shown: the data the agent passes, checked and answered
# normalized; it reads and writes nothing (agent_runtimes.tools.cards).

id: show-basket
version: 0.0.1
name: Show Basket
description: >-
  Show the person the basket — each item with its seller, quantity, price and photo, the shipping, and the total summed by the tool. Nothing is bought by showing it. Drawn by the shopping-basket UI plugin.
tags:
  - shopping
  - card
  - shopper
enabled: true
action: read
approval: auto
runtime:
  language: python
  package: agent_runtimes.tools.cards
  method: show_basket
icon: "@primer/octicons-react:package"
emoji: "🛒"

# The UI plugins it brings to the chat that uses it (agentspecs 0.0.196):
# injected after the agent's own while it is in use.
ui:
  - plugin: shopping-basket
    renderer: a2ui
  - plugin: basket-total
