# Component Specification: Button

id: button
version: 0.0.1
name: Button
description: 'An action the person takes: send, run, approve. One filled button per screen.'
category: action
emoji: 🔘
a2ui: Button
properties:
  type: object
  required:
  - label
  - action
  properties:
    label:
      type: string
      title: Label
      description: What the person reads beside it.
    action:
      type: string
      title: Does
      description: 'What pressing it does, in the application''s words: send the question, run the comparison,
        approve.'
    variant:
      type: string
      title: Weight
      description: How much it stands out.
      enum:
      - primary
      - default
      - danger
      default: default
    confirm:
      type: string
      title: Asks first
      description: A sentence to confirm before it acts, when it acts on something.
bindings:
  shows: []
  sends:
  - action
events:
- press
example:
  label: Compare
  action: run the comparison
  variant: primary
