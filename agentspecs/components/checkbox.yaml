# Component Specification: Checkbox

id: checkbox
version: 0.0.1
name: Checkbox
description: 'Yes or no: an option on or off, a consent given.'
category: input
emoji: ☑️
a2ui: CheckBox
properties:
  type: object
  required:
  - label
  properties:
    label:
      type: string
      title: Label
      description: What the person reads beside it.
    default:
      type: boolean
      title: Checked
      description: Whether it starts checked.
      default: false
bindings:
  shows: []
  sends:
  - value
events:
- change
example:
  label: Include archived mail
