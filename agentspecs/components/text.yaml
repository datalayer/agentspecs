# Component Specification: Text

id: text
version: 0.0.1
name: Text
description: 'Words on the page: a heading, a paragraph, the answer — plain or Markdown.'
category: text
emoji: 🔤
a2ui: Text
properties:
  type: object
  properties:
    text:
      type: string
      title: Text
      description: What it says, when it is not bound to data.
    variant:
      type: string
      title: Variant
      description: How it reads.
      enum:
      - heading
      - subheading
      - body
      - caption
      default: body
    markdown:
      type: boolean
      title: Markdown
      description: Read the text as Markdown.
      default: false
bindings:
  shows:
  - text
  sends: []
events: []
example:
  text: Which model should this run on?
  variant: heading
