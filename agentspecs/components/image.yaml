# Component Specification: Image

id: image
version: 0.0.1
name: Image
description: 'A picture: a chart rendered elsewhere, a logo, a photo.'
category: media
emoji: 🖼️
a2ui: Image
properties:
  type: object
  required:
  - alt
  properties:
    url:
      type: string
      title: Address
      description: Where the picture is, when it is not bound to data.
      format: uri
    alt:
      type: string
      title: Says
      description: What the picture shows, for a person who cannot see it.
    fit:
      type: string
      title: Fit
      description: How it fills its place.
      enum:
      - contain
      - cover
      default: contain
bindings:
  shows:
  - url
  sends: []
events: []
example:
  alt: The application's logo
