# Component Specification: Row

id: row
version: 0.0.1
name: Row
description: Children side by side, left to right.
category: layout
emoji: ➡️
a2ui: Row
properties:
  type: object
  properties:
    gap:
      type: string
      title: Spacing
      description: The space between its children.
      enum:
      - none
      - small
      - medium
      - large
      default: medium
    align:
      type: string
      title: Alignment
      description: How its children line up.
      enum:
      - start
      - center
      - end
      - stretch
      default: stretch
    wrap:
      type: boolean
      title: Wraps
      description: Children move to a new line when there is no room.
      default: true
bindings:
  shows: []
  sends: []
events: []
example:
  gap: small
