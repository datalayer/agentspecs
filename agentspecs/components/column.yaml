# Component Specification: Column

id: column
version: 0.0.1
name: Column
description: Children one under the other.
category: layout
emoji: ⬇️
a2ui: Column
properties:
  type: object
  properties:
    gap:
      type: string
      title: Spacing
      description: The space between its children.
      enum:
      - none
      - small
      - medium
      - large
      default: medium
    align:
      type: string
      title: Alignment
      description: How its children line up.
      enum:
      - start
      - center
      - end
      - stretch
      default: stretch
bindings:
  shows: []
  sends: []
events: []
example:
  gap: medium
