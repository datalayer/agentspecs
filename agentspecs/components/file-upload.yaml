# Component Specification: File upload

id: file-upload
version: 0.0.1
name: File upload
description: 'A file the person gives the application: a document to read, a sheet to check.'
category: input
emoji: 📎
properties:
  type: object
  required:
  - label
  properties:
    label:
      type: string
      title: Label
      description: What the person reads beside it.
    accept:
      type: array
      title: Accepts
      description: The kinds of file it takes, by extension.
      items:
        type: string
        pattern: ^\.[a-z0-9]+$
    multiple:
      type: boolean
      title: Several
      description: More than one file at once.
      default: false
    max_mb:
      type: integer
      title: Largest (MB)
      description: The largest file it takes.
      minimum: 1
      maximum: 500
      default: 25
bindings:
  shows: []
  sends:
  - files
events:
- upload
example:
  label: The contract
  accept:
  - .pdf
  - .docx
