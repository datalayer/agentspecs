# Component Specification: Form

id: form
version: 0.0.1
name: Form
description: Several fields asked at once, from a JSON Schema, checked as they are filled and again when
  they arrive (drawn with @datalayer/primer-rjsf).
category: input
emoji: 🧾
properties:
  type: object
  required:
  - schema
  properties:
    title:
      type: string
      title: Title
      description: What the form is for, above it.
    schema:
      type: object
      title: Fields
      description: 'The JSON Schema of what is asked: its fields, their types, what is required.'
    submit_label:
      type: string
      title: Send button
      description: The words on its button.
      default: Send
bindings:
  shows:
  - values
  sends:
  - values
events:
- submit
example:
  title: The quote
  schema:
    type: object
    required:
    - seats
    properties:
      seats:
        type: integer
        minimum: 1
        title: Seats
