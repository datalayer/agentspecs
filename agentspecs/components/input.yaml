# Component Specification: Input

id: input
version: 0.0.1
name: Input
description: 'A field the person types in: a word, a sentence, a number, a date.'
category: input
emoji: ⌨️
a2ui: TextField
properties:
  type: object
  required:
  - label
  properties:
    label:
      type: string
      title: Label
      description: What the person reads beside it.
    placeholder:
      type: string
      title: Placeholder
      description: Shown while it is empty.
    kind:
      type: string
      title: Kind
      description: What it takes.
      enum:
      - text
      - long-text
      - number
      - email
      - date
      default: text
    required:
      type: boolean
      title: Required
      description: It must be filled before sending.
      default: false
    max_length:
      type: integer
      title: Longest
      description: The most characters it takes.
      minimum: 1
bindings:
  shows: []
  sends:
  - value
events:
- change
- submit
example:
  label: Your question
  kind: long-text
  required: true
