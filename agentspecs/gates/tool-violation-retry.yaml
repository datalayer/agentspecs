# Gate Specification: Tool Violation Retry
# A Cog that stepped outside its tools is sent back, a bounded number of
# times.

id: tool-violation-retry
version: 0.0.1
name: Tool Violation Retry
description: >-
  Sends a step back to its Cog when it called a tool it does not declare or
  exceeded a tool limit; after the retries are used up the Op stops.

stage: in_flight
guards:
  - tool-use-policy-guard:0.0.1
when: tool_violation
then: retry
otherwise: proceed
max_retries: 2

tags:
  - tools
