# UI Plugin Specification: A2UI

id: "a2ui"
version: 0.0.1
name: A2UI
description: >-
  An agent describes an interface — a form, a table, a card — as a tree of components from a catalogue the host allows, and the host renders it; what the user does in it comes back to the agent as an action.
docs_url: "https://a2ui.org/"
# Whether an agent spec may name it today (`ui_plugin: a2ui`).
enabled: true

# The catalog of visual components it renders (LOOP C-13): one catalog for the
# spec, the Canvas and Python. The A2UI v0.9 basic catalog's components, named
# as A2UI names them — their properties are A2UI's own (`standard: true`) —
# then Datalayer's own, added as an A2UI custom catalog, each with its
# properties as a JSON Schema its properties form is drawn from (C-14).
catalog: a2ui/v0.9
components:
- id: Text
  name: Text
  category: text
  emoji: 🔤
  description: 'Words on the page: a heading, a paragraph, the answer — plain or Markdown.'
  standard: true
- id: Image
  name: Image
  category: media
  emoji: 🖼️
  description: 'A picture: a chart rendered elsewhere, a logo, a photo.'
  standard: true
- id: Icon
  name: Icon
  category: media
  emoji: 🔣
  description: 'A small drawing that says what something is: a check, a warning, a link.'
  standard: true
- id: Video
  name: Video
  category: media
  emoji: 🎬
  description: A film played in place.
  standard: true
- id: AudioPlayer
  name: Audio
  category: media
  emoji: 🔊
  description: 'A sound played in place: a recording, a summary read aloud.'
  standard: true
- id: Row
  name: Row
  category: layout
  emoji: ➡️
  description: Children side by side, left to right.
  standard: true
- id: Column
  name: Column
  category: layout
  emoji: ⬇️
  description: Children one under the other.
  standard: true
- id: List
  name: List
  category: layout
  emoji: 📃
  description: 'Items one after the other, each drawn by the same children: results, alternatives, steps.'
  standard: true
- id: Card
  name: Card
  category: layout
  emoji: 🗂️
  description: 'A framed group: what belongs together, set apart.'
  standard: true
- id: Tabs
  name: Tabs
  category: layout
  emoji: 📑
  description: Several views of one place, one shown at a time.
  standard: true
- id: Divider
  name: Divider
  category: layout
  emoji: ➖
  description: A line between what comes before and after.
  standard: true
- id: Modal
  name: Modal
  category: layout
  emoji: 🪟
  description: 'A window over the page, opened by a trigger: details, a confirmation.'
  standard: true
- id: Button
  name: Button
  category: action
  emoji: 🔘
  description: 'An action the person takes: send, run, approve. One filled button per screen.'
  standard: true
- id: TextField
  name: Input
  category: input
  emoji: ⌨️
  description: 'A field the person types in: a word, a sentence, a number, a date.'
  standard: true
- id: CheckBox
  name: Checkbox
  category: input
  emoji: ☑️
  description: 'Yes or no: an option on or off, a consent given.'
  standard: true
- id: ChoicePicker
  name: Select
  category: input
  emoji: 🔽
  description: One choice, or several, among options the builder lists or the data gives.
  standard: true
- id: Slider
  name: Slider
  category: input
  emoji: 🎚️
  description: 'A number chosen along a range: a weight, a budget, a threshold.'
  standard: true
- id: DateTimeInput
  name: Date and time
  category: input
  emoji: 📅
  description: A date, a time, or both, chosen from a calendar.
  standard: true
- id: Table
  name: Table
  category: data
  emoji: 📋
  description: Rows the application found or keeps, with the columns the builder chooses.
  standard: false
  properties:
    type: object
    required:
    - columns
    properties:
      title:
        type: string
        title: Title
        description: What the table is, above it.
      columns:
        type: array
        title: Columns
        description: The columns, in order.
        minItems: 1
        items:
          type: string
      page_size:
        type: integer
        title: Rows per page
        description: How many rows show at once.
        minimum: 1
        maximum: 500
        default: 20
      selectable:
        type: boolean
        title: Selectable
        description: A row may be chosen, and its choice sent.
        default: false
  bindings:
    shows:
    - rows
    sends:
    - selected
  events:
  - select
  example:
    title: Runs
    columns:
    - model
    - pass rate
    - cost
- id: Chart
  name: Chart
  category: data
  emoji: 📊
  description: 'Numbers drawn: a bar, a line, a scatter of what the application measured.'
  standard: false
  properties:
    type: object
    required:
    - kind
    - x
    - y
    properties:
      title:
        type: string
        title: Title
        description: What the chart shows, above it.
      kind:
        type: string
        title: Kind
        description: How the numbers are drawn.
        enum:
        - bar
        - line
        - scatter
        - area
        default: bar
      x:
        type: string
        title: Across
        description: The field along the bottom.
      y:
        type: string
        title: Up
        description: The field measured.
      series:
        type: string
        title: Series
        description: A field whose values are drawn apart.
  bindings:
    shows:
    - points
    sends: []
  events: []
  example:
    kind: bar
    x: model
    y: pass rate
- id: FileUpload
  name: File upload
  category: input
  emoji: 📎
  description: 'A file the person gives the application: a document to read, a sheet to check.'
  standard: false
  properties:
    type: object
    required:
    - label
    properties:
      label:
        type: string
        title: Label
        description: What the person reads beside it.
      accept:
        type: array
        title: Accepts
        description: The kinds of file it takes, by extension.
        items:
          type: string
          pattern: ^\.[a-z0-9]+$
      multiple:
        type: boolean
        title: Several
        description: More than one file at once.
        default: false
      max_mb:
        type: integer
        title: Largest (MB)
        description: The largest file it takes.
        minimum: 1
        maximum: 500
        default: 25
  bindings:
    shows: []
    sends:
    - files
  events:
  - upload
  example:
    label: The contract
    accept:
    - .pdf
    - .docx
- id: Chat
  name: Chat
  category: conversation
  emoji: 💬
  description: 'The conversation with the application: its welcome, its starters, the composer.'
  standard: false
  properties:
    type: object
    properties:
      welcome:
        type: string
        title: Welcome
        description: What it says before anyone writes.
      placeholder:
        type: string
        title: Composer hint
        description: Shown in the composer while it is empty.
        default: Ask anything
      starters:
        type: array
        title: Starters
        description: Questions offered before the first message.
        maxItems: 6
        items:
          type: string
      show_tools:
        type: boolean
        title: Shows its tools
        description: The tool calls are shown as they happen.
        default: true
  bindings:
    shows:
    - messages
    sends:
    - message
  events:
  - send
  example:
    welcome: Ask me to research anything.
    starters:
    - What changed in Python 3.13?
- id: Evidence
  name: Evidence
  category: data
  emoji: 🔎
  description: 'What an answer rests on: the sources opened, the passages cited, each with its link.'
  standard: false
  properties:
    type: object
    properties:
      title:
        type: string
        title: Title
        description: Above the sources.
        default: Sources
      show_passages:
        type: boolean
        title: Shows passages
        description: Each source with the passage cited from it.
        default: true
      max_items:
        type: integer
        title: Most shown
        description: How many sources show before *more*.
        minimum: 1
        maximum: 50
        default: 5
  bindings:
    shows:
    - sources
    sends: []
  events:
  - open
  example:
    title: What this rests on
- id: Form
  name: Form
  category: input
  emoji: 🧾
  description: Several fields asked at once, from a JSON Schema, checked as they are filled and again
    when they arrive (drawn with @datalayer/primer-rjsf).
  standard: false
  properties:
    type: object
    required:
    - schema
    properties:
      title:
        type: string
        title: Title
        description: What the form is for, above it.
      schema:
        type: object
        title: Fields
        description: 'The JSON Schema of what is asked: its fields, their types, what is required.'
      submit_label:
        type: string
        title: Send button
        description: The words on its button.
        default: Send
  bindings:
    shows:
    - values
    sends:
    - values
  events:
  - submit
  example:
    title: The quote
    schema:
      type: object
      required:
      - seats
      properties:
        seats:
          type: integer
          minimum: 1
          title: Seats
