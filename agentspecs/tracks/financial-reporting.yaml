# Track Specification: Financial Reporting
# The full record, for seven years: an Op whose output reaches a board, an
# auditor or a regulator.

id: financial-reporting
version: 0.0.1
name: Financial Reporting Track
description: >-
  The complete record of an Op that produces financial reporting: every
  input and source, every model and setting, every Guard result, Gate
  decision, approval and edit. Kept seven years, readable by Finance and by
  audit, and fed back to Organizational Memory.

retain_for: 7_years
include:
  - op
  - frames_used
  - cogs_invoked
  - input_data
  - source_documents
  - model_versions
  - configuration
  - guard_results
  - gate_decisions
  - human_approvals
  - human_edits
  - final_output
  - actions_taken
  - timestamps
  - user_identity
  - permissions
  - environment
  - memory_links

readers:
  - finance
  - internal-audit

redact:
  - "*Password*"
  - "*Secret*"
  - "*Token*"
  - "*IBAN*"

feeds_memory: true
exchangeable: false

tags:
  - finance
  - audit
