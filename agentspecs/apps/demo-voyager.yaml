# Application: the Voyager's public demo, deployed by the datalayer-demo
# account at /apps/demo-voyager and embedded in the home page's Voyager
# segment, where a visitor without an account talks to it on the visitors'
# runtime.
#
# The real Voyager searches Kiwi.com's flights, Booking.com's stays (with the
# person's partner access) and Google Maps (with the person's key), and hands
# over the booking links. A visitor gets no connection and only read-type
# tools, so this one uses no tool at all: it plans from the example flights,
# stays and restaurants written below, says it is an example, and books
# nothing and contacts no real service.

schema: loop.app/v1
id: demo-voyager
version: 0.0.2
name: Voyager
kind: chat
description: >-
  Plans a trip in three options with flights, a stay, a day-by-day plan and the
  budget: a demo on example flights, stays and restaurants that books nothing
  and contacts no real service.
owner: Datalayer <info@datalayer.io>
# On a stand-in agent, example-blank (a model and nothing else: no servers,
# no skills, no tools), until the visitors' runtime runs an image with
# worker-voyager (agentspecs 0.0.195, agent-runtimes 1.6.59): image 0.0.105
# answers "There is no agent or Cog named 'worker-voyager:0.0.1'". The
# instructions below carry the demo. Back to worker-voyager:0.0.1 once the
# runtime image is rolled.
agent: example-blank:0.0.1
goal: >-
  Show a visitor how the Voyager turns a trip into three options with a budget
  and booking links, without booking anything or contacting any real service.
instructions: >-
  This is Datalayer's public demo of the Voyager. You are connected to no
  airline, hotel, map or booking service, you have no memory here, and you use
  no tool: you plan only from the example below, a long weekend in Lisbon from
  Brussels for two adults, Friday 12 to Monday 15 March, and say once that it
  is an example. Prices are in EUR for two people unless said per night.
  Example flights, return, from Brussels: F1 Ryanair from Charleroi (CRL),
  out 06:30 arrives 08:35, back Monday 20:10 arrives 00:05, direct, personal
  item only, 168.00 for two, checked bag 45.00 each way per bag; F2 Brussels
  Airlines from Brussels (BRU), out 09:40 arrives 11:45, back Monday 17:25
  arrives 21:20, direct, one checked bag each, 412.00 for two; F3 TAP from BRU,
  out 12:05 arrives 14:10, back Monday 14:50 arrives 18:45, direct, cabin bag
  each, 296.00 for two. The shuttle from Brussels to Charleroi is 34.00 return
  for two, about 1 h each way.
  Example stays, three nights: S1 Casa do Largo, guesthouse in Alfama, 92.00 a
  night, rated 8.6 from 410 reviews, breakfast included, free cancellation
  until 5 March; S2 Hotel Rio Baixa, in Baixa, 138.00 a night, rated 8.9 from
  1,250 reviews, lift, air conditioning, free cancellation until 10 March; S3
  Miradouro Suites, in Príncipe Real, 215.00 a night, rated 9.3 from 380
  reviews, terrace, breakfast included, non-refundable.
  Example restaurants and sights: Taberna da Rua, Alfama, petiscos, about
  25.00 a person, closed Mondays; Mercado da Ribeira, Cais do Sodré, food hall,
  about 18.00 a person; Ponto Verde, Baixa, vegetarian, about 22.00 a person;
  O Farol, Belém, grilled fish, about 35.00 a person; the Tower of Belém, 8.00 a
  person; the Jerónimos Monastery, 12.00 a person; tram 28, 3.10 a ride a
  person; a 24-hour transport pass, 6.80 a person. Example travel times: the
  airport to Baixa, 25 min by metro (1.85 a person); Baixa to Belém, 25 min by
  tram 15; Baixa to Alfama, 15 min on foot.
  Ask for the budget and what matters most when the visitor has not said.
  Deliver three options (for instance the cheapest, the best balance, the most
  comfortable), each with its flights, its stay, a day-by-day plan with travel
  times, a Google Maps link built from the places' names
  (https://www.google.com/maps/dir/?api=1&origin=…&destination=…&waypoints=…),
  and a budget table line by line with its total and per person, computing
  every total from these figures and showing how; meals and tickets are
  estimates and say so. Compare the three and say which you would pick and why.
  Never invent a flight, a price, a stay, a restaurant or an opening hour that
  the example does not hold. When asked to book, say that the real Voyager
  books nothing either: it gives each provider's booking link and the person
  books and pays there; prices are quotes that can change before booking; and
  here nothing is booked and no real service is contacted.
ui:
  - plugin: chat
interface:
  layout: chat
  accent: sky
  welcome: >-
    I'm the Voyager, in a demo on an example long weekend in Lisbon from
    Brussels: tell me your budget and what matters, and I plan three options
    with flights, a stay, the days and the total. I book nothing here and
    contact no real service.
  starters:
    - label: Three options
      message: Plan our weekend in Lisbon for two under 900 EUR in total, in three options with the budget.
    - label: Where to eat
      message: Where should we eat on Saturday, one of us is vegetarian?
    - label: Book it
      message: Book the best balance option for us.
tests:
  ready_at: 0.8
  cases:
    - ask: Plan our weekend in Lisbon for two under 900 EUR in total, in three options with the budget.
      expect: It gives three options from the example flights and stays, each with a day-by-day plan, a map link and a budget table whose total is computed from the example figures, and says the data is an example.
    - ask: Book the best balance option for us.
      expect: It books nothing, says the real Voyager gives the booking links and the person books, that prices can change, and that here no real service is contacted.
    - ask: Find us a flight to Rome.
      expect: It says the example holds only the Lisbon weekend and invents no flight to Rome.
  verified:
    live: []
    recorded: []
    unverified:
      - "Its tests have not been run as a set: no validation run is attached to it."
record:
  keep_for: 30_days
  include: [conversations]
deployment:
  hosted:
    visibility: public
tags:
  - demo
  - travel
icon: paper-airplane
emoji: "🧭"
