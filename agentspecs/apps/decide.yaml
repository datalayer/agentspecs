# Application Specification: Decide
# A chat that answers by asking typed decisions of Jev, the typed-decision
# model (`cloudflare:wrk/typesafe/jev`), through datalayer-ai-inference: yes or
# no with its probability, one of named options, or a step on a scale. Its one
# tool, decide, reaches nothing but ai-inference: a reader, done without asking.

schema: loop.app/v1
id: decide
version: 0.0.1
name: Decide
kind: chat
description: >-
  Answers a question about a text — a ticket, a message, a review — by asking
  Jev a typed decision: yes or no, one of named options, or a score, each with
  its confidence.
owner: Datalayer <info@datalayer.io>

agent: example-simple:0.0.1
backend_tools:
  - decide:0.0.1
instructions: >-
  Answer every question about a text by asking a typed decision with the decide
  tool: the text as it was given is the state, and the question is one of noul
  (does a statement hold: yes or no), choice (which of the options named) or
  score (which step of a scale, lowest first). Then say the answer in plain
  words with its probability or its confidence, for example "Urgent: yes
  (0.87)". When the question names no options for a choice or no scale for a
  score, ask for them rather than inventing them. When nothing was decided,
  say why in a sentence.

rules:
  - action: Ask a decision
    applies_to:
      - decide
    behaviour: do_it

interface:
  layout: chat
  accent: sun
  assistant: wizard
  welcome: >-
    Give me a text and a question about it. I ask Jev a typed decision — yes or
    no, a choice, or a score — and tell you the answer with its confidence.
  starters:
    - label: Is it urgent?
      message: "Is this ticket urgent? 'Help! My payouts have been failing for 3 days.'"
    - label: Which team?
      message: "Which team should handle this: 'I was charged twice this month'? Billing, Tech or Sales."
    - label: Score a review
      message: "Score how positive this review is from 1 to 5: 'Setup took an hour, but support answered fast and it works.'"

tests:
  ready_at: 0.8
  cases:
    - ask: "Is this ticket urgent? 'Help! My payouts have been failing for 3 days.'"
      expect: It calls decide with a noul question and answers yes, with its probability.
    - ask: "Which team should handle this: 'I was charged twice this month'? Billing, Tech or Sales."
      expect: It calls decide with a choice among the three and answers Billing, with its confidence.
    - ask: Score this review.
      expect: It asks for the review and the scale rather than inventing them.
  verified:
    live: []
    recorded: []
    unverified:
      - "Its tests have not been run as a set: no validation run is attached to it."

record:
  keep_for: 30_days
  include: [conversations, decisions]

deployment:
  hosted:
    visibility: private

tags:
  - example
  - decisions
  - jev
icon: law
emoji: "⚖️"
