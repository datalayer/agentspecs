# Application Specification: Supplier Comparison
# A decision: which supplier to choose for a set of orders, on the evidence of
# the order history, the price lists and the delivery records. Three criteria
# are measured, one is asked of a decision model, and one says what is missing.

schema: loop.app/v1
id: supplier-comparison
version: 0.0.1
name: Supplier Comparison
kind: decision
description: >-
  Which supplier should we choose for these orders? For an operations or
  procurement lead, at each sourcing round.
owner: Datalayer <info@datalayer.io>

agent: jupyter-data-analyst:0.0.1

contents:
  - Order history
  - Supplier price lists
  - Delivery records

decision:
  question: Which supplier should we choose for these orders?
  decision_model: "cloudflare:wrk/typesafe/jev"
  min_confidence: 0
  criteria:
    - name: Price
      kind: metric
      weight: 2
      instructions: Total cost of the orders at each supplier’s prices.
      direction: lower
    - name: Delivery reliability
      kind: metric
      weight: 2
      instructions: Share of past deliveries on time, from the delivery records.
      direction: higher
    - name: Capacity
      kind: metric
      weight: 1
      instructions: Whether the supplier’s capacity covers the ordered volume.
      direction: higher
    - name: Fit with requirements
      kind: score
      weight: 2
      instructions: How well does this supplier fit the stated requirements?
      options:
        - "None: meets none of the stated requirements"
        - "Some: meets a few, misses the important ones"
        - "Most: meets the important ones, misses a few"
        - "All: meets every stated requirement"
      direction: higher
    - name: Missing information
      kind: choice
      weight: 0
      instructions: What is missing to decide on this supplier?
      options:
        - "Capacity: a capacity figure is missing"
        - "Delivery: a delivery record is missing"
        - "Price: a price is missing"
        - "Nothing: everything needed is there"
      direction: higher

# What a visitor without an account decides on (STUDIO E-06): three
# suppliers quoting for a sample order of 5,000 units, read only. A clone
# decides on its own orders.
samples:
  alternatives:
    - name: Northfield Components
      evidence: >-
        Quotes 18,400 for the 5,000 units, delivery included. Its delivery
        records show 47 of 50 past deliveries on time. It can make 6,000 units
        a month. It meets the stated requirements: ISO 9001, delivery within
        three weeks and payment at 60 days.
      metrics:
        Price: 18400
        Delivery reliability: 0.94
        Capacity: 1.0
    - name: Harbor Supply
      evidence: >-
        Quotes 15,900 for the 5,000 units, plus 900 for delivery. 31 of 40
        past deliveries arrived on time, the late ones by a week on average.
        It can make 4,000 units a month, so the order would ship in two parts.
        It is ISO 9001 certified, and asks for payment at 30 days.
      metrics:
        Price: 16800
        Delivery reliability: 0.775
        Capacity: 0.8
    - name: Valley Works
      evidence: >-
        Quotes 17,200 for the 5,000 units, delivery included. 12 of its 15
        past deliveries arrived on time. It states a capacity of 10,000 units
        a month, but sent no figure for the last quarter. It meets the
        delivery and payment terms; its ISO 9001 certificate expired last
        year and is being renewed.
      metrics:
        Price: 17200
        Delivery reliability: 0.8
        Capacity: 1.0

interface:
  layout: page
  accent: green
  components: [Card, Column, Row, List, Tabs, Text, Slider, ChoicePicker, TextField, Button]

tests:
  ready_at: 0.8
  verified:
    live:
      - "Decided in the Studio signed in (2026-10-04): alternatives added, metrics filled, the ranking recomputed, Assess all answered by the decision model, an alternative chosen and the decision saved; on its public run page and embedded too."
    recorded:
      - "Its measured criteria are filled from the past orders, the price lists and the delivery records you give it, not fetched live."
    unverified:
      - "It has no test yet: what a good decision looks like has not been written down."

record:
  keep_for: 1_years
  include: [decisions, sources, checks]

deployment:
  hosted:
    visibility: private

tags:
  - example
  - decision
  - procurement
icon: package
emoji: "🚚"
