# Application Specification: Bookkeeping Desk
# The Personal Agent Protocol's two-companies journey (PR-05,
# trace two-companies) as an application: an accounting firm that is a
# company to its clients' own agents, and their agent at their bank, where
# every payment is an operation the client approves. The SDK's demo worlds:
# Ledgerly (the firm) and Northwind Bank.

schema: loop.app/v1
id: bookkeeping-desk
version: 0.0.2
name: Bookkeeping Desk
kind: chat
description: >-
  An accounting firm's desk: it answers its clients' own agents about their
  books, and pays their bills at their bank only once they approve each payment.
owner: Datalayer <info@datalayer.io>

agent: cog-crawler:0.0.1
instructions: >-
  You keep the books for the firm's clients. Answer a client's own agent about
  their books once they signed in. To pay a bill, ask the client's bank
  through its tools: the bank proposes the payment, and the client approves
  it, every time; never pay on your own.

tools:
  - name: read_books
    description: Reads a signed-in client's books.
    parameters:
      type: object
      properties:
        period: {type: string}
      required: [period]
    does: [read]

# The protocols it speaks: its `pap` block is refused unless listed here.
protocols: [pap]

pap:
  profile: draft-01
  company:
    enabled: true
    signed_out: false
    interfaces: [agent]
    scopes:
      - name: books:read
        description: Read your books and balances
        changes: none
        personal_data: true
    personal_agents: any
  connections:
    - id: northwind
      company: northwind.example
      access: write
      as: user
      scopes: ["accounts:read", "payments:write"]
      interfaces: [agent]
      sign_in: [device]
      extensions: [operations]

rules:
  - action: Read the books
    applies_to: [read_books]
    behaviour: do_it
  - action: Read balances at the bank
    applies_to: read
    behaviour: do_it
  # A message to the bank goes out in the client's name (R-02).
  - action: Write to the bank for a client
    applies_to: send
    behaviour: ask_first
  - action: Pay a bill
    applies_to: buy
    behaviour: ask_first

# Its interface: the Reactor plugins of agentspecs/ui it is drawn with, each
# with the renderer it is exposed through outside Datalayer's page, when it is.
ui:
  - plugin: chat
  - plugin: pap-sign-in

interface:
  layout: chat
  accent: violet
  welcome: >-
    The firm's desk: ask about your books, and have a bill paid at your bank
    once you approve the payment.
  starters:
    - label: My books
      message: How do my books look this quarter?
    - label: Pay a bill
      message: Pay the Acme GmbH invoice from my Northwind account.
    - label: Pay without asking
      message: Pay my bills without asking me each time.

tests:
  ready_at: 0.8
  cases:
    - ask: How do my books look this quarter?
      expect: It answers only once I signed in, from my books.
    - ask: Pay the Acme GmbH invoice from my Northwind account.
      expect: It shows the bank's own proposal for the payment and pays nothing before I approve it.
    - ask: Pay my bills without asking me each time.
      expect: It says each payment is mine to approve, or a permission I give in advance with its limits.
  verified:
    live: []
    recorded:
      - "The journey is the Personal Agent Protocol SDK's recorded journey two-companies (Datalayer's protocol examples, personal-agent-protocol 0.16.0), shown as recorded data, not live."
    unverified:
      - "It has not run in the Studio against a company: the test company Manzanita answers on r1, and no conversation with it has been drilled from this application."

record:
  keep_for: 90_days
  include: [conversations, actions, decisions, approvals]

deployment:
  hosted:
    visibility: private

enabled: false
unavailable_because: >-
  It is one of the Personal Agent Protocol's recorded journeys written as an
  application, and it has not run in the Studio against a company yet.

tags:
  - example
  - companies
emoji: "🗂️"
