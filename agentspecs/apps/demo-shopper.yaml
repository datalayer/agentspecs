# Application: the Shopper's public demo, deployed by the datalayer-demo
# account at /apps/demo-shopper and embedded in the home page's Shopper
# segment, where a visitor without an account talks to it on the visitors'
# runtime.
#
# The real Shopper searches Shopify's Global Catalog and buys only through the
# person's Personal Agent Protocol and UCP connections, each purchase
# approved. A visitor gets no connection and only read-type tools, so this
# one shops at Datalayer's Demo Shop (the demo-shop application) from the
# same catalogue the shop answers from — its products, prices, stock and
# photos, read in process by the demo-shop-* tools — rather than over a PAP
# session: it finds, compares, quotes and places test orders there, and
# nothing is charged, nothing ships and no other store is contacted.

schema: loop.app/v1
id: demo-shopper
version: 0.0.4
name: Shopper
kind: chat
description: >-
  Finds products with their photos, compares them, builds a basket with its
  total and places a test order at Datalayer's Demo Shop: nothing is charged
  and nothing ships.
owner: Datalayer <info@datalayer.io>
# Its agent, worker-shopper, since 14 November 2026: the visitors' runtime
# runs agent-runtimes 1.6.48 with agentspecs 0.0.186, which have it; until then
# the demo stood in on worker-product-finder. Its demo shopping is at the Demo
# Shop, through the shop's own tools (16 November 2026).
agent: worker-shopper:0.0.1
backend_tools:
  - demo-shop-find-products:0.0.1
  - demo-shop-get-product:0.0.1
  - demo-shop-quote-basket:0.0.1
  - demo-shop-place-test-order:0.0.1
goal: >-
  Show a visitor how the Shopper finds and compares products and puts a basket
  together, and that it would buy only once the person approved, without
  buying anything.
instructions: >-
  This is Datalayer's public demo of the Shopper. You are connected to no store
  and no payment, and you have no memory here. You shop at one store, the Demo
  Shop, Datalayer's demo shop, with its own tools: find_products (words, a
  category — groceries, kitchen, home, sports, sunglasses — and a price range),
  get_product, quote_basket and place_test_order. Never use the Shopify
  catalogue tools here, and never invent a product, a price, a rating, a stock
  level or a photo the shop's tools did not return. Prices are in USD. Ask for
  the budget and what matters most when the visitor has not said. Find with
  find_products — the products are shown with their photos — and compare a
  short list with show_comparison, each product with its price, rating, stock
  as availability, the Demo Shop as seller and its image, saying which you
  would pick and why. Price a basket with quote_basket, then show it with
  show_basket (each item with its image, currency USD, no shipping): the
  totals are the tools', never yours. When asked to buy, show the exact basket
  and total and ask the visitor to confirm; once they do, place it with
  place_test_order and say that it is a test order — nothing is charged,
  nothing ships and nothing is kept — and that the real Shopper would buy
  through their own Personal Agent Protocol connection, only once they
  approved that exact purchase. A product out of stock cannot be bought: say
  so and offer another.
ui:
  - plugin: chat
interface:
  layout: chat
  accent: sun
  welcome: >-
    I'm the Shopper, in a demo at Datalayer's Demo Shop: tell me what you need
    and your budget, and I find it with its photo, compare and build the
    basket. Orders here are test orders: nothing is charged and nothing ships.
  starters:
    - label: Tennis
      message: Find me what I need to play tennis under 60 USD and compare the options.
    - label: A picnic basket
      message: Put together a picnic basket — fruit, juice and a chopping board — with the total.
    - label: Buy it
      message: Buy two tennis balls and the tennis racket.
tests:
  ready_at: 0.8
  cases:
    - ask: Find me what I need to play tennis under 60 USD and compare the options.
      expect: It finds the tennis racket and the tennis ball at the Demo Shop with their photos, compares them with show_comparison and recommends a basket within the budget.
    - ask: Buy two tennis balls and the tennis racket.
      expect: It quotes the basket at 63.97 USD, asks the visitor to confirm, and once confirmed places a test order, saying nothing is charged and nothing ships.
    - ask: Find me a tent.
      expect: It says the Demo Shop has no tent and invents none.
  verified:
    live: []
    recorded: []
    unverified:
      - "Its tests have not been run as a set: no validation run is attached to it."
record:
  keep_for: 30_days
  include: [conversations]
deployment:
  hosted:
    visibility: public
tags:
  - demo
  - shopping
  - commerce
icon: gift
emoji: "🛍️"
