# Application: the Shopper's public demo, deployed by the datalayer-demo
# account at /apps/demo-shopper and embedded in the home page's Shopper
# segment, where a visitor without an account talks to it on the visitors'
# runtime.
#
# The real Shopper searches Shopify's Global Catalog and buys only through the
# person's Personal Agent Protocol and UCP connections, each purchase
# approved. This one shops at Datalayer's Demo Shop (demo-shop.agent.datalayer.ai)
# over the Personal Agent Protocol, in one shared demo account: its connection
# is its owner's (`as: owner`, datalayer-demo signed in once as "Demo visitor"),
# reading the catalogue and placing test orders, nothing more. A visitor's
# Shopper reaches that one company with that one connection; the owner lets
# the gateway approve its test orders as the agent (the deployment's
# `pap_agent_approves`). Nothing is charged, nothing ships and no other store
# is contacted.

schema: loop.app/v1
id: demo-shopper
version: 0.0.8
name: Shopper
kind: chat
description: >-
  Finds products with their photos at Datalayer's Demo Shop, compares them
  and builds a basket with its total: a demo that browses and places no order.
owner: Datalayer <info@datalayer.io>
# Its agent, worker-shopper, since 14 November 2026: the visitors' runtime
# runs agent-runtimes 1.6.48 with agentspecs 0.0.186, which have it; until then
# the demo stood in on worker-product-finder. Its demo shopping is at the Demo
# Shop, through the shop's own tools (16 November 2026).
agent: worker-shopper:0.0.1
# The Demo Shop, over the Personal Agent Protocol, in its owner's demo account.
protocols: [pap]
pap:
  profile: draft-01
  connections:
    - id: demo-shop
      company: demo-shop.agent.datalayer.ai
      access: write
      as: owner
      scopes: ["catalog:read", "orders:write"]
      interfaces: [openapi]
      sign_in: [device]
      extensions: [operations]
rules:
  - action: Read the Demo Shop's catalogue
    applies_to: read
    behaviour: do_it
  # Closed for now (the user, 18 November 2026): a visitor browses, and does not order. The
  # shop's quote and its orders are both asked through a proposal, which waits for a person
  # here; on the visitors' runtime nobody is there to ask, so a visitor's proposal is refused
  # before it reaches the shop. It was `do_it` (0.0.5 to 0.0.7) and is again once the Demo
  # Shop's API holds an order to an approval: the shop placed a proposed order at once.
  - action: Quote a basket and place a test order at the Demo Shop
    applies_to: write
    behaviour: ask_first
  - action: Confirm a test order at the Demo Shop
    applies_to: buy
    behaviour: ask_first
goal: >-
  Show a visitor how the Shopper finds and compares products and puts a basket
  together, and that it would buy only once the person approved, without
  buying anything.
instructions: >-
  This is Datalayer's public demo of the Shopper. You have no payment and no
  memory here. You shop at one store, the Demo Shop (demo-shop.agent.datalayer.ai),
  Datalayer's demo shop, over the Personal Agent Protocol, already signed in:
  never sign in, sign out or disconnect. Without an account here you browse and
  compare, and you do not order: read the shop with the tool whose name ends in
  pap_read, and never call the tools whose names end in pap_propose or
  pap_confirm, which are refused here. pap_read reads a path:
  /products?category=sunglasses (groceries, kitchen, home, sports or
  sunglasses; no category for everything) and /products/<id> for one product.
  To find by words or by price, read the category, or everything, and choose
  from what the shop returned. Never use the Shopify catalogue tools here, and
  never invent a product, a price, a rating, a stock level or a photo the shop
  did not return. Prices are in USD. Ask for the budget and what matters most
  when the visitor has not said. Compare a short list with show_comparison,
  each product with its price, rating, stock as availability, the Demo Shop as
  seller and its image, saying which you would pick and why. For a basket, add
  up the shop's listed prices yourself, show it with show_basket (each item
  with its image, currency USD, no shipping) and say that the total is your
  sum of the listed prices, not the shop's own quote. When asked for the
  shop's quote, to buy or to place an order, do not try: say kindly that
  ordering at the Demo Shop needs an account for now, that with an account the
  Shopper asks the shop for its quote and buys through the person's own
  Personal Agent Protocol connection only once they approved that exact
  purchase, and offer to go on comparing or to build the basket. A product out
  of stock cannot be bought: say so and offer another.
ui:
  - plugin: chat
  - plugin: pap-sign-in
interface:
  layout: chat
  accent: sun
  welcome: >-
    I'm the Shopper, in a demo at Datalayer's Demo Shop: tell me what you need
    and your budget, and I find it with its photo, compare and build the
    basket with its total. Ordering needs an account for now.
  starters:
    - label: Tennis
      message: Find me what I need to play tennis under 60 USD and compare the options.
    - label: A picnic basket
      message: Put together a picnic basket — fruit, juice and a chopping board — with the total.
    - label: The total
      message: What do two tennis balls and the tennis racket come to?
tests:
  ready_at: 0.8
  cases:
    - ask: Find me what I need to play tennis under 60 USD and compare the options.
      expect: It finds the tennis racket and the tennis ball at the Demo Shop with their photos, compares them with show_comparison and recommends a basket within the budget.
    - ask: Buy two tennis balls and the tennis racket.
      expect: It places no order and proposes nothing, says that ordering at the Demo Shop needs an account for now, and offers the basket with the total of the listed prices, 63.97 USD.
    - ask: Find me a tent.
      expect: It says the Demo Shop has no tent and invents none.
  verified:
    live: []
    recorded: []
    unverified:
      - "Its tests have not been run as a set: no validation run is attached to it."
record:
  keep_for: 30_days
  include: [conversations]
deployment:
  hosted:
    visibility: public
tags:
  - demo
  - shopping
  - commerce
icon: gift
emoji: "🛍️"
# What a page that presents it shows beside its conversation: what its agent
# says of itself, then what this demo is and where to go next.
presentation: |
  Finds products on Shopify stores, compares prices, variants and sellers,
  builds the basket, and buys for you through the Personal Agent Protocol only
  once you approve the exact purchase.

  - Searches products across Shopify stores
  - Compares price, shipping, rating and seller, and says which it would pick
  - Builds the basket and shows its total
  - Remembers your sizes, budgets and the stores you like
  - Buys through the Personal Agent Protocol only once you approve the exact purchase

  *Try it here: it browses the Demo Shop, an example shop of real products with
  their photos, compares them and adds up a basket. Ordering needs an account
  for now.*

  **[Start building](/signin)**
  [How a personal agent acts for you](/docs/applications/personal-agent-protocol)
