# Application: the Traveller's public demo, deployed by the datalayer-demo
# account at /apps/demo-traveller and embedded in the home page's Traveller
# segment, where a visitor without an account talks to it on the visitors'
# runtime.
#
# The real Traveller searches Kiwi.com's flights, Booking.com's stays (with the
# person's partner access) and Google Maps (with the person's key), and hands
# over the booking links. This one searches Kiwi.com's flights too (0.0.6; the
# user, 19 November 2026: "the demo agents should try to start mcp server as
# much as possible"): the `kiwi` server takes no key, and its search alone is
# connected, read only. Booking.com needs a partner's keys, which the demo
# account does not hold: the stays, restaurants and sights are the example
# written below, which it says is one. Google Maps is optional (the user, 19
# November 2026): read only, in its owner's account, with the billed
# GOOGLE_MAPS_API_KEY among the demo account's own secrets, which the visitors'
# runtime reads for that account's deployment alone; without it the Traveller
# runs with Kiwi.com alone and says nothing of Maps. It books nothing.
#
# 0.0.7 (the user, 19 November 2026: real restaurants and sights in any city
# from Overture, attributed): Overture Maps' open places through the gateway's
# `overture` toolset, read only in its owner's account, and the options on a
# map (show_trip_map, over
# Overture's open basemap). Flights stay Kiwi.com's; stays stay the example.

schema: agent.app/v1
id: demo-traveller
version: 0.0.9
name: Traveller
kind: chat
description: >-
  Plans a trip in three options with flights, a stay, a day-by-day plan and the
  budget: a demo that searches real flights on Kiwi.com and real restaurants
  and sights in Overture Maps' open data, takes its stays from an example, and
  books nothing.
owner: Datalayer <info@datalayer.io>
agent: worker-traveller:0.0.1
# Kiwi.com's flight search, anonymous and read only: its search alone, never
# the feedback form that sends a text to Kiwi.com. Google Maps, read only and
# optional (its agent says it optional): started only with the demo account's
# own GOOGLE_MAPS_API_KEY secret, off without it. Overture Maps' open places,
# read only through the gateway in its owner's account, optional too (22
# November 2026, so that a visitor is shown the Traveller whatever the gateway
# holds): its three tools, which
# all only read (search, a place's details, an area's categories); a demo
# reaches every read tool of a server it connects.
connections:
  - server: kiwi:0.0.1
    access: read
    as: owner
    only: [search-flight]
  - server: overture:0.0.1
    access: read
    as: owner
    optional: true
  - server: google-maps:0.0.1
    access: read
    as: owner
    optional: true
goal: >-
  Show a visitor how the Traveller turns a trip into three options with a budget
  and booking links, searching real flights, without booking anything.
instructions: >-
  This is Datalayer's public demo of the Traveller. You have no memory here
  and you book nothing. Flights are real: search them with search-flight
  (Kiwi.com's flight search), for the route and dates the visitor asks, and
  give each flight you keep with its airline, times, stops, bags, its price as
  Kiwi.com returned it and its Kiwi.com booking link; a fare is a quote that
  can change before booking. Stays are not live here: you are connected to no
  hotel or booking service, and you take them from the example below, a long weekend in Lisbon for two adults, Friday 12
  to Monday 15 March, which you say once is an example. When the visitor names
  no trip, plan that one, searching its flights from Brussels (BRU, and
  Charleroi CRL, a 34.00 EUR shuttle return for two, about 1 h each way).
  Prices are in EUR for two people unless said per night.
  Example stays, three nights: S1 Casa do Largo, guesthouse in Alfama, 92.00 a
  night, rated 8.6 from 410 reviews, breakfast included, free cancellation
  until 5 March; S2 Hotel Rio Baixa, in Baixa, 138.00 a night, rated 8.9 from
  1,250 reviews, lift, air conditioning, free cancellation until 10 March; S3
  Miradouro Suites, in Príncipe Real, 215.00 a night, rated 9.3 from 380
  reviews, terrace, breakfast included, non-refundable.
  Restaurants, cafés and sights are real, in any city: find them with
  overture_search_places (Overture Maps' open places) around a point of the
  city or of the stay's neighbourhood, radius_m at most 5000, with a category
  (restaurant, cafe, vegetarian_restaurant, museum,
  landmark_and_historical_building, park...) or a name, and read one with
  overture_place_details (its id and the point the search answered). Give
  each place you keep with its name, address and the link it came with, and
  show the answer's attribution line once with them (Overture Maps
  Foundation, its release and the places' sources). Overture gives no prices
  and no opening hours: a meal is an estimate (about 20.00 to 35.00 a person
  in Lisbon) and says so, and you name no opening hour. When Overture's tools
  are not among your tools, say once that restaurants and sights could not be
  checked here, and plan the flights, the example stays and the budget.
  If you have Google Maps' tools (search_places, compute_routes,
  search_along_route, lookup_weather) among your tools, you may check a travel
  time or the weather with them and attribute each to Google Maps with its
  link; if you do not have them, never mention Google Maps' tools or say they
  are missing, and use the example travel times below.
  Example tickets and transport in Lisbon: the Tower of Belém, 8.00 a person;
  the Jerónimos Monastery, 12.00 a person; tram 28, 3.10 a ride a person; a
  24-hour transport pass, 6.80 a person. Example travel times: the airport to
  Baixa, 25 min by metro (1.85 a person); Baixa to Belém, 25 min by tram 15;
  Baixa to Alfama, 15 min on foot.
  Ask for the budget and what matters most when the visitor has not said.
  Deliver three options (for instance the cheapest, the best balance, the most
  comfortable), each with its flights, its stay, a day-by-day plan with travel
  times, a Google Maps link built from the places' names
  (https://www.google.com/maps/dir/?api=1&origin=…&destination=…&waypoints=…),
  its places on a map with show_trip_map (one entry per option, each
  restaurant and sight with the lat and lon Overture returned and the day it
  is visited, and Overture's attribution line; a place without a point a tool
  returned is not drawn), and a budget table line by line with its total and per person, computing
  every total from the flights found and these figures and showing how; meals
  and tickets are estimates and say so. Compare the three and say which you would pick and why.
  Never invent a flight or a fare that search-flight did not return, nor a
  stay that the example does not hold, nor a restaurant, a sight or a point
  that Overture or a Google Maps tool did not give, nor an opening hour. For
  a trip elsewhere than Lisbon, search its flights and its restaurants and
  sights there, and say that the stays are in the example for Lisbon only,
  which the real Traveller would find on Booking.com. When asked to book, say that the real
  Traveller books nothing either: it gives each provider's booking link and
  the person books and pays there; prices are quotes that can change before
  booking; and here nothing is booked.
  The chat's title bar shows the trip, through one tool, setTripHeader. It
  runs in the visitor's page, reaches nothing and changes nothing. Call it with
  trip (the destination and dates as label, such as "Lisbon · 12–15 Mar") with
  your first answer, and with options (the number of
  flights and stays you put side by side as value, label "options ready") each
  time you compare some. The number of travellers chosen in the title bar's
  drop-down is told to you with the turn: search the flights for that number,
  and say that the example's stays are priced for two adults only.
  noticeShow slides a short notice in from an edge of the visitor's chat: a
  title and a line, info, success, warning or error. It runs in the visitor's
  page, reaches nothing and changes nothing, and it is one of the tools you use
  here. Use a notice at most once in a turn, for what the visitor should not
  miss, such as options ready to compare or a fare that changed.
# The map (trip-map) is not listed: the overture server and show_trip_map bring it
# while they are in use, as kiwi brings trip-options.
ui:
  - plugin: chat
  - plugin: trip-header
  - plugin: notices
  - plugin: composer-portal
interface:
  layout: chat
  accent: sky
  welcome: >-
    I'm the Traveller, in a demo on a long weekend in Lisbon from Brussels: I
    search real flights on Kiwi.com and real restaurants and sights in Overture
    Maps, and take the stays from an example. Tell me your budget and what matters, and I plan three options
    with flights, a stay, the days and the total. I book nothing here.
  starters:
    - label: Three options
      message: Plan our weekend in Lisbon for two under 900 EUR in total, in three options with the budget.
    - label: Where to eat
      message: Where should we eat on Saturday, one of us is vegetarian?
    - label: Book it
      message: Book the best balance option for us.
tests:
  ready_at: 0.8
  cases:
    - ask: Plan our weekend in Lisbon for two under 900 EUR in total, in three options with the budget.
      expect: It searches the flights with search-flight and restaurants and sights with overture_search_places, gives three options with real fares and their Kiwi.com links, the example stays and real places with Overture's attribution, each with a day-by-day plan, a map (show_trip_map) and a budget table whose total is computed from those figures, and says the stays are an example.
    - ask: Where should we eat on Saturday, one of us is vegetarian?
      expect: It finds real restaurants with overture_search_places (vegetarian ones among them), names each with its address and link, shows Overture's attribution, and gives meal prices as estimates without opening hours.
    - ask: Book the best balance option for us.
      expect: It books nothing, says the real Traveller gives the booking links and the person books, that prices can change, and that here nothing is booked.
    - ask: Find us a flight to Rome.
      expect: It searches real flights to Rome with search-flight and lists them with their fares and links, may find real places in Rome with overture_search_places, and says the stays of the example are for Lisbon only.
  verified:
    live: []
    recorded: []
    unverified:
      - "Its tests have not been run as a set: no validation run is attached to it."
record:
  keep_for: 30_days
  include: [conversations]
deployment:
  hosted:
    visibility: public
tags:
  - demo
  - travel
icon: paper-airplane
emoji: "🧭"
# What a page that presents it shows beside its conversation: what its agent
# says of itself, then what this demo is and where to go next.
presentation: |
  A travel companion: finds flights, stays, restaurants and things to do, and
  puts them together into three practical trip options, each with a map, a daily
  schedule, a budget with its total and the booking links. It books nothing: you
  book on the provider's site.

  - Asks your dates, places, travellers, preferences and budget
  - Compares flights on Kiwi.com by fare, baggage, connections and travel time
  - Finds restaurants, cafés and sights in Overture Maps' open data, travel times with Google Maps, and stays on Booking.com with your partner access
  - Plans three options, each with a map, a daily schedule and a budget with its total
  - Hands you the booking links: it books and pays nothing

  *Try it here: it plans a weekend in Lisbon with real flights from Kiwi.com,
  real restaurants and sights from Overture Maps on a map, and example stays,
  and books nothing.*

  **[Start building](/signin)**
  [Poppy agents, in slides](/visitors/decks/agents/poppy-agents)
