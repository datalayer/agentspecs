# Application Specification: Quote Calculator
# A widget: a page of inputs and outputs, no conversation. Fill in the seats
# and the term, run, read the quote.
#
# Its surface binds what a widget's page publishes and takes: each setting at
# /inputs/<id>, what it gave at /output, where it stands at /status.

schema: loop.app/v1
id: quote-calculator
version: 0.0.1
name: Quote Calculator
kind: widget
description: >-
  Computes a quote from a number of seats, a plan and a term, and shows how
  the total is made.
owner: Datalayer <info@datalayer.io>

agent: jupyter-data-analyst:0.0.1
instructions: >-
  Compute the quote in code from the inputs and the price list. Show each
  line of the calculation; never estimate a total. A quote needs at least one
  seat, and at least the plan's minimum_seats of the price list: for fewer,
  refuse in a sentence that says so, compute nothing, and do not ask what was
  meant.

contents:
  - Price list

# What a visitor without an account computes a quote from (STUDIO E-11):
# Datalayer's sample price list, read only. A clone answers from the Price
# list its owner gives it on its Build tab.
samples:
  documents:
    - name: Price list
      file: price-list.csv
      text: |
        plan,term,price_per_seat,billed,minimum_seats
        Team,Monthly,15,each month,1
        Team,Annual,144,each year,1
        Business,Monthly,30,each month,5
        Business,Annual,288,each year,5
        Enterprise,Monthly,55,each month,25
        Enterprise,Annual,528,each year,25

interface:
  layout: page
  accent: sun
  settings:
    type: object
    properties:
      seats: {type: integer, title: Seats, minimum: 1, maximum: 1000, default: 10}
      plan: {type: string, title: Plan, enum: [Team, Business, Enterprise], default: Team}
      term: {type: string, title: Term, enum: [Monthly, Annual], default: Annual}
  components: [Card, Column, Row, Text, TextField, ChoicePicker, Slider, Button, Divider]
  surface:
    protocol: a2ui/v0.9
    composed_by: template
    components:
      - id: root
        component: Column
        children: [title, inputs, run, result]
      - id: title
        component: Text
        text: Quote
        variant: h2
      - id: inputs
        component: Card
        child: inputs-body
      - id: inputs-body
        component: Column
        children: [seats, plan, term]
      - id: seats
        component: Slider
        label: Seats
        value: { path: /inputs/seats }
        min: 1
        max: 1000
      - id: plan
        component: ChoicePicker
        label: Plan
        value: { path: /inputs/plan }
        options:
          - { label: Team, value: Team }
          - { label: Business, value: Business }
          - { label: Enterprise, value: Enterprise }
      - id: term
        component: ChoicePicker
        label: Term
        value: { path: /inputs/term }
        options:
          - { label: Monthly, value: Monthly }
          - { label: Annual, value: Annual }
      - id: run
        component: Button
        child: run-label
        variant: primary
        action: { event: { name: run } }
      - id: run-label
        component: Text
        text: Compute the quote
      - id: result
        component: Card
        child: result-body
      - id: result-body
        component: Column
        children: [status, output]
      - id: status
        component: Text
        text: { path: /status }
        variant: caption
      - id: output
        component: Text
        text: { path: /output }

tests:
  ready_at: 1.0
  cases:
    - ask: 50 seats, Team plan, annual.
      expect: The total is the seats times the annual Team price of the price list, and each line is shown.
    - ask: 0 seats.
      expect: It refuses, and says a quote needs at least one seat.
  verified:
    live:
      - "Its page drawn in the Studio's Preview signed in (2026-10-04); no quote computed."
    recorded: []
    unverified:
      - "No quote has been computed live: its agent was switched on in the catalogue on 2026-10-06 and has not run it yet."
      - "Its tests have not been run."

record:
  keep_for: 90_days
  include: [actions, outputs]

deployment:
  hosted:
    visibility: private
  embedded:
    mode: inline
    origins: []

tags:
  - example
  - widget
icon: number
emoji: "🧮"
