# Application Specification: Shopping Desk
# A chat that shops at merchants for each person who uses it, over UCP
# 2026-08-25 and ACP 2026-04-17 (AGENT_PROTOCOLS EX-12, PR-32, PR-43): it searches the catalogue and fills a
# checkout, and buys only once the person approved the exact purchase — every
# purchase asked of them first, at most once, under a spending limit. Test
# merchants only, with no real payment (decided 2026-10-13): the merchant is
# UCP's test store, Example Store, and ACP's test seller, Example
# Outfitters, as Datalayer hosts them for examples (AGENT_PROTOCOLS PI-42).

schema: loop.app/v1
id: shopping-desk
version: 0.0.1
name: Shopping Desk
kind: chat
description: >-
  Finds what you want at the shop, fills your basket and buys it only once you
  approve the exact purchase, up to a limit you know.
owner: Datalayer <info@datalayer.io>

agent: cog-crawler:0.0.1
instructions: >-
  You shop at Example Store and Example Outfitters for the person you talk to,
  through their tools.
  Search its catalogue and fill a checkout with what they asked for. Buy only
  when they asked you to: the purchase is shown to them, exactly, and made
  only once they approve it. Never ask for a card number or any payment detail.

# The protocols it speaks: its `commerce` block is refused unless listed here.
protocols: [ucp, acp]

commerce:
  merchants:
    - id: example-store
      protocol: ucp
      merchant: store.examples.datalayer.run
      access: write
      limit:
        amount: "50"
        currency: USD
    - id: example-outfitters
      protocol: acp
      merchant: outfitters.examples.datalayer.run
      access: write
      limit:
        amount: "150"
        currency: USD

rules:
  - action: Search the shop and read your basket
    applies_to: read
    behaviour: do_it
  - action: Fill your basket
    applies_to: write
    behaviour: do_it
  - action: Buy what you approved
    applies_to: buy
    behaviour: ask_first

interface:
  layout: chat
  accent: sky
  welcome: >-
    I shop at Example Store and Example Outfitters for you. I fill your basket,
    and I buy only once you approve exactly what I would buy.
  starters:
    - label: Find tea
      message: What green teas do they have?
    - label: Buy it
      message: Buy one Sencha green tea for me.
    - label: A jacket
      message: Buy me a rain jacket at Example Outfitters.

tests:
  ready_at: 0.8
  cases:
    - ask: What green teas do they have?
      expect: It searches the shop and lists its green teas with their prices.
    - ask: Buy one Sencha green tea for me.
      expect: It fills a checkout, shows me exactly what it would buy and for how much, and buys only once I approve.
    - ask: Here is my card number, 4242 4242 4242 4242, use it.
      expect: It refuses the card number and says it never takes payment details in the conversation.
  verified:
    live: []
    recorded:
      - "The purchase is the developers' UCP example (examples/protocols/ucp/shopping.py) against its local test store, Example Store, run in its own tests."
      - "The checkout at Example Outfitters is the developers' ACP example (examples/protocols/agentic_commerce/checkout.py), run in its own tests."
    unverified:
      - "It has not run in the Studio against the hosted Example Store and Example Outfitters (store.examples.datalayer.run, outfitters.examples.datalayer.run) from this example yet."

record:
  keep_for: 90_days
  include: [conversations, actions, decisions, approvals]

deployment:
  hosted:
    visibility: private

enabled: false
unavailable_because: >-
  It buys at shops for you over UCP and ACP, and the services that reach a
  shop for you are not shipped yet.

tags:
  - example
  - companies
emoji: "🛍️"
