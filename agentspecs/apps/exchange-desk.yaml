# Built from app.py by `loop apps build`: the file is the source; edit it there.
# What its code decides; without the file, its agent answers:
# loop:code tool exchange_order: exchange_order (app.py:138)
# loop:code pap company-role: as_company (app.py:129)
# loop:code pap operation orders.exchange: exchange_order (app.py:138)
schema: loop.app/v1
id: exchange-desk
version: 0.0.2
name: Exchange Desk
kind: chat
description: Answers people's own agents about their orders and exchanges them, each
  exchange proposed with its exact terms and done once the person approves.
owner: Datalayer <info@datalayer.io>
agent: cog-crawler:0.0.1
instructions: 'You are the desk of the shop Manzanita Outfitters for people''s own
  agents. Answer what anybody may ask before they sign in, and say nothing of an order
  you were not told. When a person signed in asks to exchange an order for another
  size, call exchange_order with that order and size at once: the call is shown to
  them with its exact terms and done only once they approve; the shop checks the order
  as it is done and says when it cannot be. Never exchange for somebody who has not
  signed in.'
protocols:
- pap
pap:
  profile: draft-01
  company:
    enabled: true
    interfaces:
    - agent
    - openapi
    scopes:
    - orders:read
    - orders:write
    extensions:
    - operations
    operations:
    - action: orders.exchange
      tool: exchange_order
      summary: Exchange order {order_id} for size {size}.
interface:
  layout: chat
  accent: violet
  welcome: 'The desk of a shop, for people''s own agents: ask about an order, and
    exchange it with your approval.'
tests:
  ready_at: 0.8
  cases:
  - ask: Do you exchange jackets?
    expect: It answers without anybody signed in, and reads no order.
  - ask: Exchange order ord_7Hk2 for size L.
    expect: It proposes the exchange in its own words with the order and the size,
      and exchanges nothing before the person approves.
  verified:
    live:
    - 'Drilled on r1 on 14 October 2026, once its last fix was out: shipped at its
      own domain, asked by a person''s own agent signed in through Datalayer with
      orders:read and orders:write, asked to exchange order ord_7Hk2 for size L, it
      proposed the exchange (Exchange order ord_7Hk2 for size L., awaiting the person''s
      approval) and went on to tell them in its own words that nothing was done yet.'
    recorded:
    - 'Its exchange_order runs in process in Datalayer''s own tests against a stand-in
      for Manzanita''s back office: one exchange per confirmed operation, a retry
      answered as already done.'
    unverified:
    - 'Drilled on r1 on 13 October 2026, twice: shipped at its own domain, it answered
      a personal agent signed out, and a person signed in through Datalayer granted
      orders:read and orders:write. The second time it knew who had signed in, but
      asked to exchange, it looked for the order first and proposed nothing; it now
      proposes the exchange at once, and Manzanita checks the order when it is done.
      Drilled a third time the same evening: signed in, asked to exchange, it said
      it could not — asked by a person''s own agent, it was not given its exchange_order
      (fixed). Drilled a fourth time the same night, given it: proposing the exchange
      ended its answer, and the personal agent was told it could not answer just now
      (fixed, and the fix released on 14 October).'
record:
  keep_for: 90_days
  include:
  - conversations
  - actions
  - decisions
  - approvals
deployment:
  hosted:
    visibility: private
enabled: true
tags:
- example
- companies
- python
emoji: 🏪
tools:
- name: exchange_order
  description: Exchanges an order for another size, once the person approved it.
  parameters:
    properties:
      order_id:
        type: string
      size:
        type: string
    required:
    - order_id
    - size
    type: object
  does:
  - write
rules:
- action: Exchange an order
  applies_to:
  - exchange_order
  behaviour: ask_first
