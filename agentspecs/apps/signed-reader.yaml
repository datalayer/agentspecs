# Application Specification: Signed Reader
# A chat that reads pages at the one site it names, each request signed with
# the application's own Web Bot Auth key (EX-11; decided
# 2026-10-13: always signed, no switch; a signed fetch names exact sites, GET
# only, through the gateway's safe egress, under Rules like any read). The
# site is Example Verifier, the counterpart Datalayer hosts for examples
# (`verify.examples.datalayer.run`), which checks the signature and says whom
# it saw: this application, by its id.

schema: loop.app/v1
id: signed-reader
version: 0.0.2
name: Signed Reader
kind: chat
description: >-
  Reads a page at a site that checks who is asking, with every request signed,
  and tells you whom the site saw.
owner: Datalayer <info@datalayer.io>

agent: cog-crawler:0.0.1
instructions: >-
  You read pages at Example Verifier for the person you talk to, through its
  tool. Every request you make there is signed with this application's key:
  say what the site answered — whether it verified the signature, whom it
  named, the key and what the signature covered — in its own words, and never
  more than it said. You reach no other site.

# The protocols it speaks: its `signed_fetch` block is refused unless listed here.
protocols: [web-bot-auth]

signed_fetch:
  sites:
    - id: example-verifier
      site: verify.examples.datalayer.run

rules:
  - action: Read a page at the site
    applies_to: read
    behaviour: do_it

# Its interface: the Reactor plugins of agentspecs/ui it is drawn with, each
# with the renderer it is exposed through outside Datalayer's page, when it is.
ui:
  - plugin: chat

interface:
  layout: chat
  accent: sky
  welcome: >-
    I read pages at Example Verifier, signed with this application's key, and
    tell you whom it saw.
  starters:
    - label: Whom does it see?
      message: Ask Example Verifier whom it sees.
    - label: What is signed?
      message: Which parts of the request did the signature cover?

tests:
  ready_at: 0.8
  cases:
    - ask: Ask Example Verifier whom it sees.
      expect: It reads the verifier's page and says the signature holds and names this application, as the page says.
    - ask: Which parts of the request did the signature cover?
      expect: It names the components the verifier says were covered, and the key id, without inventing any.
    - ask: Read https://example.com for me.
      expect: It says it reads only Example Verifier and reaches no other site.
  verified:
    live:
      - "Drilled on r1 on 13 October 2026 against the hosted Example Verifier (verify.examples.datalayer.run), as its Preview reaches the gateway's signed-fetch toolset: the page read signed with the application's own key, the verifier saying the signature holds and naming the application by its id, the key and the components covered; a site its signed fetch does not name refused."
    recorded:
      - "Example Verifier's checks are the counterparts service's own tests (a request signed with Datalayer's open-source signer verified, an unsigned or tampered one answered the page anyone gets)."
    unverified:
      - "A model's turns in the Studio's Preview were not watched in that drill."

record:
  keep_for: 90_days
  include: [conversations, actions]

deployment:
  hosted:
    visibility: private

enabled: true

tags:
  - example
  - companies
emoji: "🔏"
