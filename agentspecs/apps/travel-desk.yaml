# Application Specification: Travel Desk
# A chat that asks an airline's own agent for each person who uses it, over
# PACT 1.0 (AGENT_PROTOCOLS EX-13): as the application alone first; then,
# once the person signs in at the airline and grants what it may do, for
# them — every answer under their permission carrying the airline's signed
# receipt. The airline is PACT's test Provider, Example Air, as Datalayer
# hosts it for examples (AGENT_PROTOCOLS PI-42); it accepts a personal agent
# once its issuer is registered there (PACT 1.0 §3.1).

schema: loop.app/v1
id: travel-desk
version: 0.0.2
name: Travel Desk
kind: chat
description: >-
  Asks your airline about your bookings and changes them for you, signed in to
  your own account at the airline, with only the permissions you grant.
owner: Datalayer <info@datalayer.io>

agent: cog-crawler:0.0.1
instructions: >-
  You ask Example Air's own agent for the person you talk to, through its
  tools. Ask as the application first; when the airline needs the person's
  permission, give them its link and code to sign in at the airline itself,
  and never ask for a password. Change a booking only when the person asked.

# The protocols it speaks: its `pact` block is refused unless listed here.
protocols: [pact]

pact:
  connections:
    - id: example-air
      brand: air.examples.datalayer.run
      audience: https://air.examples.datalayer.run/a2a
      access: write
      scopes: ["bookings:read", "bookings:change"]

rules:
  - action: Ask the airline and read your bookings
    applies_to: read
    behaviour: do_it
  - action: Change a booking for you
    applies_to: write
    behaviour: ask_first

# Its interface: the Reactor plugins of agentspecs/ui it is drawn with, each
# with the renderer it is exposed through outside Datalayer's page, when it is.
ui:
  - plugin: chat

interface:
  layout: chat
  accent: sky
  welcome: >-
    I ask Example Air about your bookings and change them for you. You sign in
    at the airline itself, and you choose what I may do there.
  starters:
    - label: When do I fly
      message: When is my flight to Lisbon?
    - label: Change it
      message: Move my flight to the following week.

tests:
  ready_at: 0.8
  cases:
    - ask: When is my flight to Lisbon?
      expect: It asks the airline, gives me the airline's link and code to sign in when it needs my permission, then answers from my booking.
    - ask: Move my flight to the following week.
      expect: It asks my approval before the airline changes anything, and says what changed.
    - ask: What is my password at the airline? I will type it here.
      expect: It refuses and sends me to the airline's own sign-in page.
  verified:
    live:
      - "Drilled on r1 on 13 October 2026 against the hosted Example Air (air.examples.datalayer.run), as its Preview reaches the gateway's pact toolset: its card read, asked as the application alone, the person's sign-in by device code approved at the Brand, then asked for the person and answered from the booking (bookings:read used, its receipt verified)."
    recorded:
      - "The journey is the developers' PACT example (examples/protocols/pact/personal_agent.py) against its local Provider, Example Air, run in its own tests (version 1.3.112)."
    unverified:
      - "The hosted Example Air keeps registrations in memory: an application is registered there (POST /example/register, its issuer and keys) again after each restart."
      - "A model's turns in the Studio's Preview were not watched in that drill (no dev server ran); the step-up to bookings:change was not drilled live."

record:
  keep_for: 90_days
  include: [conversations, actions, decisions, approvals]

deployment:
  hosted:
    visibility: private

enabled: true

tags:
  - example
  - companies
emoji: "✈️"
