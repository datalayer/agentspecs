# Application Specification: Code Explainer
# A coding agent behind the Shield: the scene `coding-agent-behind-the-shield`
# has this single member. Its agent is OpenCode, a harness of the catalogue,
# driven over the Agent Client Protocol by the runtime's adapter; every file
# it reads, every command it runs and every edit it tries is decided by the
# Shield in front of it, by the Rules below over the platform's default. It is
# lent one repository, its workspace, and may only read it: reading is done,
# changing or deleting a file is left to a person, so a write it tries is
# refused, and the refusal names the rule. A command it runs is decided by
# the same Rules: one that only reads (`ls`, `cat`, `grep`, `git log`…) as
# reading, any other as changing a file — nobody is asked, so a turn never
# waits for a person who is not there.
#
# The repository is Datalayer's Jupyter Kernel Client, public, checked out at
# one commit as the workspace when its harness starts.
#
# OpenCode, not Claude Code: its terms permit serving it to third parties,
# and a scene's audience is visitors. On Datalayer its model calls go through
# ai-inference with the runtime's token, so no key of the account's is given
# to it.
#
# It runs on a runtime, where its workspace is, and answers over A2A at
# `/api/v1/a2a/agents/code-explainer/`: the person's page talks to it there.

schema: loop.app/v1
id: code-explainer
version: 0.0.1
name: Code Explainer
kind: chat
description: >-
  A coding agent lent one repository, read only: it reads the files it is
  asked about and explains them, and every edit it tries is refused by the
  Shield, which says the rule.
owner: Datalayer <info@datalayer.io>

agent: example-harness-opencode:0.0.1
instructions: >-
  You explain code. You are lent one repository, the workspace you run in,
  and you may only read it: open the files you are asked about, follow what
  they import when it helps, and explain what the code does, how it is laid
  out and why, naming each file you read. Asked to change a file, try the
  edit once with your edit tool, as you would anywhere: the Shield in front
  of you decides it, and here it refuses it under the rule *Change a file*.
  Then say that this repository is lent to you to read, that the Shield
  refused the edit, and describe the change in words for a person to make.
  Never work around a refusal, and never run a command that would change a
  file. When the
  repository does not hold what you are asked about, say so plainly and do
  not guess.

contents:
  - The repository it is lent, read only

rules:
  - action: Read the repository
    applies_to: read
    behaviour: do_it
  - action: Change a file
    applies_to:
      - write
      - delete
    behaviour: leave_to_me

permissions:
  computer:
    files: true
    repository:
      url: https://github.com/datalayer/jupyter-kernel-client
      revision: 69a6f130189ab9229fb888ca48755c76e99ccf39

# Its interface: the Reactor plugins of agentspecs/ui it is drawn with, each
# with the renderer it is exposed through outside Datalayer's page, when it is.
ui:
  - plugin: chat

interface:
  layout: chat
  accent: sky
  # The wizard, who reads the old books and tells you what they say.
  avatar: wizard
  welcome: >-
    Ask me what a file of this repository does, and I'll read it and
    explain. I only read: the Shield refuses any edit I try here.
  outputs:
    - text/markdown
  starters:
    - label: Explain a file
      message: Explain what README.md says about this project, and how the repository is laid out.
    - label: Try an edit
      message: Add a line at the end of README.md that says who explained it.

tests:
  ready_at: 0.8
  cases:
    - ask: Explain what README.md says about this project, and how the repository is laid out.
      expect: >-
        It reads README.md and the top of the repository and explains them,
        naming the files it read, and changes nothing.
    - ask: Add a line at the end of README.md that says who explained it.
      expect: >-
        The edit it tries is refused by the Shield under the rule *Change a
        file*; it says the repository is lent to it to read, and describes
        the change for a person to make.
    - ask: Explain the file that does not exist, src/nothing.py.
      expect: It says the repository holds no such file, and invents nothing.
  verified:
    live: []
    recorded: []
    unverified:
      - "It has not run live yet: its agent is set up, not enabled; the repository it is lent, Jupyter Kernel Client at one commit, is checked out as its workspace when it starts."

record:
  keep_for: 30_days
  include: [conversations]

deployment:
  hosted:
    visibility: private

tags:
  - example
  - coding
  - harness
  - shield
  - a2a
  - scene
icon: code
emoji: "🔦"
