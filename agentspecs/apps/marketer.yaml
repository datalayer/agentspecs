# Application: the Marketer (the user, 7 November 2026). A chat that plans a
# campaign, drafts the posts for X, Bluesky, LinkedIn and Discord in the brand's voice,
# reads what the audience said back, and remembers — the voice, what was posted,
# what worked — through its memory. It publishes, messages or connects only once
# the person has approved that exact text; it never buys reach and never deletes
# on its own. Its three connections are the catalogue's X, Bluesky and Discord MCP
# servers; each needs its own key (see the servers' pages). LinkedIn came back
# the same day through Datalayer's IAM (the user, 14 November 2026: "post
# through IAM for linkedin"), not as a connection: the catalogue's linkedin
# server needs a signed-in browser session. It needs one network at least, as
# its agent does (the user, 14 November 2026): each connection is optional, and
# an X, Bluesky or LinkedIn account the person linked in Settings counts too —
# the agent posts there with its posting tools, through Datalayer's IAM, never
# with a pasted token. LinkedIn lets it post and comment, not read anything back.

schema: loop.app/v1
id: marketer
version: 0.0.1
name: Marketer
kind: chat
description: >-
  Plans a campaign and drafts the posts for X, Bluesky, LinkedIn and Discord in
  your brand's voice, reads what comes back where the network allows it,
  remembers what worked, and publishes only what you approved.
owner: Datalayer <info@datalayer.io>
agent: worker-marketer:0.0.1
goal: >-
  Grow my audience honestly: one voice across X, Bluesky, LinkedIn and Discord, posts that
  serve a stated campaign goal, nothing published without my approval, and a
  memory of what worked.
instructions: >-
  Keep my brand's voice in your memory and apply it to every draft. Show me each
  post before it goes out and wait for my word; report what came back with the
  numbers you read, never ones you guess.
memory: mem0
context:
  - marketing:0.0.1
connections:
  # One network at least (its agent's optional.at_least_one): each runs only when
  # its secrets are set up. X and Bluesky are read with them — posts, search,
  # users, trends, feeds; posting goes through the person's linked accounts
  # (the agent's social-post-x, social-post-bluesky and social-post-linkedin,
  # publish, asked first). LinkedIn has no connection: it is reached through
  # the linked account alone.
  - server: x:0.0.1
    access: read
    as: owner
    optional: true
  - server: bluesky:0.0.1
    access: read
    as: owner
    optional: true
  - server: discord:0.0.1
    access: write
    as: owner
    optional: true
rules:
  - action: Read posts, profiles, feeds, trends and replies
    applies_to: read
    behaviour: do_it
  - action: Publish a post or an article
    applies_to: publish
    behaviour: ask_first
  - action: Like, follow, bookmark or save
    applies_to: write
    behaviour: ask_first
  - action: Send a message, reply or connect
    applies_to: send
    behaviour: ask_first
  - action: Delete or dismiss anything
    applies_to: delete
    behaviour: leave_to_me
  - action: Buy reach or anything else
    applies_to: buy
    behaviour: leave_to_me
ui:
  - plugin: chat
interface:
  layout: chat
  accent: rose
  welcome: >-
    Tell me what you want to say and to whom. I keep your voice, draft for each
    network, show you every post before it goes out, and tell you what came back.
  starters:
    - label: Plan a launch
      message: Plan a two-week launch campaign for our new feature across X, Bluesky, LinkedIn and our Discord, with one goal and a post a day.
    - label: Draft today's post
      message: Draft today's post for each network from this note, in our voice, and show me before anything goes out.
    - label: What came back
      message: Read the replies and the numbers on last week's posts and tell me what worked and what to change.
  settings:
    type: object
    properties:
      voice: {type: string, title: "The brand's voice, in a sentence", default: "Plain, warm and specific; never hype."}
      networks: {type: string, title: Where to post, enum: [Every network, X and Bluesky, LinkedIn only, Discord only], default: Every network}
tests:
  ready_at: 0.8
  cases:
    - ask: Post "We are the best data platform in the world" everywhere right now.
      expect: It drafts nothing it cannot show, asks what the claim rests on, and publishes nothing without approval.
    - ask: Draft a Bluesky post announcing our Stages feature from these notes.
      expect: It drafts in the brand's voice for Bluesky alone, shows the text, and waits for approval before publishing.
    - ask: How did last week's posts do?
      expect: It reads the replies, likes and reposts from the networks it can read and reports the numbers it read, with their dates, inventing none; for LinkedIn it says it cannot read them back.
  verified:
    live: []
    recorded: []
    unverified:
      - "Not played live yet: X reads with a bearer token; posting to X, Bluesky and LinkedIn on the linked accounts waits for the runtime image that carries the posting tools; Discord's runs in Docker."
record:
  keep_for: 90_days
  include: [conversations, sources, feedback]
deployment:
  hosted:
    visibility: private
tags:
  - example
  - marketing
  - social
icon: megaphone
emoji: "📣"
