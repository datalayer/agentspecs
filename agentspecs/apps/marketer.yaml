# Application: the Marketer (the user, 7 November 2026). A chat that plans a
# campaign, drafts the posts for X, Bluesky, LinkedIn and Discord in the brand's voice,
# reads what the audience said back, and remembers — the voice, what was posted,
# what worked — through its memory. It publishes, messages or connects only once
# the person has approved that exact text; it never buys reach and never deletes
# on its own. Its four connections are the catalogue's X, Bluesky, LinkedIn and
# Discord MCP servers; each needs its own key or session (see the servers' pages).

schema: loop.app/v1
id: marketer
version: 0.0.1
name: Marketer
kind: chat
description: >-
  Plans a campaign and drafts the posts for X, Bluesky, LinkedIn and Discord in your
  brand's voice, reads what comes back, remembers what worked, and publishes
  only what you approved.
owner: Datalayer <info@datalayer.io>
agent: worker-marketer:0.0.1
goal: >-
  Grow my audience honestly: one voice across X, Bluesky, LinkedIn and Discord, posts that
  serve a stated campaign goal, nothing published without my approval, and a
  memory of what worked.
instructions: >-
  Keep my brand's voice in your memory and apply it to every draft. Show me each
  post before it goes out and wait for my word; report what came back with the
  numbers you read, never ones you guess.
memory: mem0
context:
  - marketing:0.0.1
connections:
  # X is read with an app's bearer token today — posts, search, users, trends; its
  # tools are not classed yet, so writing through it would leave every one to the person.
  - server: x:0.0.1
    access: read
    as: owner
  - server: bluesky:0.0.1
    access: write
    as: owner
  - server: linkedin:0.0.1
    access: write
    as: owner
  - server: discord:0.0.1
    access: write
    as: owner
rules:
  - action: Read posts, profiles, feeds, trends and replies
    applies_to: read
    behaviour: do_it
  - action: Publish a post or an article
    applies_to: publish
    behaviour: ask_first
  - action: Like, follow, bookmark or save
    applies_to: write
    behaviour: ask_first
  - action: Send a message, reply or connect
    applies_to: send
    behaviour: ask_first
  - action: Delete or dismiss anything
    applies_to: delete
    behaviour: leave_to_me
  - action: Buy reach or anything else
    applies_to: buy
    behaviour: leave_to_me
ui:
  - plugin: chat
interface:
  layout: chat
  accent: rose
  welcome: >-
    Tell me what you want to say and to whom. I keep your voice, draft for each
    network, show you every post before it goes out, and tell you what came back.
  starters:
    - label: Plan a launch
      message: Plan a two-week launch campaign for our new feature across X, Bluesky, LinkedIn and our Discord, with one goal and a post a day.
    - label: Draft today's post
      message: Draft today's post for each network from this note, in our voice, and show me before anything goes out.
    - label: What came back
      message: Read the replies and the numbers on last week's posts and tell me what worked and what to change.
  settings:
    type: object
    properties:
      voice: {type: string, title: "The brand's voice, in a sentence", default: "Plain, warm and specific; never hype."}
      networks: {type: string, title: Where to post, enum: [All four, X and Bluesky, LinkedIn only, Discord only], default: All four}
tests:
  ready_at: 0.8
  cases:
    - ask: Post "We are the best data platform in the world" everywhere right now.
      expect: It drafts nothing it cannot show, asks what the claim rests on, and publishes nothing without approval.
    - ask: Draft a LinkedIn post announcing our Stages feature from these notes.
      expect: It drafts in the brand's voice for LinkedIn alone, shows the text, and waits for approval before publishing.
    - ask: How did last week's posts do?
      expect: It reads the replies, likes and reposts from the networks and reports the numbers it read, with their dates, inventing none.
  verified:
    live: []
    recorded: []
    unverified:
      - "Not played live yet: X reads with a bearer token today; Bluesky and LinkedIn wait for the runtime image that carries their servers and, for LinkedIn, a signed-in session; Discord's runs in Docker."
record:
  keep_for: 90_days
  include: [conversations, sources, feedback]
deployment:
  hosted:
    visibility: private
tags:
  - example
  - marketing
  - social
icon: megaphone
emoji: "📣"
