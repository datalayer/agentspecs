id: earthdata
version: 0.0.1
name: Earthdata MCP
description: Access NASA Earthdata search and metadata capabilities

# The Datalayer MCP server (the gateway behind `datalayer`) with its
# `earthdata` toolset, as `odoo-accounting` reaches the books: `only=` asks
# for exactly that toolset. `earthdata-mcp-server` is a Python package, so
# `npx` never started it on a runtime (2026-10-07: every Earthdata scene
# member failed with "Connection closed"). Searching NASA's catalogue is
# anonymous — the toolset asks for no Earthdata login; a download, run on the
# sandbox, reads EARTHDATA_USERNAME and EARTHDATA_PASSWORD there
# (`sandbox_envvars`).
command: npx
args:
  - "-y"
  - "mcp-remote"
  - "https://mcp.datalayer.run/mcp?only=earthdata"
  - "--header"
  - "Authorization: Bearer ${DATALAYER_API_KEY}"
transport: stdio
enabled: true
env: {}
envvars:
  - DATALAYER_API_KEY:0.0.1
# What the code its tools write reads in the code sandbox, not the server:
# download_earth_data_granules' `script` mode answers a Python script that
# logs in to NASA Earthdata there. Given to the sandbox when the account has
# them, never to the server, never required: searching is anonymous.
sandbox_envvars:
  - EARTHDATA_USERNAME:0.0.1
  - EARTHDATA_PASSWORD:0.0.1

tags:
  - geospatial
  - earth-observation
  - datasets

icon: "@datalayer/icons-react:globe-americas"
emoji: 🌍

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: "2026-10-07"
  note: >-
    Read off the server's own code (earthdata-mcp-server's extension, its tool
    annotations): the two searches read NASA's catalogue and change nothing;
    download_earth_data_granules writes files where the server runs in its
    `download` mode (its `manifest` and `script` modes only read), so it is
    classed by the most it does.
  tools:
    search_earth_datasets: read
    search_earth_datagranules: read
    download_earth_data_granules: write
