id: earthdata
version: 0.0.1
name: Earthdata MCP
description: Access NASA Earthdata search and metadata capabilities

command: npx
args:
  - "-y"
  - "earthdata-mcp-server"

transport: stdio
enabled: true
env:
  EARTHDATA_USERNAME: ${EARTHDATA_USERNAME}
  EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD}

envvars:
  - EARTHDATA_USERNAME:0.0.1
  - EARTHDATA_PASSWORD:0.0.1

tags:
  - geospatial
  - earth-observation
  - datasets

icon: "@datalayer/icons-react:globe-americas"
emoji: 🌍

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: "2026-10-07"
  note: >-
    Read off the server's own code (earthdata-mcp-server's extension, its tool
    annotations): the two searches read NASA's catalogue and change nothing;
    download_earth_data_granules writes files where the server runs in its
    `download` mode (its `manifest` and `script` modes only read), so it is
    classed by the most it does.
  tools:
    search_earth_datasets: read
    search_earth_datagranules: read
    download_earth_data_granules: write
