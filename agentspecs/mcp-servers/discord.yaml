# MCP server: Discord (the user, 7 November 2026), SaseQ's discord-mcp: a
# Discord server through a bot — its channels, members, messages, threads,
# forums, roles, events, invites and emoji, read and written. A Java server
# shipped as a Docker image (`saseq/discord-mcp`), run over stdio with a bot
# token (`DISCORD_TOKEN`, from DISCORD_BOT_TOKEN) and, optionally, a default
# server id; its HTTP profile listens on 8085 for a client of one's own. The
# runtime image carries neither Docker nor Java, so it stays off there.

id: discord
version: 0.0.1
name: Discord
description: A Discord server through a bot — channels, members, messages, threads, forums, roles, events, invites and emoji, read and written
# Where to read about it, sign up and make the key it needs.
documentation_url: https://github.com/SaseQ/discord-mcp
signup_url: https://discord.com/developers/applications
api_key_url: https://discord.com/developers/applications
setup: "Create an application in the [Discord Developer Portal](https://discord.com/developers/applications), add a bot, copy its token into `DISCORD_BOT_TOKEN`, invite the bot to the server with the permissions of what the agent may do (and the Message Content intent to read messages); put the server's id in `DISCORD_GUILD_ID`. The server runs in Docker, [saseq/discord-mcp](https://github.com/SaseQ/discord-mcp)."
command: docker
args:
  - "run"
  - "--rm"
  - "-i"
  - "-e"
  - "DISCORD_TOKEN"
  - "-e"
  - "DISCORD_GUILD_ID"
  - "saseq/discord-mcp:latest"
transport: stdio
# Off until a runtime can run Docker or carry the Java server.
enabled: false
env:
  DISCORD_TOKEN: "${DISCORD_BOT_TOKEN}"
  DISCORD_GUILD_ID: "${DISCORD_GUILD_ID}"
envvars:
  - DISCORD_BOT_TOKEN:0.0.1
  - DISCORD_GUILD_ID:0.0.1

tags:
  - social
  - discord
  - community
  - messaging

icon: "@datalayer/icons-react:discord-mark-blue"
emoji: 💬

# What each tool does to the world (agentspecs.actions), read off the server's
# README, which marks each one: reads; sends (a message, private or by webhook);
# writes (create, edit, react, assign, time out); deletes (remove, kick, ban).
actions:
  checked: "2026-11-07"
  note: >-
    Read off the server's README, which classes its 81 tools itself: the gets,
    lists, finds and searches read; send_message, send_private_message and
    send_webhook_message send; creating, editing, reacting, assigning, moving
    and timing out write; deleting, removing, kicking and banning delete.
  tools:
    get_server_info: read
    get_user_id_by_name: read
    get_member_by_id: read
    search_members: read
    read_private_messages: read
    read_messages: read
    search_messages: read
    get_message: read
    get_message_replies: read
    find_channel: read
    list_channels: read
    get_channel_info: read
    find_category: read
    list_channels_in_category: read
    list_webhooks: read
    list_roles: read
    get_bans: read
    list_guild_scheduled_events: read
    get_guild_scheduled_event_users: read
    list_channel_permission_overwrites: read
    list_invites: read
    get_invite_details: read
    list_active_threads: read
    list_threads: read
    get_thread_info: read
    list_forum_channels: read
    get_forum_channel_info: read
    list_forum_tags: read
    list_forum_posts: read
    list_emojis: read
    get_emoji_details: read
    send_private_message: send
    send_message: send
    send_webhook_message: send
    edit_private_message: write
    edit_message: write
    add_reaction: write
    create_text_channel: write
    edit_text_channel: write
    move_channel: write
    create_category: write
    edit_category: write
    create_webhook: write
    create_role: write
    edit_role: write
    assign_role: write
    unban_member: write
    timeout_member: write
    remove_timeout: write
    set_nickname: write
    create_voice_channel: write
    create_stage_channel: write
    edit_voice_channel: write
    move_member: write
    disconnect_member: write
    modify_voice_state: write
    create_guild_scheduled_event: write
    edit_guild_scheduled_event: write
    upsert_role_channel_permissions: write
    upsert_member_channel_permissions: write
    create_invite: write
    create_forum_channel: write
    edit_forum_channel: write
    create_forum_post: write
    modify_forum_post: write
    create_emoji: write
    edit_emoji: write
    delete_private_message: delete
    delete_message: delete
    remove_reaction: delete
    delete_channel: delete
    delete_category: delete
    delete_webhook: delete
    delete_role: delete
    remove_role: delete
    kick_member: delete
    ban_member: delete
    delete_guild_scheduled_event: delete
    delete_channel_permission_overwrite: delete
    delete_invite: delete
    delete_emoji: delete
