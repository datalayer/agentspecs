# MCP Server Specification: GitHub
# Provides GitHub repository operations (issues, PRs, code search)

id: github
version: 0.0.1
name: GitHub
description: GitHub repository operations (issues, PRs, code search)

command: docker
args:
  - "run"
  - "-i"
  - "--rm"
  - "-e"
  - "GITHUB_PERSONAL_ACCESS_TOKEN"
  - "ghcr.io/github/github-mcp-server"

transport: stdio
enabled: false
env:
  GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

envvars:
  - GITHUB_TOKEN:0.0.1

tags:
  - development
  - git
  - repository
  - collaboration

icon: "@datalayer/icons-react:github-mark"
emoji: 🐙

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: null
  note: >-
    Not read off the running server yet: its tools are unknown, and unknown is the most
    restricted. Run the server, list its tools, and class each one here.
  tools: {}
