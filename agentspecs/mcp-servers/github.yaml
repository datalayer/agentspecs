# MCP Server Specification: GitHub
# Provides GitHub repository operations (issues, PRs, code search)

id: github
version: 0.0.1
name: GitHub
description: GitHub repository operations (issues, PRs, code search)
# Where to read about it, sign up and make the key it needs (the user, 7 November 2026).
documentation_url: https://github.com/github/github-mcp-server
signup_url: https://github.com/signup
api_key_url: https://github.com/settings/tokens
setup: "A [personal access token](https://github.com/settings/tokens) with the scopes of what the agent may do, in `GITHUB_TOKEN`; the server runs in Docker, see [github-mcp-server](https://github.com/github/github-mcp-server)."

command: docker
args:
  - "run"
  - "-i"
  - "--rm"
  - "-e"
  - "GITHUB_PERSONAL_ACCESS_TOKEN"
  - "ghcr.io/github/github-mcp-server"

transport: stdio
enabled: false
env:
  GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

envvars:
  - GITHUB_TOKEN:0.0.1

install:
  type: docker
  command: "docker pull ghcr.io/github/github-mcp-server"
  note: "Needs Docker where the agent runs."

tags:
  - development
  - git
  - repository
  - collaboration

icon: "@datalayer/icons-react:github-mark"
emoji: 🐙

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: null
  note: >-
    Not read off the running server yet: its tools are unknown, and unknown is the most
    restricted. Run the server, list its tools, and class each one here.
  tools: {}
