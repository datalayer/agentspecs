id: slack
version: 0.0.1
name: Slack
description: Slack messaging and channel operations
# Where to read about it, sign up and make the key it needs (the user, 7 November 2026).
documentation_url: https://api.slack.com/docs
signup_url: https://slack.com/get-started
api_key_url: https://api.slack.com/apps
setup: "A [Slack app](https://api.slack.com/apps) with a bot token (`SLACK_BOT_TOKEN`), the workspace id (`SLACK_TEAM_ID`) and the channels it may read (`SLACK_CHANNEL_IDS`); see [Slack's docs](https://api.slack.com/docs)."

command: npx
args:
  - "-y"
  - "@datalayer/slack-mcp-server"

transport: stdio

envvars:
  - SLACK_BOT_TOKEN:0.0.1
  - SLACK_TEAM_ID:0.0.1
  - SLACK_CHANNEL_IDS:0.0.1

env:
  SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
  SLACK_TEAM_ID: "${SLACK_TEAM_ID}"
  SLACK_CHANNEL_IDS: "${SLACK_CHANNEL_IDS}"

# Not offered on the platform yet: the integrations page lists it as not available.
enabled: false

install:
  type: npm
  command: "npm install -g @datalayer/slack-mcp-server"
  note: "Needs Node.js; `npx -y` also fetches it at start."

tags:
  - communication
  - messaging
  - collaboration

icon: "@datalayer/icons-react:slack"
emoji: 💬

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: "2026-10-02"
  note: >-
    Posting, replying and reacting put something in front of other people. A post and
    a reply say the argument holding their words (`signs`): an application's runtime
    closes it with its byline.
  tools:
    slack_list_channels: read
    slack_post_message:
      class: send
      signs: text
    slack_reply_to_thread:
      class: send
      signs: text
    slack_add_reaction: send
    slack_get_channel_history: read
    slack_get_thread_replies: read
    slack_get_users: read
    slack_get_user_profile: read
