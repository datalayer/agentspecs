# MCP Server Specification: Odoo
# Odoo ERP operations (search, invoices, journals, reconciliations)

id: odoo
version: 0.0.1
name: Odoo
description: Odoo ERP operations (search, invoices, journals, reconciliations)

command: uvx
args:
  - mcp-server-odoo

transport: stdio
enabled: false
env:
  ODOO_URL: "${ODOO_URL}"
  ODOO_API_KEY: "${ODOO_API_KEY}"
  ODOO_DB: "${ODOO_DB}"
  ODOO_LOCALE: "${ODOO_LOCALE}"

tags:
  - erp
  - accounting
  - finance
  - odoo

icon: server
emoji: "📚"

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: null
  note: >-
    Not read off the running server yet: its tools are unknown, and unknown is the most
    restricted. Run the server, list its tools, and class each one here.
  tools: {}
