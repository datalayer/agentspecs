id: chart
version: 0.0.1
name: Chart Generator
description: Generate charts and visualizations

command: npx
args:
  - "-y"
  - "@antv/mcp-server-chart"

transport: stdio

# Not offered on the platform yet: the integrations page lists it as not available.
enabled: false

tags:
  - visualization
  - charts
  - graphics

icon: graph
emoji: 📊

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: "2026-10-02"
  note: >-
    Every tool draws a chart from the data it is given, and returns it.
  tools:
    "generate_*": read
