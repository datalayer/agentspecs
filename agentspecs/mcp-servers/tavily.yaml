id: tavily
version: 0.0.1
name: Tavily Search
description: Web search and research capabilities via Tavily API
# Where to read about it, sign up and make the key it needs (the user, 7 November 2026).
documentation_url: https://docs.tavily.com
signup_url: https://app.tavily.com
api_key_url: https://app.tavily.com/home
setup: "A key from the [Tavily dashboard](https://app.tavily.com/home), in `TAVILY_API_KEY`; the docs are at [docs.tavily.com](https://docs.tavily.com)."

# A local process again (the user, 26 November 2026: "Put back tavily as local
# process but make it optional, so agent can launch on kagent without tavily"):
# Tavily's hosted server (agentspecs 0.1.22 and 0.1.23) left codemode agents
# without its tools, codemode's registry reaching only local servers and plain
# HTTP ones. The key is read in this process, so an engine whose sandbox holds
# no secret (Kagent) cannot run it: the agents that name it list it optional.
command: npx
args:
  - "-y"
  - "tavily-mcp"

transport: stdio

env:
  TAVILY_API_KEY: ${TAVILY_API_KEY}

envvars:
  - TAVILY_API_KEY:0.0.1

# Not offered on the platform yet: the integrations page lists it as not available.
enabled: true

install:
  type: npm
  command: "npm install -g tavily-mcp"
  note: "Needs Node.js; `npx -y` also fetches it at start."

tags:
  - search
  - research
  - web

icon: "@primer/octicons-react:search"
emoji: 🔍

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: "2026-10-02"
  note: >-
    Every tool searches or reads the web; none changes anything.
  tools:
    tavily_search: read
    tavily_extract: read
    tavily_crawl: read
    tavily_map: read
    tavily_research: read
