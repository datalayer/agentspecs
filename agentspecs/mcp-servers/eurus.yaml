id: eurus
version: 0.0.1
name: Eurus Climate MCP
description: Climate and reanalysis analysis tools for spatial workflows
# Where to read about it, sign up and make the key it needs (the user, 7 November 2026).
setup: "Runs the `eurus-mcp` command where it is installed; no account and no key."

command: eurus-mcp
args: []

transport: stdio
enabled: false
env: {}

install:
  type: other
  command: ""
  note: "Runs the `eurus-mcp` command, from a package that is not published: install it where the agent runs from its source."

tags:
  - geospatial
  - climate
  - analysis

icon: "@primer/octicons-react:cloud"
emoji: 🌦️

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: null
  note: >-
    Not read off the running server yet: its tools are unknown, and unknown is the most
    restricted. Run the server, list its tools, and class each one here.
  tools: {}
