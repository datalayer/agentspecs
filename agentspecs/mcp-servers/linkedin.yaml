# MCP server: LinkedIn (the user, 7 November 2026), stickerdaniel's
# linkedin-mcp-server, `mcp-server-linkedin` on PyPI (Python 3.12), run with
# uvx over stdio. It reads and acts through a signed-in browser session, not a
# key: on a person's machine it imports the session from a local browser or
# opens a login window; a headless runtime has neither, so it stays off there
# until a session made elsewhere is mounted at ~/.linkedin-mcp. LinkedIn's
# User Agreement restricts automated access; the README says an account may be
# restricted for it, and so does this spec.

id: linkedin
version: 0.0.1
name: LinkedIn
description: A LinkedIn account's feed, profiles, companies, jobs and inbox through a signed-in browser session, and messaging, connecting and replying as it
# Where to read about it, sign up and make what it needs.
documentation_url: https://github.com/stickerdaniel/linkedin-mcp-server
signup_url: https://www.linkedin.com/signup
api_key_url: https://github.com/stickerdaniel/linkedin-mcp-server#installation
setup: "No key: the server uses a signed-in browser session. On your own machine, run `uvx mcp-server-linkedin --login` once (or `--import-from-browser`) and it keeps the session under ~/.linkedin-mcp; a runtime needs that directory mounted. LinkedIn restricts automated access — use an account you can afford to see restricted."
command: uvx
args:
  - "mcp-server-linkedin"
transport: stdio
# Off until a signed-in session can be given to a runtime.
enabled: false
env:
  UV_HTTP_TIMEOUT: "300"
envvars: []

tags:
  - social
  - linkedin
  - jobs
  - messaging

icon: "@datalayer/icons-react:linked-in"
emoji: 💼

# What each tool does to the world (agentspecs.actions), read off the
# server's README: the gets and searches read; messages and connections are
# sent; a job dismissed is gone for good.
actions:
  checked: "2026-11-07"
  note: >-
    Read off the server's README: profiles, companies, jobs, the feed and the
    inbox are read; connect_with_person, send_message and reply_to_conversation
    send on the person's behalf (after confirmation, the README says);
    archive_conversation and close_session write; dismiss_job deletes, and
    cannot be undone.
  tools:
    get_person_profile: read
    get_my_profile: read
    connect_with_person: send
    get_sidebar_profiles: read
    get_inbox: read
    get_conversation: read
    search_conversations: read
    archive_conversation: write
    send_message: send
    reply_to_conversation: send
    get_company_profile: read
    get_company_posts: read
    search_companies: read
    get_company_employees: read
    search_jobs: read
    get_saved_jobs: read
    dismiss_job: delete
    search_people: read
    get_job_details: read
    get_job_apply_url: read
    get_easy_apply_form: read
    get_feed: read
    search_posts: read
    get_session_status: read
    close_session: write
