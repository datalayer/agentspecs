# MCP server: LinkedIn (the user, 7 November 2026), stickerdaniel's
# linkedin-mcp-server, `mcp-server-linkedin` on PyPI (Python 3.12), run with
# uvx over stdio. It reads and acts through a signed-in browser session, not a
# key. On a runtime (15 November 2026) the person signs in to LinkedIn from the
# chat, in the runtime's own browser (agent-runtimes' browser-session plugin);
# the runtime writes that session where the server reads one made elsewhere
# (cookies.json and source-state.json under ~/.linkedin-mcp, mode 0600) and
# starts it again. The session is that runtime's alone and gone with it.
# LinkedIn's reCAPTCHA loops forever on that sign-in from an AWS address, so
# (the user, 15 November 2026) the person may also paste their own browser's
# session once, in Settings › LinkedIn: LINKEDIN_LI_AT, kept in their Vault
# secrets, given to each new runtime of theirs (`optional_envvars`: given when
# the account has it, never required, never to a deployment) and written there
# as the server's session before it starts. The interactive sign-in stays,
# beside it. LinkedIn's
# User Agreement restricts automated access; the README says an account may be
# restricted for it, and so does this spec.

id: linkedin
version: 0.0.1
name: LinkedIn
description: A LinkedIn account's feed, profiles, companies, jobs and inbox through a signed-in browser session, and messaging, connecting and replying as it
# Where to read about it, sign up and make what it needs.
documentation_url: https://github.com/stickerdaniel/linkedin-mcp-server
signup_url: https://www.linkedin.com/signup
api_key_url: https://github.com/stickerdaniel/linkedin-mcp-server#installation
setup: "No key: the server uses your signed-in LinkedIn session. Paste it once in Settings › LinkedIn (the `li_at` cookie of a browser where you are signed in to LinkedIn, kept in your Vault secrets as LINKEDIN_LI_AT): each new runtime of yours starts the server signed in with it. Or, in the chat, press Sign in to LinkedIn: LinkedIn's login opens in your runtime's own browser, you sign in there, and the server reads and acts through that session, kept on that runtime alone and gone when it ends. On your own machine, `uvx mcp-server-linkedin --login` does the same. LinkedIn restricts automated access: use an account you can afford to see restricted."
command: uvx
args:
  - "mcp-server-linkedin"
transport: stdio
# Enabled (the user, 7 November 2026): offered in the catalogue; where it runs is the runtime image's affair.
enabled: true
env:
  UV_HTTP_TIMEOUT: "300"
  # A runtime has no screen: the server's browser runs headless.
  HEADLESS: "true"
envvars: []
# The person's own LinkedIn session, pasted in Settings › LinkedIn (the user,
# 15 November 2026): given to the runtime when the account has it, never
# required; the runtime writes it as the server's session (the `li_at` cookie
# on .linkedin.com) in the Jupyter container, never in the server's env.
optional_envvars:
  - LINKEDIN_LI_AT:0.0.1

install:
  type: python
  command: "uv tool install --python 3.12 mcp-server-linkedin"
  note: "Needs uv (`pip install uv`) and a glibc Linux, macOS or Windows (its browser driver, patchright, publishes no musl build). It reads the browser session the chat's Sign in to LinkedIn writes under ~/.linkedin-mcp."

tags:
  - social
  - linkedin
  - jobs
  - messaging

icon: "@datalayer/icons-react:linked-in"
emoji: 💼

# What each tool does to the world (agentspecs.actions), read off the
# server's README: the gets and searches read; messages and connections are
# sent; a job dismissed is gone for good.
actions:
  checked: "2026-11-07"
  note: >-
    Read off the server's README: profiles, companies, jobs, the feed and the
    inbox are read; connect_with_person, send_message and reply_to_conversation
    send on the person's behalf (after confirmation, the README says);
    archive_conversation and close_session write; dismiss_job deletes, and
    cannot be undone.
  tools:
    get_person_profile: read
    get_my_profile: read
    connect_with_person: send
    get_sidebar_profiles: read
    get_inbox: read
    get_conversation: read
    search_conversations: read
    archive_conversation: write
    send_message: send
    reply_to_conversation: send
    get_company_profile: read
    get_company_posts: read
    search_companies: read
    get_company_employees: read
    search_jobs: read
    get_saved_jobs: read
    dismiss_job: delete
    search_people: read
    get_job_details: read
    get_job_apply_url: read
    get_easy_apply_form: read
    get_feed: read
    search_posts: read
    get_session_status: read
    close_session: write

# The UI plugins it brings to the chat that uses it (agentspecs 0.0.196):
# injected after the agent's own while it is in use.
ui:
  - plugin: browser-session
