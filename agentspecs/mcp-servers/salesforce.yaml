# MCP Server Specification: Salesforce
# Provides Salesforce CRM operations (queries, reports, objects, SOQL)

id: salesforce
version: 0.0.1
name: Salesforce
description: Salesforce CRM operations (queries, reports, objects, SOQL)
# Where to read about it, sign up and make the key it needs (the user, 7 November 2026).
documentation_url: https://developer.salesforce.com/docs
signup_url: https://developer.salesforce.com/signup
api_key_url: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/quickstart_oauth.htm
setup: "An access token and the instance url (`SALESFORCE_ACCESS_TOKEN`, `SALESFORCE_INSTANCE_URL`) from a [connected app](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/quickstart_oauth.htm) of your org; [sign up](https://developer.salesforce.com/signup) for a developer org if you have none."

command: npx
args:
  - "-y"
  - "@anthropic/salesforce-mcp-server"

transport: stdio
enabled: false
env:
  SALESFORCE_ACCESS_TOKEN: "${SALESFORCE_ACCESS_TOKEN}"
  SALESFORCE_INSTANCE_URL: "${SALESFORCE_INSTANCE_URL}"

envvars:
  - SALESFORCE_ACCESS_TOKEN:0.0.1
  - SALESFORCE_INSTANCE_URL:0.0.1

tags:
  - crm
  - sales
  - analytics

icon: "@primer/octicons-react:briefcase"
emoji: ☁️

# What each tool does to the world (agentspecs.actions). A tool not named here is
# unknown, and unknown is the most restricted.
actions:
  checked: null
  note: >-
    Not read off the running server yet: its tools are unknown, and unknown is the most
    restricted. Run the server, list its tools, and class each one here.
  tools: {}
