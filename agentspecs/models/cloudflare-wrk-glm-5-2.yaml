# AI Model Specification: Cloudflare GLM-5.2

id: "cloudflare:wrk/zai-org/glm-5.2"
version: 0.0.1
# The id this model had before 0.0.9 named its route; kept so it still resolves.
aliases:
  - "cloudflare:zai-org/glm-5.2"
name: Cloudflare GLM-5.2
description: Z.ai GLM-5.2 on Cloudflare Workers AI - 262k context, tool calling; a frontier model billed from AI Gateway credits
provider: cloudflare
provider_url: "https://developers.cloudflare.com/workers-ai/models/glm-5.2/"
default: false
available: true
tokens_limit: 32768
billing: credits
route: workers-ai
context_window: 262144

# Hosted through datalayer-ai-inference, which holds the Cloudflare account
# and token and routes the call through the account's AI Gateway. Nothing is
# required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
