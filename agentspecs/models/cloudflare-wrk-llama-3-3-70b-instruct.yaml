# AI Model Specification: Cloudflare Workers AI Llama 3.3 70B Instruct

id: "cloudflare:wrk/meta/llama-3.3-70b-instruct-fp8-fast"
version: 0.0.1
# The id this model had before 0.0.9 named its route; kept so it still resolves.
aliases:
  - "cloudflare:meta/llama-3.3-70b-instruct-fp8-fast"
name: Cloudflare Llama 3.3 70B
description: Meta Llama 3.3 70B Instruct (fp8, fast) on Cloudflare Workers AI - 24k context, tool calling, standard billing
provider: cloudflare
provider_url: "https://developers.cloudflare.com/workers-ai/models/llama-3.3-70b-instruct-fp8-fast/"
default: false
available: false
tokens_limit: 8192
billing: standard
route: workers-ai
context_window: 24000

# Cloudflare's per-token price, from
# https://developers.cloudflare.com/workers-ai/platform/pricing/ (read
# 2026-10-08). Workers AI bills neurons ($0.011 per thousand), which
# ai-inference meters when the answer reports them; this is the same price per
# token, for a call that reports none.
pricing:
  input_usd_per_million: 0.293
  output_usd_per_million: 2.253

# Hosted through datalayer-ai-inference, which holds the Cloudflare account
# and token and routes the call through the account's AI Gateway. Nothing is
# required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
