# AI Model Specification: Cloudflare Gemma 4 26B

id: "cloudflare:wrk/google/gemma-4-26b-a4b-it"
version: 0.0.1
# The id this model had before 0.0.9 named its route; kept so it still resolves.
aliases:
  - "cloudflare:google/gemma-4-26b-a4b-it"
name: Cloudflare Gemma 4 26B
description: Google Gemma 4 26B (a4b, instruction-tuned) on Cloudflare Workers AI - 256k context, tool calling, standard billing
provider: cloudflare
provider_url: "https://developers.cloudflare.com/workers-ai/models/gemma-4-26b-a4b-it/"
default: false
available: false
tokens_limit: 16384
billing: standard
route: workers-ai
context_window: 256000

# Cloudflare's per-token price, from
# https://developers.cloudflare.com/workers-ai/platform/pricing/ (read
# 2026-10-08). Workers AI bills neurons ($0.011 per thousand), which
# ai-inference meters when the answer reports them; this is the same price per
# token, for a call that reports none.
pricing:
  input_usd_per_million: 0.1
  output_usd_per_million: 0.3

# Hosted through datalayer-ai-inference, which holds the Cloudflare account
# and token and routes the call through the account's AI Gateway. Nothing is
# required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
