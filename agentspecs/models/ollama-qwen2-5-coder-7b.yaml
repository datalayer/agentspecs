# AI Model Specification: Qwen2.5 Coder 7B (Ollama)

id: "ollama:qwen2.5-coder:7b"
version: 0.0.1
name: Qwen2.5 Coder 7B (Ollama)
description: Qwen2.5 Coder 7B running locally through Ollama - code-focused with tool calling
provider: ollama
default: false
available: false
tokens_limit: 4096

# Runs on the user's own machine: no API key, and selecting it moves execution
# to a local sandbox so the code stays where the tokens do.
local: true
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
