# AI Model Specification: OpenAI GPT-4o Mini

id: "openai:gpt-4o-mini"
version: 0.0.1
name: OpenAI GPT-4o Mini
description: GPT-4o Mini by OpenAI - compact and cost-effective
provider: openai
provider_url: "https://platform.openai.com/docs/models/gpt-4o-mini"
default: false
available: false
tokens_limit: 16384

# OpenAI's Standard-tier price, from
# https://developers.openai.com/api/docs/pricing (read 2026-10-08). Cached
# input is $0.075 per million there; the catalogue has no field for it.
# The same as pydantic/genai-prices (main bd966a9, read 2026-10-08).
pricing:
  input_usd_per_million: 0.15
  output_usd_per_million: 0.6

required_env_vars:
  - OPENAI_API_KEY
