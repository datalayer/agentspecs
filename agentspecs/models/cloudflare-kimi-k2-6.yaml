# AI Model Specification: Cloudflare Kimi K2.6

id: "cloudflare:moonshotai/kimi-k2.6"
version: 0.0.1
name: Cloudflare Kimi K2.6
description: Moonshot Kimi K2.6 on Cloudflare Workers AI - 262k context, tool calling; a frontier model billed from AI Gateway credits
provider: cloudflare
default: false
available: true
tokens_limit: 32768

# Hosted through datalayer-ai-inference, which holds the Cloudflare account
# and token and routes the call through the account's AI Gateway. Nothing is
# required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
