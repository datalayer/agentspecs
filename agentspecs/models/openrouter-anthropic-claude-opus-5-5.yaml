# AI Model Specification: OpenRouter Claude Opus 5.5
#
# The id is `openrouter:` and the model as OpenRouter lists it,
# `anthropic/claude-opus-5.5`: what its OpenAI-compatible API takes as `model`.

id: "openrouter:anthropic/claude-opus-5.5"
version: 0.0.1
name: OpenRouter Claude Opus 5.5
description: Claude Opus 5.5 by Anthropic, through OpenRouter - the current frontier Opus, one key for every vendor
provider: openrouter
provider_url: "https://openrouter.ai/anthropic/claude-opus-5.5"
default: false
# Called directly from the agent with the person's OPENROUTER_API_KEY (the
# provider's `via: direct`, the user, 7 November 2026): never through
# ai-inference, which holds no OpenRouter account. Offered wherever the key is.
available: true
tokens_limit: 128000
context_window: 1000000

# OpenRouter's list price for the model, per million tokens, from its models
# API (https://openrouter.ai/api/v1/models, read 2026-11-07): the batch
# variant `anthropic/claude-opus-5.5:batch` is half of it; the catalogue has
# no field for it.
pricing:
  input_usd_per_million: 4.0
  output_usd_per_million: 20.0

required_env_vars:
  - OPENROUTER_API_KEY
