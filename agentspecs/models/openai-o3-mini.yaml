# AI Model Specification: OpenAI o3 Mini

id: "openai:o3-mini"
version: 0.0.1
name: OpenAI o3 Mini
description: o3 Mini by OpenAI - reasoning-focused compact model
provider: openai
provider_url: "https://platform.openai.com/docs/models/o3-mini"
default: false
available: false
tokens_limit: 100000

# OpenAI's Standard-tier price, from
# https://developers.openai.com/api/docs/pricing (read 2026-10-08). Cached
# input is $0.55 per million there; the catalogue has no field for it.
# The same as pydantic/genai-prices (main bd966a9, read 2026-10-08).
pricing:
  input_usd_per_million: 1.1
  output_usd_per_million: 4.4

required_env_vars:
  - OPENAI_API_KEY
