# AI Model Specification: Cloudflare Qwen3.8 27B

id: "cloudflare:wrk/qwen/qwen3.8-27b"
version: 0.0.1
# The id this model had before 0.0.9 named its route; kept so it still resolves.
aliases:
  - "cloudflare:qwen/qwen3.8-27b"
name: Cloudflare Qwen3.8 27B
description: Qwen3.8 27B on Cloudflare Workers AI - 262k context, tool calling, standard billing
provider: cloudflare
provider_url: "https://developers.cloudflare.com/workers-ai/models/qwen3.8-27b/"
default: false
available: false
tokens_limit: 16384
billing: standard
route: workers-ai
context_window: 262144

# Cloudflare's per-token price, from
# https://developers.cloudflare.com/workers-ai/platform/pricing/ (read
# 2026-10-08). Workers AI bills neurons ($0.011 per thousand), which
# ai-inference meters when the answer reports them; this is the same price per
# token, for a call that reports none.
pricing:
  input_usd_per_million: 0.45
  output_usd_per_million: 3.2

# Hosted through datalayer-ai-inference, which holds the Cloudflare account
# and token and routes the call through the account's AI Gateway. Nothing is
# required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
