# AI Model Specification: OpenAI GPT-4o

id: "openai:gpt-4o"
version: 0.0.1
name: OpenAI GPT-4o
description: GPT-4o by OpenAI - fast multimodal model
provider: openai
provider_url: "https://platform.openai.com/docs/models/gpt-4o"
default: false
available: false
tokens_limit: 16384

# OpenAI's Standard-tier price, from
# https://developers.openai.com/api/docs/pricing (read 2026-10-08). Cached
# input is $1.25 per million there; the catalogue has no field for it.
# The same as pydantic/genai-prices (main bd966a9, read 2026-10-08).
pricing:
  input_usd_per_million: 2.5
  output_usd_per_million: 10.0

required_env_vars:
  - OPENAI_API_KEY
