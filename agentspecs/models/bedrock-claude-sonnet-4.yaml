# AI Model Specification: Bedrock Claude Sonnet 4

id: "bedrock:us.anthropic.claude-sonnet-4-20250514-v1:0"
version: 0.0.1
name: Bedrock Claude Sonnet 4
description: Claude Sonnet 4 via AWS Bedrock - strong reasoning
provider: bedrock
provider_url: "https://aws.amazon.com/bedrock/anthropic/"
default: false
available: false
tokens_limit: 64000

# AWS's on-demand price for the US cross-region (geo) inference profile this
# `us.` id names, US East (N. Virginia) — "Geo and In-region Cross-region
# Inference" on https://aws.amazon.com/bedrock/pricing/ (AWS price list
# published 2026-10-07, read 2026-10-08). Cache writes and reads are priced
# apart there (write $3.75, read $0.30); the catalogue has no field for them.
# The same as pydantic/genai-prices (main bd966a9, read 2026-10-08).
pricing:
  input_usd_per_million: 3.0
  output_usd_per_million: 15.0

required_env_vars:
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_DEFAULT_REGION
