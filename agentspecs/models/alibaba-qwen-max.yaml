# AI Model Specification: Alibaba Qwen-Max (Model Studio)

id: "alibaba:qwen-max"
version: 0.0.1
name: Alibaba Qwen-Max
description: Qwen-Max via Alibaba Cloud Model Studio - highest capability Qwen model
provider: alibaba
default: false
available: true
tokens_limit: 32768

# Hosted through datalayer-ai-inference, which holds the Model Studio
# credentials. Nothing is required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
