# AI Model Specification: Cloudflare Gemma 4 26B

id: "cloudflare:google/gemma-4-26b-a4b-it"
version: 0.0.1
name: Cloudflare Gemma 4 26B
description: Google Gemma 4 26B (a4b, instruction-tuned) on Cloudflare Workers AI - 256k context, tool calling, standard billing
provider: cloudflare
default: false
available: true
tokens_limit: 16384

# Hosted through datalayer-ai-inference, which holds the Cloudflare account
# and token and routes the call through the account's AI Gateway. Nothing is
# required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
