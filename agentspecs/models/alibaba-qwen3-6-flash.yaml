# AI Model Specification: Alibaba Qwen3.6-Flash (Model Studio)

id: "alibaba:qwen3.6-flash"
version: 0.0.1
name: Alibaba Qwen3.6-Flash
description: Qwen3.6-Flash via Alibaba Cloud Model Studio - fast and low cost
provider: alibaba
default: false
available: true
tokens_limit: 16384

# Hosted through datalayer-ai-inference, which holds the Model Studio
# credentials. Nothing is required in the agent runtime environment.
required_env_vars: []

capabilities:
  - chat
  - tools
  - codemode
