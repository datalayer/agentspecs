# AI Model Specification: Azure OpenAI GPT-4.1

id: "azure-openai:gpt-4.1"
version: 0.0.1
name: Azure OpenAI GPT-4.1
description: GPT-4.1 via Azure OpenAI - strong general purpose
provider: azure-openai
provider_url: "https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure"
default: false
available: false
tokens_limit: 32768

# Azure OpenAI's Global Standard deployment, priced at OpenAI's list price
# (https://developers.openai.com/api/docs/pricing, read 2026-10-08), as
# pydantic/genai-prices does: its azure provider falls back to OpenAI's
# prices for these models (main bd966a9, read 2026-10-08). Data Zone and
# Regional deployments cost more and are not what this catalogue prices.
pricing:
  input_usd_per_million: 2.0
  output_usd_per_million: 8.0

required_env_vars:
  - AZURE_OPENAI_API_KEY
  - AZURE_OPENAI_ENDPOINT
