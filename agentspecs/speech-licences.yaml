  - {name: sherpa-onnx, kind: library, version: 1.13.8, licence: Apache-2.0, where: browser, status: candidate, source: https://github.com/k2-fsa/sherpa-onnx}
  - {name: "@moonshine-ai/moonshine-js", kind: library, version: 0.1.29, licence: MIT, where: browser, status: candidate, source: https://registry.npmjs.org/@moonshine-ai/moonshine-js, note: "transformers.js runs the same weights and lets Datalayer serve them."}
  - {name: Parler-TTS, kind: model, licence: Apache-2.0, where: server, status: candidate, source: https://github.com/huggingface/parler-tts, note: "English only, last checkpoints 2024."}
  - {name: Piper fr_FR-siwis, kind: voice, licence: CC-BY-4.0, where: server, status: candidate, source: https://huggingface.co/rhasspy/piper-voices}
  - {name: Piper de_DE-thorsten, kind: voice, licence: CC0-1.0, where: server, status: candidate, source: https://huggingface.co/rhasspy/piper-voices}
  - {name: Piper en_GB-alba, kind: voice, licence: CC-BY-4.0, where: server, status: candidate, source: https://huggingface.co/rhasspy/piper-voices}

  - {name: piper-tts, kind: library, version: 1.8.0, licence: GPL-3.0-or-later, where: server, status: candidate, source: https://github.com/OHF-Voice/piper1-gpl}

  # --- refused ---------------------------------------------------------------------------
  - {name: kokoro-js, kind: library, version: 1.2.1, licence: Apache-2.0, where: browser, status: refused, source: https://registry.npmjs.org/kokoro-js, note: "Depends on phonemizer (npm), which runs eSpeak NG: GPL-3.0 in the browser (decision 1)."}
  - {name: phonemizer (npm), kind: library, version: 1.2.1, licence: GPL-3.0-or-later, where: browser, status: refused, source: https://github.com/xenova/phonemizer.js, note: "Labelled Apache-2.0 on npm; it is eSpeak NG compiled to WASM."}
  - {name: Piper en_US-lessac, kind: voice, licence: Blizzard-2013, where: server, status: refused, source: https://huggingface.co/rhasspy/piper-voices, note: "Research use only."}
  - {name: Piper en_US-ryan, kind: voice, licence: CC-BY-NC-SA-4.0, where: server, status: refused, source: https://huggingface.co/rhasspy/piper-voices}
  - {name: Moonshine legacy non-English models, kind: model, licence: Moonshine-Community-License, where: browser, status: refused, source: https://github.com/moonshine-ai/moonshine, note: "Non-commercial."}
  - {name: Coqui XTTS-v2, kind: model, licence: CPML, where: server, status: refused, source: https://huggingface.co/coqui/XTTS-v2, note: "Non-commercial, and nobody left to sell a licence."}
  - {name: Web Speech API, kind: library, licence: proprietary, where: browser, status: refused, source: https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API, note: "Not open source; recognition goes to the browser vendor by default (decision 2)."}
