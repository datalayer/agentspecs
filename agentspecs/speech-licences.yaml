# The licence register of voice (VOICE.md VO-01, §4.6).
#
# Every library, model, voice and dataset voice uses or was weighed, with its
# licence and where that was read, checked on 2026-10-05. Code and weights are
# licensed apart: a model is admitted by the licence of its weights, a voice by
# its weights and the data it was trained on.
#
# `allowed`: what may run anywhere, the browser included — and so be
# distributed. `server_only`: what may run on Datalayer's servers and is never
# sent to a browser (GPL-3.0 is not the AGPL: running it is not distributing
# it; decision 1). Everything else is refused. The catalogue's test
# (`tests/test_speech.py`) reads these lists: a voice or a model whose licence
# is not on them does not load, and every voice and model of the catalogue is
# named here.
#
# Reviewed by counsel: not yet (VO-01).

reviewed_by_counsel: false
checked_on: "2026-10-05"

allowed:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - ISC
  - CC0-1.0
  - CC-BY-4.0

server_only:
  - GPL-3.0-or-later
  - GPL-3.0-only
  - LGPL-2.1-or-later
  - LGPL-3.0-or-later

entries:
  # --- in the browser, used ----------------------------------------------------------
  - name: "@huggingface/transformers"
    kind: library
    version: 4.3.0
    licence: Apache-2.0
    where: browser
    status: used
    source: https://registry.npmjs.org/@huggingface/transformers
    note: Runs Moonshine and Whisper. Its own dependencies below; sharp is Node's only, never in the browser build.
  - name: onnxruntime-web
    kind: library
    version: 1.31.0-dev.20260914-8d85527a0
    licence: MIT
    where: browser
    status: used
    source: https://registry.npmjs.org/onnxruntime-web
    note: What transformers.js 4.3.0 pins; vad-web's peer (^1.17.0) is the same one.
  - {name: onnxruntime-common, kind: library, version: 1.31.0-dev, licence: MIT, where: browser, status: used, source: https://registry.npmjs.org/onnxruntime-common}
  - {name: "@huggingface/jinja", kind: library, version: 0.5.10, licence: MIT, where: browser, status: used, source: https://registry.npmjs.org/@huggingface/jinja}
  - {name: "@huggingface/tokenizers", kind: library, version: 0.2.0, licence: Apache-2.0, where: browser, status: used, source: https://registry.npmjs.org/@huggingface/tokenizers}
  - {name: flatbuffers, kind: library, version: 25.9.23, licence: Apache-2.0, where: browser, status: used, source: https://registry.npmjs.org/flatbuffers}
  - {name: guid-typescript, kind: library, version: 1.0.9, licence: ISC, where: browser, status: used, source: https://registry.npmjs.org/guid-typescript}
  - {name: long, kind: library, version: 5.3.2, licence: Apache-2.0, where: browser, status: used, source: https://registry.npmjs.org/long}
  - {name: platform, kind: library, version: 1.3.6, licence: MIT, where: browser, status: used, source: https://registry.npmjs.org/platform}
  - {name: protobufjs, kind: library, version: 7.6.6, licence: BSD-3-Clause, where: browser, status: used, source: https://registry.npmjs.org/protobufjs}
  - name: "@ricky0123/vad-web"
    kind: library
    version: 0.0.31
    licence: ISC
    where: browser
    status: used
    source: https://registry.npmjs.org/@ricky0123/vad-web
    note: Silero VAD on onnxruntime-web; push-to-talk keeps the speech it finds.
  - name: moonshine-tiny-en
    kind: model
    licence: MIT
    where: browser
    status: used
    source: https://huggingface.co/UsefulSensors/moonshine-tiny
    note: Only the English and the streaming Moonshine models are MIT (VO-04).
  - {name: moonshine-base-en, kind: model, licence: MIT, where: browser, status: used, source: https://huggingface.co/UsefulSensors/moonshine-base}
  - {name: whisper-base, kind: model, licence: MIT, where: browser, status: used, source: https://huggingface.co/openai/whisper-base}
  - {name: silero-vad, kind: model, licence: MIT, where: browser, status: used, source: https://github.com/snakers4/silero-vad}

  # --- on the server (datalayer-speech), used ------------------------------------------
  - {name: kokoro-82m, kind: model, licence: Apache-2.0, where: server, status: used, source: https://huggingface.co/hexgrad/Kokoro-82M}
  - name: kokoro-onnx
    kind: library
    version: 0.6.1
    licence: MIT
    where: server
    status: used
    source: https://pypi.org/pypi/kokoro-onnx/json
  - name: phonemizer
    kind: library
    version: 3.4.0
    licence: GPL-3.0-or-later
    where: server
    status: used
    source: https://pypi.org/pypi/phonemizer/json
    note: kokoro-onnx's G2P; on the server only, in a private image.
  - name: espeakng-loader
    kind: library
    version: 0.2.4
    licence: MIT
    where: server
    status: used
    source: https://pypi.org/pypi/espeakng-loader/json
    note: Ships the eSpeak NG library (GPL-3.0-or-later), below.
  - name: eSpeak NG
    kind: library
    licence: GPL-3.0-or-later
    where: server
    status: used
    source: https://github.com/espeak-ng/espeak-ng
    note: On the server only. Never in a browser bundle (decision 1, 2026-10-05).
  - {name: onnxruntime, kind: library, version: 1.30.0, licence: MIT, where: server, status: used, source: https://pypi.org/pypi/onnxruntime/json}
  - {name: soundfile, kind: library, version: 0.14.0, licence: BSD-3-Clause, where: server, status: used, source: https://pypi.org/pypi/soundfile/json}
  - {name: libsndfile, kind: library, version: 1.2.2, licence: LGPL-2.1-or-later, where: server, status: used, source: https://github.com/libsndfile/libsndfile, note: "Inside soundfile's wheel."}
  - {name: jiwer, kind: library, version: 4.0.0, licence: Apache-2.0, where: server, status: used, source: https://pypi.org/pypi/jiwer/json, note: "The WER check (VO-51), in tests only."}

  # --- voices ----------------------------------------------------------------------------
  - {name: kokoro-af-heart, kind: voice, licence: Apache-2.0, where: server, status: used, source: https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md}
  - {name: kokoro-bf-emma, kind: voice, licence: Apache-2.0, where: server, status: used, source: https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md}
  - {name: kokoro-ff-siwis, kind: voice, licence: Apache-2.0, where: server, status: used, source: https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md, note: "Weights Apache-2.0; trained on the SIWIS database (CC-BY-4.0), attributed in the catalogue."}

  # --- datasets ----------------------------------------------------------------------------
  - {name: SIWIS French Speech Synthesis Database, kind: dataset, licence: CC-BY-4.0, where: server, status: used, source: https://datashare.ed.ac.uk/handle/10283/2353}
  - {name: LibriSpeech test-clean, kind: dataset, licence: CC-BY-4.0, where: tests, status: used, source: https://www.openslr.org/12, note: "English fixtures of the WER check (VO-50)."}
  - {name: Multilingual LibriSpeech (French), kind: dataset, licence: CC-BY-4.0, where: tests, status: used, source: https://www.openslr.org/94, note: "French fixtures of the WER check (VO-50)."}

  # --- weighed, not used (§4) ------------------------------------------------------------
  - {name: faster-whisper, kind: library, version: 1.2.1, licence: MIT, where: server, status: candidate, source: https://pypi.org/pypi/faster-whisper/json, note: "Server speech-to-text, Phase V2."}
  - {name: whisper-large-v3-turbo, kind: model, licence: MIT, where: server, status: candidate, source: https://huggingface.co/openai/whisper-large-v3-turbo}
  - {name: Parakeet TDT 0.6B v3, kind: model, licence: CC-BY-4.0, where: server, status: candidate, source: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3}
