# The licence register of voice (VO-01).
#
# Every library, model, voice and dataset voice uses or was weighed, with its
# licence and where that was read, checked on 2026-10-20. Code and weights are
# licensed apart: a model is admitted by the licence of its weights, a voice by
# its weights and the data it was trained on.
#
# `allowed`: what may run anywhere, the browser included — and so be
# distributed. `server_only`: what may run on Datalayer's servers and is never
# sent to a browser (GPL-3.0 is not the AGPL: running it is not distributing
# it). `accepted_on_the_machine`: the server-only libraries, each named with its
# licence, that pip installs from PyPI on the person's own machine when
# agent-runtimes' `voice` extra is installed — accepted by the owner, kept in the
# extra; any other one there is refused. Everything else is refused. The catalogue's test
# (`tests/test_speech.py`) reads these lists: a voice or a model whose licence
# is not on them does not load, and every voice and model of the catalogue is
# named here.
#
# Reviewed by the owner on 2026-10-20 (VO-01, VO-64), not by counsel: the
# register, the voices' provenance (Kokoro's training data is not published per
# voice, part of it is synthetic audio from commercial speech services, so no
# speaker's consent is on record for Heart or Emma), and eSpeak NG's GPL and
# FFmpeg's LGPL reaching the person's machine through the `voice` extra.

reviewed_by: owner
reviewed_on: "2026-10-20"
checked_on: "2026-10-20"

allowed:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - ISC
  - CC0-1.0
  - CC-BY-4.0

server_only:
  - GPL-3.0-or-later
  - GPL-3.0-only
  - LGPL-2.1-or-later
  - LGPL-3.0-or-later

# Installed from PyPI on the person's own machine by agent-runtimes' `voice`
# extra (pip, not a copy Datalayer hosts), accepted by the owner on 2026-10-20
# and kept in the extra. Each name has a `machine` entry below with this licence.
accepted_on_the_machine:
  - {name: phonemizer, licence: GPL-3.0-or-later}
  - {name: eSpeak NG, licence: GPL-3.0-or-later}
  - {name: FFmpeg, licence: LGPL-2.1-or-later}

