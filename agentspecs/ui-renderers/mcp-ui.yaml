# UI Renderer Specification: MCP UI
#
# How a UI plugin's interface reaches a host that is not Datalayer's own page
# (AGENTIC_UI R8). Not an interface: a UI plugin (`agentspecs/ui`) says the
# renderers it may be exposed through, and an application names, per plugin,
# the one it uses.

id: "mcp-ui"
version: 0.0.1
name: MCP UI
description: >-
  An MCP tool answers with a UI resource — HTML, a remote page or a component — that the host renders in place of plain text.
docs_url: "https://mcpui.dev/"
# Whether an application may be exposed through it today.
enabled: false
