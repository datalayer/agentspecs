# UI Renderer Specification: A2UI
#
# How a UI plugin's interface reaches a host that is not Datalayer's own page
# (R8). Not an interface: a UI plugin (`agentspecs/ui`) says the
# renderers it may be exposed through, and an application names, per plugin,
# the one it uses.

id: "a2ui"
version: 0.0.1
name: A2UI
description: >-
  An agent describes an interface — a form, a table, a card — as a tree of components from a catalogue the host allows, and the host renders it; what the user does in it comes back to the agent as an action.
docs_url: "https://a2ui.org/"
# Whether an application may be exposed through it today.
enabled: true
