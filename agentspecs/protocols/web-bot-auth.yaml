# An agent protocol Datalayer targets. `status` says it as
# it stands: `shipped` when agent-runtimes implements it today, `planned`
# otherwise — an application cannot ship speaking a planned one.
id: web-bot-auth
version: 0.0.1
name: Web Bot Auth
description: >-
  Signed outbound requests (RFC 9421) and the key directory a website checks them against. In applications, every request to a company, business or merchant is signed, and a signed fetch reads pages at the sites an application names, GET only (decided 2026-10-13).
publisher: Cloudflare (IETF draft)
layer: identity
spec_url: https://datatracker.ietf.org/doc/draft-ietf-webbotauth-httpsig-protocol/
spec_version: "draft-ietf-webbotauth-httpsig-protocol-00"
status: shipped
connects: Websites, which can tell the application's requests from someone pretending
packages:
  python: ["agent-runtimes"]
  typescript: ["@datalayer/agent-runtimes", "web-bot-auth"]
# Its tools' action classes, under protocol-tools/ (agentspecs.actions).
protocol_tools: ["signed-fetch"]
# The Appspec block it is configured by: refused unless `protocols` lists it.
# A signed fetch reads a page at a site it names (EX-11).
appspec_block: signed_fetch
