# An agent protocol Datalayer targets (AGENT_PROTOCOLS §1). `status` says it as
# it stands: `shipped` when agent-runtimes implements it today, `planned`
# otherwise — an application cannot ship speaking a planned one.
id: tap
version: 0.0.1
name: Trusted Agent Protocol
description: >-
  An agent-recognition profile over Web Bot Auth for merchants: a signature tagged agent-browser-auth to browse or agent-payer-auth to pay. Built as a draft from Visa's public Merchant Specifications (2026-10-13) in agent-runtimes; planned for applications until Visa confirms it.
publisher: Visa
layer: identity
spec_url: https://developer.visa.com/capabilities/trusted-agent-protocol/trusted-agent-protocol-specifications
spec_version: "draft (Merchant Specifications, read 2026-10-13)"
status: planned
connects: Merchants that recognise an agent by its signature
packages:
  python: ["agent-runtimes"]
  typescript: ["@datalayer/agent-runtimes", "http-message-sig"]
# Its tools' action classes, under protocol-tools/ (agentspecs.actions).
protocol_tools: []
