# An agent protocol Datalayer targets (AGENT_PROTOCOLS §1). `status` says it as
# it stands: `shipped` when agent-runtimes implements it today, `planned`
# otherwise — an application cannot ship speaking a planned one.
id: mcp
version: 0.0.1
name: Model Context Protocol
description: >-
  How an agent calls tools and reads resources: clients and servers in both languages, and the MCP gateway every connection goes through.
publisher: Anthropic
layer: transport
spec_url: https://modelcontextprotocol.io/specification
spec_version: "2026-07-28 (Python), 2025-11-25 (TypeScript)"
status: shipped
connects: Tools, resources and prompts served by MCP servers
packages:
  python: ["mcp"]
  typescript: ["@modelcontextprotocol/sdk", "@mcp-ui/client"]
# Its tools' action classes, under protocol-tools/ (agentspecs.actions).
protocol_tools: []
