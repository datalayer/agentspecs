# An agent protocol Datalayer targets. `status` says it as
# it stands: `shipped` when agent-runtimes implements it today, `planned`
# otherwise — an application cannot ship speaking a planned one.
id: pap
version: 0.0.1
name: Personal Agent Protocol
description: >-
  A person's agent working with a company for them — signed out, then signed in at the company, its changes confirmed by the person — and an application being a company personal agents reach.
publisher: Sierra, Meta
layer: consent
# The specification, published from github.com/personal-agent-protocol/personal-agent-protocol.
spec_url: https://personalagentprotocol.org
spec_version: "draft 0.3"
status: shipped
connects: Companies, as a person's agent there, or being one
packages:
  python: ["personal-agent-protocol"]
  typescript: ["@datalayer/personal-agent-protocol"]
# Its tools' action classes, under protocol-tools/ (agentspecs.actions).
protocol_tools: ["pap"]
# The Appspec block it is configured by: refused unless `protocols` lists it.
appspec_block: pap
