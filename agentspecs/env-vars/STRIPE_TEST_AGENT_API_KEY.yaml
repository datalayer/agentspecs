id: STRIPE_TEST_AGENT_API_KEY
version: 0.0.1
name: Stripe Agent API Key (test mode)
description: >-
  A Stripe agent API key created in a sandbox (test mode), never a live key:
  sent as the Bearer token to Stripe's MCP server at https://mcp.stripe.com.
  Create it in the Stripe Dashboard of a sandbox (Developers › API keys ›
  Create agent key) with only the permissions the agent needs (Checkout
  Sessions write, Products and Prices read). Since December 2026 Stripe's MCP
  server takes only agent API keys or OAuth, no secret or plain restricted key.
  In test mode no card is charged: Stripe's test cards (4242 4242 4242 4242)
  pay on Stripe's page.
registrationUrl: https://docs.stripe.com/keys#agent-keys
tags:
  - authentication
  - api-key
  - stripe
  - payments
  - test-mode

icon: key
emoji: 🔑
