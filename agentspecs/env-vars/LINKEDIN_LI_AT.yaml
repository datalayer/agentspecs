# The person's LinkedIn session, pasted once (the user, 15 November 2026):
# LinkedIn's reCAPTCHA loops forever when the sign-in is made from the
# runtime's browser on an AWS address, so the session is the one the person's
# own browser already holds. Kept in their Vault secrets under this name
# (Settings › LinkedIn saves it here), given to each new runtime of theirs
# whose agent uses the linkedin MCP server, never required, and written there
# as that server's signed-in session. Never to a deployment or a visitor.

id: LINKEDIN_LI_AT
version: 0.0.1
name: LinkedIn session cookie (li_at)
description: >-
  Your LinkedIn session for your agents' reading: the **value of the cookie
  named `li_at`** on `www.linkedin.com`, copied from a browser where you are
  signed in to LinkedIn. Not `JSESSIONID`, `bcookie`, `bscookie`, `liap` or
  `lidc`: only `li_at`. It is a long string, usually starting with `AQED`.


  **Chrome or Edge:** open https://www.linkedin.com signed in, press F12 (or
  right-click › Inspect), then Application › Storage › Cookies ›
  `https://www.linkedin.com`, find the row named `li_at` and copy its Value
  column (double-click the value, then copy).


  **Firefox:** open https://www.linkedin.com signed in, press F12, then
  Storage › Cookies › `https://www.linkedin.com`, select the row `li_at` and
  copy its Value.


  **Safari:** Settings › Advanced › Show features for web developers, then
  Develop › Show Web Inspector › Storage › Cookies › `www.linkedin.com` › `li_at`.


  Paste it in Settings › LinkedIn (or as a secret named `LINKEDIN_LI_AT`).
  It is stored encrypted in your Vault secrets and handed to each new runtime
  of yours whose agent reads LinkedIn (the Marketer's linkedin MCP server),
  never to anybody else's. It works until you sign out of LinkedIn in that
  browser, or it expires (about a year): then paste a new one. Treat it like
  a password: whoever holds it is signed in to LinkedIn as you.
registrationUrl: https://www.linkedin.com
tags:
  - authentication
  - cookie
  - linkedin
  - social
icon: key
emoji: 🔑
