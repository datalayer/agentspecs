# Builds and tests every push to main and every pull request. Publishing is
# `release.yaml`'s, on a pushed `v*` tag, and runs these same checks first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          twine check --strict dist/*

      - name: Check the wheel carries the specs
        run: |
          set -euo pipefail
          unzip -Z1 dist/*.whl > wheel-files.txt
          grep -q '^agentspecs/agents/.*\.yaml$' wheel-files.txt
          grep -q '^agentspecs/models/.*\.yaml$' wheel-files.txt
          grep -q '^agentspecs/teams/.*\.yaml$' wheel-files.txt
          grep -q '^agentspecs/frames/.*\.yaml$' wheel-files.txt
          grep -q '^agentspecs/cogs/.*\.yaml$' wheel-files.txt
          for kind in ops guards gates tracks apps; do grep -q "^agentspecs/$kind/.*\.yaml$" wheel-files.txt; done
          grep -q '^agentspecs/apps/appspec\.schema\.json$' wheel-files.txt

      - name: Import the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import agentspecs; from agentspecs.models import list_models; from agentspecs.teams import list_teams; from agentspecs.frames import list_frames; from agentspecs.cogs import list_cogs, get_resolved_cog; assert all(get_resolved_cog(cog.id)['frames'] for cog in list_cogs()); print(agentspecs.__version__, len(list_models()), 'models,', len(list_teams()), 'teams,', len(list_frames()), 'frames,', len(list_cogs()), 'cogs')"
          /tmp/wheel-env/bin/python -c "from agentspecs.ops import list_ops, get_resolved_op; from agentspecs.guards import list_guards; from agentspecs.gates import list_gates; from agentspecs.tracks import list_tracks; assert all(get_resolved_op(op.id)['track'] for op in list_ops()); print(len(list_ops()), 'ops,', len(list_guards()), 'guards,', len(list_gates()), 'gates,', len(list_tracks()), 'tracks')"
          /tmp/wheel-env/bin/python -c "from agentspecs.apps import list_apps, app_problems, SCHEMA_PATH, schema_text; from agentspecs.actions import tool_specs, tool_classes; assert all(not app_problems(app) for app in list_apps()); assert SCHEMA_PATH.read_text() == schema_text(); assert all(tool_classes(tool) for tool in tool_specs().values()); print(len(list_apps()), 'applications')"

      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install ".[test]"

      - name: Test
        run: python -m pytest tests -v
